<style>

  add('roles',t.roles,'tpl');add('modules',t.mods,'tpl');add('objects',t.objs,'tpl');add('integrations',t.ints,'pkg');
  add('compliance',['Audit trail on every record','Role-based access control'],'pkg');add('compliance',['e-Signatures on approvals (21 CFR Part 11)'],'agent');
  if(src==='psp'){add('roles',['Partner pharmacist','Brand team (read-only)'],'brief');add('modules',['Adherence reminders','Brand dashboard'],'brief');add('objects',['Eligibility','Pharmacy'],'brief');add('compliance',['Consent before enrollment'],'pkg');add('compliance',['PII masked for brand team','DPDP retention policy'],'agent')}
