# HCP Event Management: the template's starting point. Event managers plan
# advisory boards, CMEs and congress sponsorships, compliance approves them,
# HCPs are invited and RSVP in their own login, attendance is captured per
# session, and every transfer of value is logged and reported per HCP.
# The analyst tailors every part of this to the requirement. Settle early who
# signs off spend reporting: a single approver, maker-checker, or a role-based
# approval matrix.
spec_version: 1

app:
  code: hcp_events
  name: HCP Event Management
  description: Plan advisory boards, CMEs and congresses, invite HCPs, capture attendance and report spend per HCP.
  timezone: Asia/Kolkata
  locale: en-IN
  currency: INR
  theme: { primary: "#0F766E", secondary: "#64748B" }
  custom_requirements:
    - area: integration
      title: CRM sync
      text: HCP master records (name, speciality, registration no., institution) are synced nightly from the CRM; invitations and attendance are pushed back as engagement activities.
    - area: integration
      title: ERP connector
      text: Verified spend lines are posted to the ERP against the event's cost centre and PO; payment status comes back by the next morning.

choice_sets:
  event_type:
    - { id: advisory_board, label: Advisory board, color: purple }
    - { id: cme,            label: CME,            color: blue }
    - { id: congress,       label: Congress,       color: indigo }
    - { id: round_table,    label: Round table,    color: teal }
    - { id: webinar,        label: Webinar,        color: pink }
  event_format:
    - { id: in_person, label: In person }
    - { id: virtual,   label: Virtual }
    - { id: hybrid,    label: Hybrid }
  hcp_category:
    - { id: kol_national, label: National KOL, color: purple }
    - { id: kol_regional, label: Regional KOL, color: indigo }
    - { id: practitioner, label: Practitioner, color: blue }
  event_role:
    - { id: delegate,  label: Delegate }
    - { id: speaker,   label: Speaker }
    - { id: chair,     label: Chair }
    - { id: panelist,  label: Advisory panelist }
  checkin_method:
    - { id: qr,        label: QR scan }
    - { id: sign_in,   label: Sign-in sheet }
    - { id: virtual,   label: Virtual log }
  spend_category:
    - { id: honorarium,    label: Honorarium,       color: purple }
    - { id: travel,        label: Travel,           color: blue }
    - { id: accommodation, label: Accommodation,    color: teal }
    - { id: meals,         label: Meals,            color: amber }
    - { id: registration,  label: Registration fee, color: indigo }
    - { id: venue,         label: Venue and AV,     color: gray }

roles:
  - name: Event Manager
    description: Plans events, invites HCPs, captures attendance and records spend.
    landing: events
    menu:
      - { page: dashboard,   icon: layout-dashboard }
      - { page: events,      icon: calendar-days }
      - { page: invitations, icon: mail }
      - { page: attendance,  icon: clipboard-check }
      - { page: spend,       icon: receipt }
      - { page: hcps,        label: HCPs, icon: stethoscope }
      - group: Master Data
        icon: database
        items:
          - { page: specialities }
  - name: Compliance Reviewer
    description: Approves events and HCP engagements, verifies attendance and spend, and signs off transparency reporting.
    landing: events
    menu:
      - { page: dashboard,  icon: layout-dashboard }
      - { page: events,     icon: calendar-days }
      - { page: invitations, icon: mail }
      - { page: attendance, icon: clipboard-check }
      - { page: spend,      label: Spend Ledger, icon: indian-rupee }
      - { page: hcps,       label: HCPs, icon: stethoscope }
  - name: HCP
    description: External login for the invited healthcare professional; sees and answers only their own invitations.
    landing: invitations
    menu:
      - { page: invitations, label: My Invitations, icon: mail }
      - { page: events,      label: My Events,      icon: calendar-days }
      - { page: spend,       label: My Transfers of Value, icon: wallet }

pages:
  - { code: events,       type: crud,   entity: event,      route: /app/events,       title: Events }
  - { code: event_360,    type: detail, detail_view: event_360, route: /app/events/:id }
  - { code: hcps,         type: crud,   entity: hcp,        route: /app/hcps,         title: HCPs }
  - { code: invitations,  type: crud,   entity: invitation, route: /app/invitations,  title: Invitations }
  - { code: attendance,   type: crud,   entity: attendance, route: /app/attendance,   title: Attendance }
  - { code: spend,        type: crud,   entity: spend_line, route: /app/spend,        title: Spend }
  - { code: specialities, type: crud,   entity: speciality, route: /app/masters/specialities, title: Specialities }
  - code: dashboard
    type: custom
    route: /app/dashboard
    title: Dashboard
    component: HcpEventDashboard
    roles: [Event Manager, Compliance Reviewer]
    text: >
      KPI row: events this quarter, events awaiting compliance approval, RSVP acceptance rate,
      spend this quarter against budget. Below: spend by event type (bar), upcoming events with
      accepted vs capacity, and HCPs within 10% of their annual transfer-of-value cap.
    preview: |
      const ev = ctx.rows('event'), inv = ctx.rows('invitation'), sp = ctx.rows('spend_line'), hcps = ctx.rows('hcp');
      const now = new Date(), qS = new Date(now.getFullYear(), Math.floor(now.getMonth() / 3) * 3, 1), qE = new Date(qS.getFullYear(), qS.getMonth() + 3, 1);
      const inQ = d => d && new Date(d) >= qS && new Date(d) < qE, sum = (rs, k) => rs.reduce((a, r) => a + (+r[k] || 0), 0);
      const inr = v => v >= 1e7 ? '₹' + (v / 1e7).toFixed(2) + ' Cr' : v >= 1e5 ? '₹' + (v / 1e5).toFixed(1) + ' L' : '₹' + Math.round(v).toLocaleString('en-IN');
      const qEv = ev.filter(e => e.status !== 'cancelled' && e.start_date && new Date(e.start_date) < qE && new Date(e.end_date || e.start_date) >= qS), qSpend = sum(sp.filter(s => inQ(s.incurred_on)), 'amount'), qBud = sum(qEv, 'budget');
      const asked = inv.filter(i => ['sent', 'accepted', 'declined'].includes(i.status)), acc = asked.filter(i => i.status === 'accepted').length;
      const evOf = id => ev.find(e => e.id === id) || {}, types = ctx.entity('event').fields.find(f => f.key === 'event_type').opts || [];
      const byT = types.map(t => ({ label: t.label, v: sum(sp.filter(s => evOf(s.event).event_type === t.id), 'amount') })), top = Math.max(1, ...byT.map(t => t.v));
      const up = ev.filter(e => ['approved', 'open'].includes(e.status) && new Date(e.end_date || e.start_date) >= new Date(now.toDateString())).sort((a, b) => String(a.start_date).localeCompare(String(b.start_date)));
      const accOf = e => inv.filter(i => i.event === e.id && i.status === 'accepted').length || +e.accepted_count || 0;
      const capNear = hcps.filter(h => +h.annual_cap && +h.ytd_spend >= 0.9 * +h.annual_cap).sort((a, b) => b.ytd_spend / b.annual_cap - a.ytd_spend / a.annual_cap);
      const pct = qBud ? Math.round(100 * qSpend / qBud) : 0;
      return `
      <div class="pv-kpis">
        <div class="pv-kpi" data-go="events"><span>Events this quarter</span><b>${qEv.length}</b></div>
        <div class="pv-kpi" data-go="events"><span>Awaiting compliance approval</span><b style="color:#B54708">${ev.filter(e => e.status === 'review').length}</b></div>
        <div class="pv-kpi" data-go="invitations"><span>RSVP acceptance</span><b>${asked.length ? Math.round(100 * acc / asked.length) : 0}%</b><span>${acc} of ${asked.length} invited</span></div>
        <div class="pv-kpi" data-go="spend"><span>Spend this quarter vs budget</span><b>${inr(qSpend)}</b><div class="pv-bar" style="margin-top:6px"><i style="width:${Math.min(100, pct)}%;${pct > 100 ? 'background:#D92D20' : ''}"></i></div><span>${pct}% of ${inr(qBud)}</span></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1.3fr;gap:12px;align-items:start">
        <div class="d-panel"><h3>${ctx.icon('bar-chart-3')}Spend by event type</h3><div style="padding:12px 16px;display:flex;flex-direction:column;gap:10px">${byT.map(t => `
          <div style="display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;font-size:13px"><b style="font-weight:550">${ctx.esc(t.label)}</b><div class="pv-bar" style="height:12px"><i style="width:${Math.round(100 * t.v / top)}%"></i></div><span class="pv-muted" style="text-align:right">${inr(t.v)}</span></div>`).join('')}</div></div>
        <div class="d-panel"><h3>${ctx.icon('calendar-days')}Upcoming events<span class="sp"></span><span class="pv-badge">${up.length}</span></h3><table class="z-t"><thead><tr><th>Event</th><th>Date</th><th>City</th><th style="width:34%">Accepted / capacity</th></tr></thead><tbody>${up.slice(0, 6).map(e => { const a = accOf(e), c = +e.capacity || 0; return `
          <tr class="click" data-go="event_360:${e.id}"><td><b style="font-weight:550">${ctx.esc(e.title)}</b><div class="pv-muted">${ctx.esc(ctx.fmt(e, 'event_type'))} · ${ctx.esc(ctx.fmt(e, 'format'))}</div></td><td>${ctx.esc(ctx.fmt(e, 'start_date'))}</td><td>${ctx.esc(e.city || '')}</td>
            <td><div class="pv-bar"><i style="width:${c ? Math.min(100, Math.round(100 * a / c)) : 0}%"></i></div><span class="pv-muted">${a} / ${c || '—'}</span></td></tr>`; }).join('') || '<tr><td colspan="4" class="pv-muted">No approved events coming up.</td></tr>'}</tbody></table></div>
      </div>
      <div class="d-panel"><h3>${ctx.icon('shield-alert')}HCPs within 10% of their annual cap<span class="sp"></span><span class="pv-badge">${capNear.length}</span></h3><table class="z-t"><thead><tr><th>HCP</th><th>Speciality</th><th>Institution</th><th>YTD spend</th><th>Annual cap</th><th>Used</th></tr></thead><tbody>${capNear.slice(0, 8).map(h => { const u = Math.round(100 * h.ytd_spend / h.annual_cap); return `
        <tr class="click" data-go="hcps"><td><b style="font-weight:550">${ctx.esc(h.full_name)}</b>${h.government_official ? ' <span class="pv-badge">Govt official</span>' : ''}</td><td>${ctx.esc(ctx.fmt(h, 'speciality'))}</td><td>${ctx.esc(h.institution || '')}</td><td>${inr(+h.ytd_spend)}</td><td>${inr(+h.annual_cap)}</td><td style="color:${u >= 100 ? '#B42318' : '#B54708'};font-weight:600">${u}%</td></tr>`; }).join('') || '<tr><td colspan="6" class="pv-muted">No HCP is near their transfer-of-value cap.</td></tr>'}</tbody></table></div>`;

modules:
  - code: masters
    name: Master Data
    description: Reference lists and the HCP master.
    entities:
      - code: speciality
        name: Speciality
        plural: Specialities
        kind: master
        display: name
        fields:
          - name: { type: text, required: true, unique: true }
        access:
          Event Manager:       { actions: [view, add, edit] }
          Compliance Reviewer: { actions: [view] }
        table:
          columns:
            - name: { label: Speciality, searchable: true, sortable: true }
          default_sort: name
          add_button: Add Speciality
          row_actions:
            - { key: edit, label: Edit, type: edit }
        form:
          create: { fields: [name] }
          edit:   { same_as: create }

      - code: hcp
        name: HCP
        plural: HCPs
        kind: master
        display: full_name
        app_user: { role: HCP, name: full_name, email: email, mobile: phone, create_on: status == verified }
        fields:
          - hcp_ref:         { type: text, label: HCP ID, readonly: true, unique: true, auto: { sequence: "HCP-{00000}" } }
          - full_name:       { type: text, required: true, max_length: 150 }
          - speciality:      { type: link, to: speciality, required: true, display: name }
          - institution:     { type: text, required: true }
          - city:            { type: text, required: true }
          - registration_no: { type: text, label: Medical registration no., required: true, unique: true }
          - category:        { type: choice, choices: hcp_category, required: true, default: practitioner }
          - email:           { type: email, required: true }
          - phone:           { type: phone }
          - government_official: { type: boolean, label: Government employed, default: false, help: Government-employed HCPs need employer permission before any engagement. }
          - annual_cap:      { type: money, label: Annual ToV cap }
          - ytd_spend:       { type: money, label: ToV this year, readonly: true, computed: Sum of spend_line.amount for this HCP in the current calendar year. }
        validation:
          duplicate_check:
            rules:
              - { match: [registration_no], compare: exact, on_match: block, message: This HCP is already in the master. }
              - { match: [full_name, city], compare: fuzzy, on_match: warn, message: A similar HCP exists in this city. }
        access:
          Event Manager:       { actions: [view, add, edit, export] }
          Compliance Reviewer: { actions: [view, edit, export] }
          HCP:                 { actions: [view], rows: { own: id } }
        workflow:
          statuses:
            - { code: pending,  label: Pending Verification, color: amber, initial: true }
            - { code: verified, label: Verified,             color: green }
            - { code: inactive, label: Inactive,             color: gray, final: true }
          transitions:
            - { name: verify, label: Verify, from: pending, to: verified, roles: [Compliance Reviewer], primary: true, condition: { text: The registration number is valid on the medical council register. }, condition_msg: Check the registration number first., on_done: Create the HCP login and email the welcome link. }
            - { name: deactivate, label: Deactivate, from: verified, to: inactive, roles: [Compliance Reviewer], tone: danger, form: [ { deactivate_reason: { type: long_text, required: true } } ] }
          tags:
            - { code: cap_near, label: Near annual cap, color: amber, system: true, text: Set when ytd_spend reaches 90% of annual_cap; cleared on 1 January. }
        form:
          create:
            roles: [Event Manager]
            title: Add HCP
            sections:
              - { title: HCP, fields: [full_name, speciality, category, institution, city, registration_no, government_official] }
              - { title: Contact, fields: [email, phone] }
          edit:
            same_as: create
        table:
          columns:
            - hcp_ref:     { label: ID, searchable: true }
            - full_name:   { label: HCP, searchable: true, sortable: true }
            - speciality:  { label: Speciality, display: name, filterable: true }
            - institution: { label: Institution }
            - city:        { label: City, filterable: true }
            - category:    { label: Category, filterable: true }
            - ytd_spend:   { label: ToV YTD, format: money, sortable: true }
            - status:      { source: status, label: Status, filterable: true }
            - tags:        { source: tags, label: Tags }
          default_sort: full_name
          quick_filters:
            - { label: To verify, where: status == pending, roles: [Compliance Reviewer] }
            - { label: KOLs, where: "category in [kol_national, kol_regional]" }
          add_button: Add HCP
          row_actions:
            - { key: edit, label: Edit, type: edit }

  - code: events
    name: Events
    description: Event planning, invitations, attendance and spend.
    entities:
      - code: event
        name: Event
        plural: Events
        kind: hero
        display: title
        fields:
          - event_ref:     { type: text, label: Event ID, readonly: true, unique: true, auto: { sequence: "EVT-{YY}-{000}" } }
          - title:         { type: text, required: true, max_length: 200 }
          - event_type:    { type: choice, choices: event_type, required: true }
          - therapy_area:  { type: text, required: true }
          - objective:     { type: long_text, required: true, help: The scientific or business need this event answers. }
          - start_date:    { type: date, required: true }
          - end_date:      { type: date, required: true }
          - format:        { type: choice, choices: event_format, required: true, default: in_person }
          - city:          { type: text }
          - venue:         { type: text }
          - capacity:      { type: integer, required: true, min: 2, max: 300 }
          - budget:        { type: money, required: true }
          - accepted_count: { type: integer, label: Accepted, readonly: true, computed: Count of invitations for this event with status accepted. }
          - actual_spend:  { type: money, readonly: true, computed: Sum of spend_line.amount for this event. }
          - agenda:        { type: file, accept: [pdf, docx] }
        validation:
          rules:
            - { when: end_date is_set, require_expr: end_date >= start_date, message: End date cannot be before the start date. }
        access:
          Event Manager:       { actions: [view, add, edit, export, detail] }
          Compliance Reviewer: { actions: [view, export, detail] }
          HCP:                 { actions: [view, detail], rows: { text: Only events the HCP holds an accepted or pending invitation to. } }
        workflow:
          statuses:
            - { code: draft,      label: Draft,               color: gray, initial: true }
            - { code: review,     label: Compliance Review,   color: amber }
            - { code: approved,   label: Approved,            color: green }
            - { code: open,       label: Invitations Open,    color: blue }
            - { code: completed,  label: Completed,           color: teal }
            - { code: reported,   label: Reported,            color: indigo, final: true }
            - { code: cancelled,  label: Cancelled,           color: red, final: true }
          transitions:
            - { name: submit, label: Submit for Review, from: draft, to: review, roles: [Event Manager], condition: agenda is_set, condition_msg: Attach the agenda before submitting., on_done: Email the compliance reviewer that an event is waiting. }
            - name: approve
              label: Approve Event
              from: review
              to: approved
              roles: [Compliance Reviewer]
              primary: true
              condition: { text: The agenda is predominantly scientific and the budget per HCP is within policy. }
              condition_msg: The agenda or budget per HCP is outside policy.
              on_done: Email the event manager that invitations can go out.
            - { name: send_back, label: Send Back, from: review, to: draft, roles: [Compliance Reviewer], form: [ { send_back_reason: { type: long_text, required: true } } ] }
            - { name: open_invites, label: Open Invitations, from: approved, to: open, roles: [Event Manager], primary: true, on_done: Send every draft invitation for this event. }
            - { name: complete, label: Mark Completed, from: open, to: completed, roles: [Event Manager], condition: { text: Attendance is recorded for every accepted invitation. }, condition_msg: Capture attendance first. }
            - { name: report, label: Sign Off Spend, from: completed, to: reported, roles: [Compliance Reviewer], primary: true, condition: { text: Every spend line on the event is verified. }, condition_msg: Verify all spend lines first., on_done: Lock the event and include its spend in the next transparency report. }
            - { name: cancel, label: Cancel Event, from: [draft, review, approved, open], to: cancelled, roles: [Event Manager], tone: danger, form: [ { cancel_reason: { type: long_text, required: true } } ], on_done: Email every invited HCP that the event is cancelled. }
        form:
          create:
            roles: [Event Manager]
            title: Plan Event
            sections:
              - { title: Event, fields: [title, event_type, therapy_area, objective] }
              - { title: When and where, columns: 2, fields: [start_date, end_date, format, city, venue, capacity] }
              - { title: Budget, fields: [budget, agenda] }
          edit:
            same_as: create
            editable_in: [draft, review]
        table:
          columns:
            - event_ref:      { label: Event, searchable: true }
            - title:          { label: Title, searchable: true, link_to: event_360 }
            - event_type:     { label: Type, filterable: true }
            - start_date:     { label: Starts, sortable: true }
            - city:           { label: City, filterable: true }
            - capacity:       { label: Capacity }
            - accepted_count: { label: Accepted }
            - budget:         { label: Budget, format: money }
            - actual_spend:   { label: Spend, format: money }
            - status:         { source: status, label: Status, filterable: true }
          default_sort: -start_date
          quick_filters:
            - { label: Awaiting my review, where: status == review, roles: [Compliance Reviewer], default: true }
            - { label: Upcoming, where: "status in [approved, open]" }
            - { label: To sign off, where: status == completed, roles: [Compliance Reviewer] }
          row_click: event_360
          add_button: Plan Event
          row_actions:
            - { key: edit, label: Edit, type: edit }
            - { key: open_360, label: Open, type: navigate, to: event_360 }

      - code: invitation
        name: Invitation
        plural: Invitations
        kind: transactional
        display: invitation_ref
        fields:
          - invitation_ref: { type: text, label: Invitation, readonly: true, unique: true, auto: { sequence: "INV-{00000}" } }
          - event:          { type: link, to: event, required: true, display: title, limit_choices: "status in [approved, open]" }
          - hcp:            { type: link, to: hcp, label: HCP, required: true, display: full_name, limit_choices: status == verified }
          - event_role:     { type: choice, label: Role at event, choices: event_role, required: true, default: delegate }
          - honorarium:     { type: money, help: "Only for speakers, chairs and advisory panelists." }
          - travel_needed:  { type: boolean, label: Needs travel, default: false }
          - stay_needed:    { type: boolean, label: Needs accommodation, default: false }
          - dietary_note:   { type: text }
        validation:
          duplicate_check:
            rules:
              - { match: [event, hcp], compare: exact, on_match: block, message: This HCP is already invited to this event. }
          rules:
            - { when: "event_role == delegate", require_expr: honorarium is_empty, message: Delegates do not receive an honorarium. }
        access:
          Event Manager:       { actions: [view, add, edit, export] }
          Compliance Reviewer: { actions: [view, export] }
          HCP:                 { actions: [view], rows: { own: hcp } }
        workflow:
          statuses:
            - { code: draft,     label: Draft,     color: gray, initial: true }
            - { code: sent,      label: Sent,      color: blue }
            - { code: accepted,  label: Accepted,  color: green }
            - { code: declined,  label: Declined,  color: red }
            - { code: withdrawn, label: Withdrawn, color: gray, final: true }
          transitions:
            - { name: send, label: Send Invitation, from: draft, to: sent, roles: [Event Manager], primary: true, condition: event.status == open, condition_msg: Open invitations on the event first., on_done: Email and SMS the HCP the invitation with RSVP link. }
            - { name: accept, label: Accept, from: sent, to: accepted, roles: [HCP], primary: true, form: [ { travel_needed: { type: boolean, label: I need travel } }, { stay_needed: { type: boolean, label: I need accommodation } }, { dietary_note: { type: text } } ], on_done: "Save the travel and stay needs on the invitation, email the event manager and raise a travel request if needed." }
            - { name: decline, label: Decline, from: sent, to: declined, roles: [HCP], tone: danger, form: [ { decline_reason: { type: text } } ] }
            - { name: withdraw, label: Withdraw, from: [draft, sent, accepted], to: withdrawn, roles: [Event Manager], tone: danger, form: [ { withdraw_reason: { type: long_text, required: true } } ] }
        form:
          create:
            roles: [Event Manager]
            title: Invite HCP
            fields: [event, hcp, event_role, honorarium, travel_needed, stay_needed]
          edit:
            same_as: create
            editable_in: [draft]
        table:
          columns:
            - invitation_ref: { label: Invitation, searchable: true }
            - event:          { label: Event, display: title, filterable: true }
            - hcp:            { label: HCP, display: full_name, searchable: true }
            - event_role:     { label: Role, filterable: true }
            - honorarium:     { label: Honorarium, format: money }
            - travel_needed:  { label: Travel }
            - status:         { source: status, label: RSVP, filterable: true }
          default_sort: -created_at
          quick_filters:
            - { label: Awaiting RSVP, where: status == sent }
            - { label: Accepted, where: status == accepted }
          add_button: Invite HCP
          row_actions:
            - { key: edit, label: Edit, type: edit }

      - code: attendance
        name: Attendance
        plural: Attendance
        kind: child
        parent: { entity: event, field: event }
        display: attendance_ref
        fields:
          - attendance_ref:  { type: text, label: Record, readonly: true, unique: true, auto: { sequence: "ATT-{00000}" } }
          - event:           { type: link, to: event, required: true, display: title, on_delete: cascade }
          - hcp:             { type: link, to: hcp, label: HCP, required: true, display: full_name }
          - session_date:    { type: date, required: true }
          - method:          { type: choice, label: Check-in, choices: checkin_method, required: true, default: qr }
          - minutes_attended: { type: integer, label: Minutes, min: 0, max: 900 }
          - sign_in_sheet:   { type: file, accept: [pdf, jpg, png] }
        validation:
          duplicate_check:
            rules:
              - { match: [event, hcp, session_date], compare: exact, on_match: block, message: Attendance is already recorded for this HCP and session. }
        access:
          Event Manager:       { actions: [view, add, edit, delete, export] }
          Compliance Reviewer: { actions: [view, export] }
        workflow:
          statuses:
            - { code: recorded, label: Recorded, color: blue, initial: true }
            - { code: verified, label: Verified, color: green }
            - { code: rejected, label: Rejected, color: red }
          transitions:
            - { name: verify, label: Verify, from: [recorded, rejected], to: verified, roles: [Compliance Reviewer], primary: true }
            - { name: reject, label: Reject, from: recorded, to: rejected, roles: [Compliance Reviewer], tone: danger, form: [ { reject_reason: { type: long_text, required: true } } ] }
        table:
          columns:
            - attendance_ref:   { label: Record, searchable: true }
            - event:            { label: Event, display: title, filterable: true }
            - hcp:              { label: HCP, display: full_name, searchable: true }
            - session_date:     { label: Session, sortable: true }
            - method:           { label: Check-in, filterable: true }
            - minutes_attended: { label: Minutes }
            - status:           { source: status, label: Status, filterable: true }
          default_sort: -session_date
          quick_filters:
            - { label: To verify, where: status == recorded, roles: [Compliance Reviewer] }
          add_button: Record Attendance
          row_actions:
            - { key: edit, label: Edit, type: edit }
        form:
          create: { roles: [Event Manager], fields: [event, hcp, session_date, method, minutes_attended, sign_in_sheet] }
          edit:   { same_as: create, editable_in: [recorded, rejected] }

      - code: spend_line
        name: Spend Line
        plural: Spend
        kind: transactional
        display: line_ref
        fields:
          - line_ref:    { type: text, label: Line, readonly: true, unique: true, auto: { sequence: "TOV-{00000}" } }
          - event:       { type: link, to: event, required: true, display: title }
          - hcp:         { type: link, to: hcp, label: Recipient HCP, display: full_name, help: Leave empty for event-level costs such as the venue. }
          - category:    { type: choice, choices: spend_category, required: true }
          - amount:      { type: money, required: true, min: 0 }
          - incurred_on: { type: date, required: true }
          - vendor:      { type: text }
          - invoice:     { type: file, accept: [pdf, jpg, png] }
        access:
          Event Manager:       { actions: [view, add, edit, export] }
          Compliance Reviewer: { actions: [view, edit, export] }
          HCP:                 { actions: [view], rows: { own: hcp } }
        workflow:
          statuses:
            - { code: recorded, label: Recorded, color: blue, initial: true }
            - { code: verified, label: Verified, color: green }
            - { code: disputed, label: Disputed, color: red }
            - { code: reported, label: Reported, color: indigo, final: true }
          transitions:
            - { name: verify, label: Verify, from: [recorded, disputed], to: verified, roles: [Compliance Reviewer], primary: true, condition: invoice is_set, condition_msg: Attach the invoice before verifying. }
            - { name: dispute, label: Dispute, from: recorded, to: disputed, roles: [Compliance Reviewer], form: [ { dispute_reason: { type: long_text, required: true } } ], on_done: Email the event manager the reason. }
            - { name: report, label: Include in Report, from: verified, to: reported, trigger: system, text: Moved by the quarterly transparency report run. }
        form:
          create:
            roles: [Event Manager]
            fields: [event, hcp, category, amount, incurred_on, vendor, invoice]
          edit:
            same_as: create
            editable_in: [recorded, disputed]
        table:
          columns:
            - line_ref:    { label: Line, searchable: true }
            - event:       { label: Event, display: title, filterable: true }
            - hcp:         { label: Recipient HCP, display: full_name, filterable: true }
            - category:    { label: Category, filterable: true }
            - amount:      { label: Amount, format: money, sortable: true }
            - incurred_on: { label: Incurred on, sortable: true }
            - status:      { source: status, label: Status, filterable: true }
          default_sort: -incurred_on
          footer_totals: [amount]
          quick_filters:
            - { label: To verify, where: status == recorded, roles: [Compliance Reviewer], default: true }
            - { label: Honoraria, where: category == honorarium }
          add_button: Add Spend
          row_actions:
            - { key: edit, label: Edit, type: edit }

detail_views:
  - code: event_360
    hero: event
    title: "{title}"
    back_to: events
    layout: header_tabs
    roles: [Event Manager, Compliance Reviewer, HCP]
    header:
      title: title
      subtitle: ["{event_ref}", "{therapy_area}", "{city}"]
      badges: [ { source: status }, { field: event_type }, { field: format } ]
      facts:
        - { label: Dates, field: start_date }
        - { label: Venue, field: venue }
        - { label: Capacity, field: capacity }
        - { label: Budget, field: budget, format: money }
      actions: { transitions: true }
      banners:
        - { show_when: status == review, tone: info, text: "This event is waiting for compliance approval." }
    stats:
      - { label: Invited, value: { count: invitation, via: event }, link_to_tab: invitations }
      - { label: Accepted, value: { count: invitation, via: event, where: status == accepted }, tone: green, link_to_tab: invitations }
      - { label: Attended, value: { count: attendance, via: event }, tone: blue, link_to_tab: attendance }
      - { label: Spend, value: { sum: spend_line.amount, via: event }, format: money, tone: amber, link_to_tab: spend }
    tabs:
      - { code: overview, label: Overview, type: summary, sections: [ { title: Event, columns: 2, fields: [event_type, therapy_area, start_date, end_date, format, venue, capacity, budget] }, { title: Objective, fields: [objective, agenda] } ] }
      - { code: invitations, label: Invitations, type: related_table, entity: invitation, via: event, count_badge: true, columns: [invitation_ref, hcp, event_role, honorarium, status], add: { label: Invite HCP, prefill: { event: hero }, show_when: "status in [approved, open]" } }
      - { code: attendance, label: Attendance, type: related_table, entity: attendance, via: event, count_badge: true, columns: [hcp, session_date, method, minutes_attended, status], add: { label: Record Attendance, prefill: { event: hero }, show_when: status == open } }
      - { code: spend, label: Spend, type: related_table, entity: spend_line, via: event, columns: [line_ref, hcp, category, amount, incurred_on, status], footer_totals: [amount] }
      - code: activity
        label: Activity
        type: timeline
        sources:
          - { entity: event, events: [created, updated, transition] }
          - { entity: invitation, via: event, events: [created, transition] }
    states:
      not_found: { title: Event not found, back_to: events }
