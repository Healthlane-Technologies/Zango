    - { id: medium, label: Medium, color: amber }
    - { id: high,   label: High,   color: red }
  root_cause_category:
    - { id: partner_process, label: Partner process }
    - { id: packaging,       label: Packaging / shipper }
    - { id: address_data,    label: Address data }
    - { id: patient,         label: Patient availability }
    - { id: traffic_weather, label: Traffic / weather }
    - { id: system,          label: System / integration }
