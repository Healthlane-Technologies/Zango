# Last-Mile Tracking — Specialty Home Delivery: specialty and cold-chain
# medicines delivered from 6 dispatch pharmacies to about 2,400 patients' homes
# a month by 3 courier partners across Maharashtra and Karnataka. The pharmacy
# scans the serial at hand-over, the courier captures OTP and a serial scan at
# the door (with the door temperature for cold-chain packs), and supply chain
# ops watches on-time delivery against a 24-hour promise. Failed attempts and
# temperature excursions become route exceptions; excursions are also signed
# off by QA. A filled-in instance of the Last-Mile Tracking template.
spec_version: 1

# -----------------------------------------------------------------------------
#  APP
# -----------------------------------------------------------------------------
app:
  code: specialty_home_delivery
  name: Last-Mile Tracking — Specialty Home Delivery
  description: Track 2,400 specialty and cold-chain home deliveries a month from 6 dispatch pharmacies through 3 courier partners, with serial-verified proof of delivery, route exceptions with QA sign-off, and returns.
  timezone: Asia/Kolkata
  locale: en-IN
  currency: INR
  theme: { primary: "#0E7490", secondary: "#475569" }
  custom_requirements:
    - area: integration
      title: Packaging line (L3) interface
      text: >
        Every 30 minutes, pull newly commissioned serials (SGTIN, GTIN, batch, expiry) for the
        specialty SKUs from the L3 site server and create serial units in status available.
        Each scan at hand-over, at the door and on return is checked against this list; a scan
        of an unknown, already shipped or decommissioned serial is refused and raises a
        serial_mismatch route exception.
    - area: integration
      title: ERP connector
      text: >
        When a dispatch order for a specialty SKU is released in the ERP, create a delivery in
        status booked with the ERP order number, pharmacy, product, quantity and pseudonymised
        patient ID. Post the delivery confirmation (delivered_at, POD reference) back to the
        order, and post received returns with their disposition as a returns note.
    - area: integration
      title: Courier tracking webhooks
      text: >
        Each courier partner posts status events (picked up, out for delivery, attempt failed,
        delivered) and data-logger readings to a token-authenticated webhook; events run the
        matching delivery transition as the partner's login, readings create temperature
        readings on the delivery.
    - area: scheduled
      title: SLA watch
      text: >
        Every 15 minutes, recompute sla_status for open deliveries: at risk inside 4 hours of
        promised_by, breached after it. On the first breach, set the sla_breach tag and email
        Supply Chain Ops and the partner's escalation contact.
    - area: notification
      title: Patient SMS
      text: >
        Text the patient (by the programme's SMS gateway, using only the programme ID) when the
        pack is out for delivery with a 2-hour window and the OTP, and again after a failed
        attempt with a link to pick a new slot.
    - area: report
      title: Monthly partner scorecard
      text: >
        On the 1st of each month, email each partner and Supply Chain Ops a PDF scorecard: deliveries,
        on-time %, first-attempt success %, excursions, disputed PODs and returns, by city.

# -----------------------------------------------------------------------------
#  CHOICE SETS
# -----------------------------------------------------------------------------
