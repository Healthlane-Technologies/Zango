  serial_status:
    - { id: available,   label: Available,   color: gray }
    - { id: shipped,     label: Shipped,     color: blue }
    - { id: delivered,   label: Delivered,   color: green }
    - { id: returned,    label: Returned,    color: purple }
    - { id: quarantined, label: Quarantined, color: amber }
    - { id: destroyed,   label: Destroyed,   color: red }

# -----------------------------------------------------------------------------
#  ROLES
# -----------------------------------------------------------------------------
roles:
  - name: Logistics Partner
    description: External login for each of the 3 courier partners; takes packs out for delivery, captures OTP, serial scan and door temperature, reports exceptions and collects returns, for its own deliveries only.
    landing: deliveries
    menu:
      - { page: deliveries, label: My Deliveries, icon: truck }
      - { page: proofs,     label: Proof of Delivery, icon: clipboard-check }
      - { page: exceptions, label: Exceptions, icon: shield-alert }
      - { page: returns,    label: Return Pickups, icon: package }
      - { page: routes,     label: My Routes, icon: map }

  - name: Pharmacy
    description: One of the 6 dispatch pharmacies; books deliveries released by the ERP, scans the serial at hand-over, raises returns and scans them back in, for its own deliveries only.
    landing: deliveries
    menu:
      - { page: deliveries, label: Our Deliveries, icon: truck }
      - { page: returns,    icon: package }
      - { page: proofs,     label: Proof of Delivery, icon: clipboard-check }
      - { page: serials,    label: Serial Stock, icon: scan-barcode }

  - name: Supply Chain Ops
    description: Central team in Mumbai; watches every delivery against the 24-hour promise, verifies proof of delivery, signs off route exceptions, approves and closes returns, and manages partners, pharmacies, routes and products.
    landing: dashboard
    menu:
      - { page: dashboard,  icon: layout-dashboard }
      - { page: deliveries, icon: truck }
      - { page: exceptions, label: Route Exceptions, icon: shield-alert }
      - { page: proofs,     icon: clipboard-check }
      - { page: returns,    icon: package }
      - group: Network
        icon: network
        items:
          - { page: partners }
          - { page: routes }
          - { page: pharmacies }
      - group: Products & Serials
        icon: scan-barcode
        items:
          - { page: products }
          - { page: serials }

  - name: Quality Assurance
    description: Signs off temperature excursions and damaged-pack exceptions with a product impact decision, and approves destroy dispositions on returns.
    landing: exceptions
    menu:
      - { page: exceptions, label: QA Sign-off, icon: shield-check }
      - { page: returns,    icon: package }
      - { page: deliveries, icon: truck }
      - { page: serials,    icon: scan-barcode }

# -----------------------------------------------------------------------------
#  PAGES
# -----------------------------------------------------------------------------
pages:
  - { code: deliveries,   type: crud,   entity: delivery,          route: /app/deliveries,         title: Deliveries }
  - { code: delivery_360, type: detail, detail_view: delivery_360, route: /app/deliveries/:id }
  - { code: proofs,       type: crud,   entity: proof_of_delivery, route: /app/proof-of-delivery,  title: Proof of Delivery }
  - { code: exceptions,   type: crud,   entity: route_exception,   route: /app/exceptions,         title: Route Exceptions }
  - { code: returns,      type: crud,   entity: delivery_return,   route: /app/returns,            title: Returns }
  - { code: partners,     type: crud,   entity: logistics_partner, route: /app/network/partners,   title: Logistics Partners }
  - { code: partner_360,  type: detail, detail_view: partner_360,  route: /app/network/partners/:id }
  - { code: routes,       type: crud,   entity: route,             route: /app/network/routes,     title: Routes }
  - { code: pharmacies,   type: crud,   entity: pharmacy,          route: /app/network/pharmacies, title: Dispatch Pharmacies }
  - { code: products,     type: crud,   entity: product,           route: /app/products,           title: Products }
  - { code: serials,      type: crud,   entity: serial_unit,       route: /app/serials,            title: Serial Units }
  - code: dashboard
    type: custom
    route: /app/dashboard
    title: Last-Mile Control Tower
    component: LastMileControlTower
    roles: [Supply Chain Ops]
    text: >
      KPI row: deliveries today (vs same day last week), on-time % against the 24-hour promise
      (last 30 days, target 95%), first-attempt success %, deliveries at risk or breached now,
      open temperature excursions awaiting QA, returns in transit. Below, left: on-time % by
      logistics partner per week for the last 8 weeks (line, one series per partner). Right:
      open deliveries by status per city (stacked bar). Bottom: a live table of at-risk and
      breached deliveries with delivery, city, partner, route, promised-by, hours remaining and
      last event, sorted by hours remaining; clicking a row opens the delivery 360.
    preview: |
      const dl = ctx.rows('delivery'), pods = ctx.rows('proof_of_delivery'), exc = ctx.rows('route_exception'), rets = ctx.rows('delivery_return'), parts = ctx.rows('logistics_partner');
      const now = new Date(), H = d => d ? (new Date(d) - now) / 36e5 : null, day = d => String(d || '').slice(0, 10), today = day(now.toISOString()), wkAgo = day(new Date(now - 7 * 864e5).toISOString());
      const OPEN = ['booked', 'handed_over', 'out_for_delivery', 'attempt_failed', 'on_hold', 'returning'], open = dl.filter(d => OPEN.includes(d.status)), done = dl.filter(d => d.status === 'delivered');
      const win = done.filter(d => -H(d.delivered_at || d.promised_by) <= 720), base = win.length ? win : done, pct = (n, t) => t ? Math.round(100 * n / t) : 0;
      const onTime = pct(base.filter(d => d.sla_status !== 'breached').length, base.length), first = pct(done.filter(d => (+d.attempts || 1) <= 1).length, done.length);
      const risk = dl.filter(d => OPEN.includes(d.status) && (['at_risk', 'breached'].includes(d.sla_status) || H(d.promised_by) < 0)).sort((a, b) => H(a.promised_by) - H(b.promised_by));
      const exQA = exc.filter(e => e.exception_type === 'temp_excursion' && e.status !== 'resolved');
      const hrs = h => h == null ? '—' : Math.abs(h) >= 48 ? `${Math.round(Math.abs(h) / 24)}d ${h < 0 ? 'overdue' : 'left'}` : `${Math.round(Math.abs(h))}h ${h < 0 ? 'overdue' : 'left'}`;
      const last = d => [['Handed over', d.handed_over_at], ...pods.filter(p => p.delivery === d.id).map(p => ['POD ' + ctx.fmt(p, 'method'), p.captured_at]), ...exc.filter(e => e.delivery === d.id).map(e => [ctx.fmt(e, 'exception_type'), e.reported_at])].filter(x => x[1]).sort((a, b) => String(b[1]).localeCompare(String(a[1])))[0];
      const weeks = [7, 6, 5, 4, 3, 2, 1, 0], pal = ['#1570EF', '#7A5AF8', '#12B76A', '#F79009'], P = id => parts.find(p => p.id === id) || {};
      const top4 = [...new Set(dl.map(d => d.logistics_partner).filter(Boolean))].sort((a, b) => dl.filter(d => d.logistics_partner === b).length - dl.filter(d => d.logistics_partner === a).length).slice(0, 4);
      const series = top4.map(pid => { let prev = null; return weeks.map(w => { const rs = dl.filter(d => d.logistics_partner === pid && Math.floor(-H(d.promised_by) / 168) >= w); prev = rs.length ? pct(rs.filter(d => d.sla_status !== 'breached').length, rs.length) : prev; return prev; }); });
      const X = i => 30 + i * 52, Y = v => 150 - v * 1.3, line = s => s.map((v, i) => v == null ? '' : `${X(i)},${Y(v)}`).filter(Boolean).join(' ');
      const cities = ctx.entity('delivery').fields.find(f => f.key === 'city').opts || [], sts = ['booked', 'handed_over', 'out_for_delivery', 'attempt_failed', 'on_hold', 'returning'], sc = ['#98A2B3', '#53B1FD', '#1570EF', '#F04438', '#F79009', '#7A5AF8'];
      const cTop = Math.max(1, ...cities.map(c => open.filter(d => d.city === c.id).length)), slab = s => ctx.esc(s.replace(/_/g, ' '));
      return `
      <div class="pv-kpis">
        <div class="pv-kpi" data-go="deliveries"><span>Deliveries today</span><b>${open.filter(d => d.status === 'out_for_delivery').length + done.filter(d => day(d.delivered_at) === today).length}</b><span>${done.filter(d => day(d.delivered_at) === wkAgo).length} delivered same day last week</span></div>
        <div class="pv-kpi"><span>On-time vs 24h promise${win.length ? ', 30 days' : ''}</span><b style="color:${onTime >= 95 ? '#067647' : '#B42318'}">${onTime}%</b><span>target 95%</span></div>
        <div class="pv-kpi"><span>First-attempt success</span><b>${first}%</b><span>${done.length} delivered</span></div>
        <div class="pv-kpi" data-go="deliveries"><span>At risk or breached now</span><b style="color:#B42318">${risk.length}</b></div>
        <div class="pv-kpi" data-go="exceptions"><span>Excursions awaiting QA</span><b style="color:#B54708">${exQA.length}</b></div>
        <div class="pv-kpi" data-go="returns"><span>Returns in transit</span><b>${rets.filter(r => r.status === 'in_transit').length}</b></div>
      </div>
      <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:12px;align-items:start">
        <div class="d-panel"><h3>${ctx.icon('line-chart')}On-time % to date by partner, last 8 weeks</h3><div style="padding:10px 16px">
          <svg viewBox="0 0 420 175" style="width:100%;height:auto;font:10px sans-serif;fill:#98A2B3">${[0, 50, 95, 100].map(v => `<line x1="30" x2="404" y1="${Y(v)}" y2="${Y(v)}" stroke="${v === 95 ? '#FDA29B' : '#EAECF0'}" stroke-dasharray="${v === 95 ? '4 3' : ''}"/>${v === 95 ? '' : `<text x="0" y="${Y(v) + 3}">${v}%</text>`}`).join('')}${weeks.map((w, i) => `<text x="${X(i) - 8}" y="170">${w ? 'W-' + w : 'Now'}</text>`).join('')}
            ${series.map((s, j) => `<polyline points="${line(s)}" fill="none" stroke="${pal[j]}" stroke-width="2"/>${s.map((v, i) => v == null ? '' : `<circle cx="${X(i)}" cy="${Y(v)}" r="2.5" fill="${pal[j]}"/>`).join('')}`).join('')}</svg>
          <div class="pv-muted" style="display:flex;flex-wrap:wrap;gap:10px">${top4.map((pid, j) => `<span data-go="partner_360:${pid}"><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${pal[j]}"></i> ${ctx.esc(P(pid).legal_name)}</span>`).join('')}</div></div></div>
        <div class="d-panel"><h3>${ctx.icon('map-pin')}Open deliveries by city</h3><div style="padding:12px 16px;display:flex;flex-direction:column;gap:10px">${cities.map(c => { const rs = open.filter(d => d.city === c.id); return `<div style="display:grid;grid-template-columns:80px 1fr 24px;gap:10px;align-items:center;font-size:13px"><b style="font-weight:550">${ctx.esc(c.label)}</b><div style="display:flex;height:12px;border-radius:4px;overflow:hidden;background:#F2F4F7;width:${Math.max(2, 100 * rs.length / cTop)}%">${sts.map((s, j) => `<i title="${slab(s)}" style="width:${rs.length ? 100 * rs.filter(d => d.status === s).length / rs.length : 0}%;background:${sc[j]}"></i>`).join('')}</div><span class="pv-muted">${rs.length}</span></div>`; }).join('')}
          <div class="pv-muted" style="display:flex;flex-wrap:wrap;gap:8px">${sts.map((s, j) => `<span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${sc[j]}"></i> ${slab(s)}</span>`).join('')}</div></div></div>
      </div>
      <div class="d-panel"><h3>${ctx.icon('siren')}At-risk and breached deliveries<span class="sp"></span><span class="pv-badge">${risk.length}</span></h3><table class="z-t"><thead><tr><th>Delivery</th><th>City</th><th>Partner</th><th>Route</th><th>Promised by</th><th>Hours remaining</th><th>Last event</th></tr></thead><tbody>${risk.slice(0, 10).map(d => { const h = H(d.promised_by), e = last(d); return `
        <tr class="click" data-go="delivery_360:${d.id}"><td><b style="font-weight:550">${ctx.esc(d.delivery_ref)}</b> ${d.tags.includes('cold_chain') ? '<span class="pv-badge">Cold</span>' : ''}<div class="pv-muted">${ctx.esc(ctx.fmt(d, 'status'))}</div></td><td>${ctx.esc(ctx.fmt(d, 'city'))}</td><td>${ctx.esc(ctx.fmt(d, 'logistics_partner'))}</td><td>${ctx.esc(ctx.fmt(d, 'route'))}</td><td>${ctx.esc(ctx.fmt(d, 'promised_by'))}</td>
          <td style="color:${h < 0 ? '#B42318' : '#B54708'};font-weight:600">${hrs(h)}</td><td>${e ? `${ctx.esc(e[0])}<div class="pv-muted">${ctx.esc(String(e[1]).slice(0, 16).replace('T', ' '))}</div>` : '<span class="pv-muted">Booked, no scans</span>'}</td></tr>`; }).join('') || '<tr><td colspan="7" class="pv-muted">Every open delivery is on track.</td></tr>'}</tbody></table></div>`;

# -----------------------------------------------------------------------------
#  MODULES
# -----------------------------------------------------------------------------
modules:
  # ---------------------------------------------------------------------------
  - code: network
    name: Delivery Network
    description: Courier partners, dispatch pharmacies, the routes that connect them to patients, and the specialty products and serials they carry.
    entities:
      - code: logistics_partner
        name: Logistics Partner
        plural: Logistics Partners
        kind: hero
        display: legal_name
        app_user: { role: Logistics Partner, name: legal_name, email: email, mobile: phone, create_on: is_active is_true }
        fields:
          - partner_code:  { type: text, label: Code, readonly: true, unique: true, auto: { sequence: "LSP-{000}" } }
          - legal_name: { type: text, label: Partner name, required: true, max_length: 150, placeholder: "SwiftCare Logistics" }
          - email:         { type: email, required: true, label: Ops email }
          - phone:         { type: phone, required: true, label: Ops phone }
          - escalation_contact: { type: email, label: Escalation contact, required: true }
          - states_served: { type: multi_choice, choices: state, label: States served, required: true }
          - cold_chain_qualified: { type: boolean, label: Cold-chain qualified, default: false }
          - qualification_valid_until: { type: date, label: Cold-chain qualification until }
          - contract_valid_until: { type: date, label: Contract valid until, required: true }
          - on_time_pct:   { type: percent, label: On-time %, readonly: true, min: 86, max: 99, computed: Deliveries delivered by promised_by in the last 30 days over all deliveries closed in that period. }
          - first_attempt_pct: { type: percent, label: First-attempt %, readonly: true, min: 80, max: 97, computed: Deliveries delivered with attempts == 0 failed over all delivered in the last 30 days. }
          - is_active:     { type: boolean, label: Active, default: true }
        validation:
          rules:
            - when: cold_chain_qualified is_true
              require: [qualification_valid_until]
              message: Enter the date the cold-chain qualification runs to.
        access:
          Supply Chain Ops:  { actions: [view, add, edit, export, detail] }
          Logistics Partner: { actions: [view, detail], rows: { own: id } }
        workflow:
          statuses:
            - { code: active,    label: Active,    color: green, initial: true }
            - { code: suspended, label: Suspended, color: red }
          transitions:
            - { name: suspend, label: Suspend, from: active, to: suspended, roles: [Supply Chain Ops], tone: danger,
                form: [ { suspension_reason: { type: long_text, label: Reason, required: true } } ],
                on_done: "Stop new bookings to this partner's routes and email the partner's escalation contact." }
            - { name: reinstate, label: Reinstate, from: suspended, to: active, roles: [Supply Chain Ops], primary: true }
          tags:
            - { code: qualification_expiring, label: Qualification Expiring, color: amber, system: true, text: Set when qualification_valid_until is within 30 days. }
            - { code: on_watch, label: On Watch, color: red, enable: { roles: [Supply Chain Ops] }, disable: { roles: [Supply Chain Ops] } }
        table:
          columns:
            - partner_code: { label: Code, searchable: true }
            - legal_name: { label: Partner, searchable: true, sortable: true, link_to: partner_360 }
            - states_served: { label: States }
            - cold_chain_qualified: { label: Cold chain, filterable: true }
            - on_time_pct:  { label: On-time, format: percent, sortable: true }
            - first_attempt_pct: { label: First attempt, format: percent, sortable: true }
            - contract_valid_until: { label: Contract until, sortable: true }
            - status:       { source: status, label: Status, filterable: true }
            - tags:         { source: tags, label: Tags }
          default_sort: legal_name
          row_click: partner_360
          add_button: Add Partner
          row_actions:
            - { key: edit, label: Edit, type: edit }
        form:
          create:
            title: Add Logistics Partner
            sections:
              - { title: Partner, fields: [legal_name, email, phone, escalation_contact, states_served] }
              - { title: Qualification, fields: [cold_chain_qualified, qualification_valid_until, contract_valid_until, is_active] }
            after_create: partner_360
          edit: { same_as: create }

      - code: pharmacy
        name: Dispatch Pharmacy
        plural: Dispatch Pharmacies
        kind: master
        display: name
        app_user: { role: Pharmacy, name: name, email: email, mobile: phone, create_on: is_active is_true }
        fields:
          - pharmacy_code:   { type: text, label: Code, readonly: true, unique: true, auto: { sequence: "PHM-{000}" } }
          - name:            { type: text, required: true, max_length: 150, placeholder: "Specialty Pharmacy — Andheri" }
          - city:            { type: choice, choices: city, required: true }
          - state:           { type: choice, choices: state, required: true }
          - address:         { type: long_text, required: true }
          - drug_license_no: { type: text, label: Drug licence no., required: true }
          - license_valid_until: { type: date, label: Licence valid until, required: true }
          - pharmacist_in_charge: { type: text, label: Pharmacist in charge, required: true }
          - email:           { type: email, required: true }
          - phone:           { type: phone, required: true }
          - cut_off_time:    { type: time, label: Same-day cut-off, default: "14:00" }
          - is_active:       { type: boolean, label: Active, default: true }
        validation:
          duplicate_check:
            rules:
              - { match: [drug_license_no], compare: normalised, on_match: block, message: A pharmacy with this drug licence already exists. }
        access:
          Supply Chain Ops: { actions: [view, add, edit, export] }
          Pharmacy:         { actions: [view], rows: { own: id } }
        table:
          columns:
            - pharmacy_code: { label: Code, searchable: true }
            - name:          { label: Pharmacy, searchable: true, sortable: true }
            - city:          { label: City, filterable: true }
            - state:         { label: State, filterable: true }
            - pharmacist_in_charge: { label: Pharmacist }
            - license_valid_until: { label: Licence until, sortable: true }
            - cut_off_time:  { label: Cut-off }
            - is_active:     { label: Active, filterable: true }
          default_sort: name
          add_button: Add Pharmacy
          row_actions:
            - { key: edit, label: Edit, type: edit }
        form:
          create:
            sections:
              - { title: Pharmacy, fields: [name, city, state, address, cut_off_time] }
              - { title: Licence, fields: [drug_license_no, license_valid_until, pharmacist_in_charge] }
              - { title: Contact, fields: [email, phone, is_active] }
          edit: { same_as: create }

      - code: route
        name: Route
        plural: Routes
        kind: master
        display: route_code
        fields:
          - route_code:  { type: text, label: Route, required: true, unique: true, placeholder: "MH-PUN-03" }
          - name:        { type: text, required: true, placeholder: "Pune East — Kharadi / Wagholi / Hadapsar" }
          - city:        { type: choice, choices: city, required: true }
          - pincodes:    { type: long_text, label: PIN codes covered, required: true, help: Comma-separated 6-digit PIN codes. }
          - pharmacy:    { type: link, to: pharmacy, required: true, display: name, label: Dispatch pharmacy }
          - logistics_partner: { type: link, to: logistics_partner, required: true, display: legal_name, label: Partner }
          - sla_hours:   { type: integer, label: Promise (hours), required: true, default: 24, min: 4, max: 48 }
          - cold_chain:  { type: boolean, label: Cold-chain route, default: false }
          - is_active:   { type: boolean, label: Active, default: true }
        validation:
          rules:
            - when: cold_chain is_true
              require_expr: logistics_partner.cold_chain_qualified == true
              message: This partner is not qualified for cold-chain routes.
        access:
          Supply Chain Ops:  { actions: [view, add, edit, export] }
          Logistics Partner: { actions: [view], rows: { own: logistics_partner } }
        table:
          columns:
            - route_code: { label: Route, searchable: true, sortable: true }
            - name:       { label: Area, searchable: true }
            - city:       { label: City, filterable: true }
            - pharmacy:   { label: Pharmacy, display: name, filterable: true }
            - logistics_partner: { label: Partner, display: legal_name, filterable: true }
            - sla_hours:  { label: Promise (h), sortable: true }
            - cold_chain: { label: Cold chain, filterable: true }
          default_sort: route_code
          quick_filters:
            - { label: Active only, where: is_active is_true, default: true }
            - { label: Cold-chain routes, where: cold_chain is_true }
          add_button: Add Route
          row_actions:
            - { key: edit, label: Edit, type: edit }
        form:
          create:
            sections:
              - { title: Route, fields: [route_code, name, city, pincodes] }
              - { title: Service, fields: [pharmacy, logistics_partner, sla_hours, cold_chain, is_active] }
          edit: { same_as: create }

      - code: product
        name: Product
        plural: Products
        kind: master
        display: name
        fields:
          - name:          { type: text, required: true, placeholder: "Trastuzumab 440 mg vial" }
          - gtin:          { type: text, label: GTIN, required: true, unique: true, pattern: "^[0-9]{14}$", pattern_msg: Enter the 14-digit GTIN. }
          - sku_code:      { type: text, label: ERP SKU, required: true, unique: true }
          - therapy_area:  { type: choice, choices: therapy_area, required: true }
          - temperature_class: { type: choice, label: Storage, choices: temperature_class, required: true }
          - max_excursion_minutes: { type: integer, label: Allowed excursion (min), min: 0, max: 240, help: Cumulative minutes outside range allowed by the stability data. }
          - is_active:     { type: boolean, label: Active, default: true }
        validation:
          rules:
            - when: temperature_class == cold
              require: [max_excursion_minutes]
              message: Enter the allowed excursion for a cold-chain product.
        access:
          Supply Chain Ops:  { actions: [view, add, edit, export] }
          Quality Assurance: { actions: [view, edit] }
          Pharmacy:          { actions: [view] }
        table:
          columns:
            - name:          { label: Product, searchable: true, sortable: true }
            - gtin:          { label: GTIN, searchable: true }
            - sku_code:      { label: SKU }
            - therapy_area:  { label: Therapy area, filterable: true }
            - temperature_class: { label: Storage, filterable: true }
            - max_excursion_minutes: { label: Excursion budget (min) }
          default_sort: name
          add_button: Add Product
          row_actions:
            - { key: edit, label: Edit, type: edit }
        form:
          create: { fields: [name, gtin, sku_code, therapy_area, temperature_class, max_excursion_minutes, is_active] }
          edit:   { same_as: create, roles: [Supply Chain Ops, Quality Assurance] }

      - code: serial_unit
        name: Serial Unit
        plural: Serial Units
        kind: master
        display: sgtin
        fields:
          - sgtin:        { type: text, label: SGTIN, required: true, unique: true }
          - product:      { type: link, to: product, required: true, display: name }
          - batch_no:     { type: text, label: Batch, required: true }
          - expiry_date:  { type: date, label: Expiry, required: true }
          - pharmacy:     { type: link, to: pharmacy, display: name, label: Held at }
          - serial_status: { type: choice, label: Serial status, choices: serial_status, readonly: true, default: available }
          - commissioned_at: { type: datetime, label: Commissioned (L3), readonly: true }
          - last_scan_at: { type: datetime, label: Last scan, readonly: true }
        access:
          Supply Chain Ops:  { actions: [view, export] }
          Quality Assurance: { actions: [view, export] }
          Pharmacy:          { actions: [view], rows: { own: pharmacy } }
        custom_requirements:
          - area: integration
            title: Serial status from scans
            text: Set serial_status to shipped on hand-over, delivered on confirmed delivery, returned when a return is received, and quarantined or destroyed when the return closes with that disposition; set last_scan_at on every scan.
        table:
          columns:
            - sgtin:        { label: SGTIN, searchable: true }
            - product:      { label: Product, display: name, filterable: true }
            - batch_no:     { label: Batch, searchable: true }
            - expiry_date:  { label: Expiry, sortable: true }
            - pharmacy:     { label: Held at, display: name, filterable: true }
            - serial_status: { label: Status, filterable: true }
            - last_scan_at: { label: Last scan, sortable: true }
          default_sort: -last_scan_at
          quick_filters:
            - { label: Available, where: serial_status == available, roles: [Pharmacy], default: true }
            - { label: Quarantined, where: serial_status == quarantined, roles: [Quality Assurance, Supply Chain Ops] }

  # ---------------------------------------------------------------------------
  - code: deliveries
    name: Delivery Tracking
    description: Every delivery from hand-over at the pharmacy to confirmation at the patient's door, with its proof of delivery and temperature readings.
    entities:
      - code: delivery
        name: Delivery
        plural: Deliveries
        kind: hero
        display: delivery_ref
        fields:
          - delivery_ref:  { type: text, label: Delivery, readonly: true, unique: true, auto: { sequence: "DLV-{YY}-{000000}" } }
          - erp_order_no:  { type: text, label: ERP order no., required: true, pattern: "^SO[0-9]{8}$", pattern_msg: "ERP order numbers look like SO40012345." }
          - pharmacy:      { type: link, to: pharmacy, required: true, display: name, limit_choices: is_active is_true }
          - city:          { type: choice, choices: city, required: true }
          - route:         { type: link, to: route, required: true, display: route_code, limit_choices: form.pharmacy == pharmacy }
          - logistics_partner: { type: link, to: logistics_partner, required: true, display: legal_name, label: Partner }
          - delivery_type: { type: choice, choices: delivery_type, required: true, default: home }
          - patient_ref:   { type: text, label: Patient ID, required: true, pattern: "^PSP-[0-9]{6}$", pattern_msg: "Programme IDs look like PSP-004512.", help: Pseudonymised programme ID; no patient name is stored. }
          - delivery_address: { type: text, label: Delivery address, required: true }
          - pincode:       { type: text, label: PIN code, required: true, pattern: "^[1-9][0-9]{5}$", pattern_msg: Enter a 6-digit PIN code. }
          - preferred_slot: { type: choice, label: Preferred slot, choices: delivery_slot }
          - product:       { type: link, to: product, required: true, display: name, limit_choices: is_active is_true }
          - serial_no:     { type: text, label: Serial (SGTIN), required: true, help: Scanned at hand-over; checked against the packaging line serials. }
          - batch_no:      { type: text, label: Batch }
          - quantity:      { type: integer, label: Packs, required: true, min: 1, max: 6, default: 1 }
          - temperature_class: { type: choice, label: Temperature, choices: temperature_class, required: true, default: ambient }
          - logger_id:     { type: text, label: Data logger ID }
          - promised_by:   { type: datetime, label: Promised by, required: true }
          - handed_over_at: { type: datetime, label: Handed over at, readonly: true }
          - delivered_at:  { type: datetime, label: Delivered at, readonly: true }
          - attempts:      { type: integer, label: Failed attempts, readonly: true, min: 0, max: 2 }
          - sla_status:    { type: choice, label: SLA, choices: sla_status, readonly: true, computed: "On time until 4 hours before promised_by, at risk inside 4 hours, breached after it (stops once delivered)." }
        validation:
          duplicate_check:
            scope: { where: "status not_in [delivered, returned, cancelled]" }
            rules:
              - { match: [serial_no], compare: exact, on_match: block, message: This serial is already on another open delivery. }
              - { match: [erp_order_no], compare: exact, on_match: block, message: A delivery for this ERP order already exists. }
          rules:
            - when: temperature_class == cold
              require_expr: route.cold_chain == true
              message: Cold-chain packs must go on a cold-chain route.
            - when: temperature_class == cold
              require: [logger_id]
              message: Attach a data logger to every cold-chain pack.
            - text: The serial belongs to the selected product (GTIN) and is available at the selected pharmacy.
              message: This serial is not available for this product at this pharmacy.
        access:
          Supply Chain Ops:  { actions: [view, add, edit, export, detail] }
          Pharmacy:          { actions: [view, add, edit, detail], rows: { own: pharmacy } }
          Logistics Partner: { actions: [view, detail], rows: { own: logistics_partner } }
          Quality Assurance: { actions: [view, detail], rows: { where: "temperature_class == cold" } }
        workflow:
          statuses:
            - { code: booked,           label: Booked,           color: gray, initial: true }
            - { code: handed_over,      label: Handed Over,      color: blue }
            - { code: out_for_delivery, label: Out for Delivery, color: indigo }
            - { code: attempt_failed,   label: Attempt Failed,   color: amber }
            - { code: on_hold,          label: On Hold (QA),     color: red }
            - { code: delivered,        label: Delivered,        color: green, final: true }
            - { code: returning,        label: Returning,        color: purple }
            - { code: returned,         label: Returned to Pharmacy, color: purple, final: true }
            - { code: cancelled,        label: Cancelled,        color: gray, final: true }
          transitions:
            - name: hand_over
              label: Hand Over to Partner
              from: booked
              to: handed_over
              roles: [Pharmacy]
              primary: true
              form:
                - scanned_serial: { type: text, label: Scan serial, required: true }
                - logger_started: { type: boolean, label: Data logger started }
              condition:
                all:
                  - text: The scanned serial equals serial_no and is an available serial in the packaging line data.
                  - text: For a cold-chain pack, logger_started is ticked.
              condition_msg: The scanned serial does not match this delivery, or the logger is not started.
              on_done: Set handed_over_at = now, mark the serial shipped and notify the partner of the pick-up with the pharmacy address and cut-off.
            - { name: start_route, label: Out for Delivery, from: [handed_over, attempt_failed], to: out_for_delivery, roles: [Logistics Partner], primary: true,
                on_done: "Text the patient the 2-hour window, the OTP and the partner's contact number." }
            - name: confirm_delivery
              label: Confirm Delivery
              from: out_for_delivery
              to: delivered
              roles: [Logistics Partner]
              primary: true
              condition: { text: A proof of delivery with a matching serial scan is captured for this delivery. }
              condition_msg: Capture the proof of delivery first.
              on_done: Set delivered_at = now, mark the serial delivered, post the confirmation to the ERP and email the pharmacy.
            - name: fail_attempt
              label: Attempt Failed
              from: out_for_delivery
              to: attempt_failed
              roles: [Logistics Partner]
              form:
                - failure_reason: { type: choice, choices: exception_type, required: true }
                - failure_note:   { type: long_text }
              on_done: Add 1 to attempts, raise a route exception with the reason, and text the patient a link to pick a new slot.
            - name: hold_for_qa
              label: Hold for QA
              from: [handed_over, out_for_delivery, attempt_failed]
              to: on_hold
              roles: [Supply Chain Ops, Logistics Partner]
              tone: danger
              form:
                - hold_reason: { type: long_text, required: true }
              on_done: Raise a temperature_excursion route exception with severity high and email Quality Assurance.
            - { name: release_hold, label: Release, from: on_hold, to: out_for_delivery, roles: [Quality Assurance], primary: true,
                condition: { text: The linked excursion exception is resolved with product impact none. },
                condition_msg: QA must sign off the excursion with no product impact first. }
            - { name: send_back, label: Return to Pharmacy, from: [attempt_failed, on_hold], to: returning, roles: [Supply Chain Ops], tone: danger,
                condition: { any: [ attempts >= 2, status == on_hold ] },
                condition_msg: "Make two attempts before sending the pack back.",
                on_done: Create a return for this delivery with the matching reason and status approved. }
            - { name: received_back, label: Received Back, from: returning, to: returned, roles: [Pharmacy],
                form: [ { scanned_serial: { type: text, label: Scan serial, required: true } } ],
                on_done: Mark the serial returned. }
            - { name: cancel, label: Cancel, from: booked, to: cancelled, roles: [Pharmacy, Supply Chain Ops], tone: danger,
                form: [ { cancel_reason: { type: long_text, required: true } } ],
                on_done: Release the serial back to available and tell the ERP the order is cancelled. }
          tags:
            - { code: sla_breach, label: SLA Breached, color: red, system: true, text: Set when the delivery is not delivered by promised_by. }
            - { code: cold_chain, label: Cold Chain, color: blue, system: true, text: Set when temperature_class is cold. }
            - { code: excursion,  label: Excursion, color: red, system: true, text: Set when any temperature reading is outside 2–8 °C on a cold-chain pack. }
            - { code: priority,   label: Priority, color: amber, enable: { roles: [Supply Chain Ops, Pharmacy] }, disable: { roles: [Supply Chain Ops] } }
        form:
          create:
            roles: [Pharmacy, Supply Chain Ops]
            title: Book Delivery
            sections:
              - { title: Order, fields: [erp_order_no, pharmacy, city, route, logistics_partner, delivery_type, promised_by] }
              - { title: Recipient, fields: [patient_ref, delivery_address, pincode, preferred_slot] }
              - title: Pack
                fields:
                  - product
                  - serial_no
                  - batch_no
                  - quantity
                  - temperature_class
                  - logger_id: { show_when: temperature_class == cold }
            after_create: delivery_360
          edit:
            same_as: create
            roles: [Pharmacy, Supply Chain Ops]
            editable_in: [booked]
        table:
          columns:
            - delivery_ref:  { label: Delivery, searchable: true, sortable: true, link_to: delivery_360 }
            - patient_ref:   { label: Patient ID, searchable: true }
            - city:          { label: City, filterable: true }
            - route:         { label: Route, display: route_code, filterable: true }
            - logistics_partner: { label: Partner, display: legal_name, filterable: true, roles: [Supply Chain Ops, Pharmacy, Quality Assurance] }
            - product:       { label: Product, display: name, filterable: true }
            - temperature_class: { label: Temp, filterable: true }
            - promised_by:   { label: Promised by, sortable: true }
            - sla_status:    { label: SLA, filterable: true }
            - status:        { source: status, label: Status, filterable: true }
            - tags:          { source: tags, label: Tags }
          default_sort: promised_by
          quick_filters:
            - { label: In progress, where: "status in [handed_over, out_for_delivery, attempt_failed, on_hold]", default: true }
            - { label: At risk or breached, where: "sla_status in [at_risk, breached]", roles: [Supply Chain Ops] }
            - { label: To hand over, where: status == booked, roles: [Pharmacy] }
            - { label: To deliver today, where: "status in [handed_over, attempt_failed]", roles: [Logistics Partner] }
            - { label: On hold, where: status == on_hold, roles: [Quality Assurance, Supply Chain Ops] }
          row_click: delivery_360
          add_button: Book Delivery

      - code: proof_of_delivery
        name: Proof of Delivery
        plural: Proofs of Delivery
        kind: child
        parent: { entity: delivery, field: delivery }
        display: pod_ref
        fields:
          - pod_ref:       { type: text, label: POD, readonly: true, unique: true, auto: { sequence: "POD-{YY}-{000000}" } }
          - delivery:      { type: link, to: delivery, required: true, display: delivery_ref, on_delete: cascade }
          - method:        { type: choice, choices: pod_method, required: true, default: otp }
          - otp_verified:  { type: boolean, label: OTP verified, readonly: true }
          - received_by:   { type: text, label: Received by, required: true, help: Patient or named caregiver; first name only. }
          - relation:      { type: choice, choices: recipient_relation, required: true, default: self }
          - scanned_serial: { type: text, label: Serial scanned at door, required: true }
          - captured_at:   { type: datetime, label: Captured at, required: true }
          - photo:         { type: image, label: Photo / signature, accept: [jpg, png], max_size_mb: 5 }
          - temperature_c: { type: decimal, label: Temp at door (°C), min: -5, max: 40 }
          - gps_location:  { type: text, label: GPS, readonly: true }
          - distance_m:    { type: integer, label: Distance from address (m), readonly: true, computed: Metres between the GPS fix and the geocoded delivery address. }
        validation:
          rules:
            - text: scanned_serial must equal the delivery's serial_no.
              message: The serial scanned at the door does not match the pack on this delivery.
            - when: delivery.temperature_class == cold
              require: [temperature_c]
              message: Record the temperature at the door for a cold-chain pack.
            - when: method == photo
              require: [photo]
              message: Attach the photo taken at the door.
        access:
          Logistics Partner: { actions: [view, add], rows: { own: delivery.logistics_partner } }
          Pharmacy:          { actions: [view], rows: { own: delivery.pharmacy } }
          Supply Chain Ops:  { actions: [view, export] }
        workflow:
          statuses:
            - { code: captured, label: Captured, color: blue, initial: true }
            - { code: verified, label: Verified, color: green, final: true }
            - { code: disputed, label: Disputed, color: amber }
            - { code: rejected, label: Rejected, color: red, final: true }
          transitions:
            - { name: verify, label: Verify, from: [captured, disputed], to: verified, roles: [Supply Chain Ops], primary: true }
            - { name: dispute, label: Dispute, from: captured, to: disputed, roles: [Pharmacy, Supply Chain Ops],
                form: [ { dispute_reason: { type: long_text, required: true } } ],
                on_done: Email the logistics partner's escalation contact and Supply Chain Ops the dispute. }
            - { name: reject, label: Reject, from: disputed, to: rejected, roles: [Supply Chain Ops], tone: danger,
                form: [ { reject_reason: { type: long_text, required: true } } ],
                on_done: Reopen the delivery as out_for_delivery and raise a route exception of type serial_mismatch. }
            - { name: auto_verify, label: Auto-verify, from: captured, to: verified, trigger: system,
                text: "Immediately when otp_verified is true, the serial matches, distance_m < 200 and (for cold chain) temperature_c is 2–8 °C." }
          tags:
            - { code: far_from_address, label: Far From Address, color: amber, system: true, text: Set when distance_m > 500. }
        table:
          columns:
            - pod_ref:        { label: POD, searchable: true }
            - delivery:       { label: Delivery, display: delivery_ref, searchable: true }
            - method:         { label: Method, filterable: true }
            - relation:       { label: Received by, filterable: true }
            - captured_at:    { label: Captured, sortable: true }
            - temperature_c:  { label: Temp °C }
            - distance_m:     { label: Distance (m) }
            - status:         { source: status, label: Status, filterable: true }
          default_sort: -captured_at
          quick_filters:
            - { label: To verify, where: "status in [captured, disputed]", roles: [Supply Chain Ops], default: true }
          add_button: Capture POD
        form:
          create: { roles: [Logistics Partner], fields: [method, received_by, relation, scanned_serial, captured_at, photo, temperature_c] }

      - code: temperature_reading
        name: Temperature Reading
        plural: Temperature Readings
        kind: child
        parent: { entity: delivery, field: delivery }
        display: reading_at
        fields:
          - delivery:      { type: link, to: delivery, required: true, display: delivery_ref, on_delete: cascade }
          - reading_at:    { type: datetime, label: Reading at, required: true }
          - temperature_c: { type: decimal, label: Temp (°C), required: true, min: -5, max: 40 }
          - source:        { type: choice, choices: reading_source, required: true, default: logger }
          - out_of_range:  { type: boolean, label: Out of range, readonly: true, computed: True when temperature_c is below 2 or above 8 on a cold-chain delivery. }
        access:
          Logistics Partner: { actions: [view, add], rows: { own: delivery.logistics_partner } }
          Supply Chain Ops:  { actions: [view, export] }
          Quality Assurance: { actions: [view, export] }
        table:
          columns:
            - reading_at:    { label: Time, sortable: true }
            - temperature_c: { label: Temp °C }
            - source:        { label: Source, filterable: true }
            - out_of_range:  { label: Out of range, filterable: true }
          default_sort: -reading_at
        form:
          create: { roles: [Logistics Partner], fields: [reading_at, temperature_c, source] }

  # ---------------------------------------------------------------------------
  - code: exceptions_returns
    name: Exceptions & Returns
    description: Route exceptions raised on the road (with QA sign-off for excursions and damage) and the returns that bring packs back to the pharmacy.
    entities:
      - code: route_exception
        name: Route Exception
        plural: Route Exceptions
        kind: transactional
        display: exception_ref
        fields:
          - exception_ref:  { type: text, label: Exception, readonly: true, unique: true, auto: { sequence: "EXC-{YY}-{00000}" } }
          - delivery:       { type: link, to: delivery, required: true, display: delivery_ref }
          - exception_type: { type: choice, label: Type, choices: exception_type, required: true }
          - severity:       { type: choice, choices: severity, required: true, default: medium }
          - reported_at:    { type: datetime, label: Reported at, required: true }
          - description:    { type: long_text, required: true }
          - excursion_minutes: { type: integer, label: Minutes out of range, min: 0, max: 1440 }
          - max_temp_c:     { type: decimal, label: Peak temp (°C), min: -5, max: 40 }
          - root_cause_category: { type: choice, label: Root cause, choices: root_cause_category }
          - root_cause:     { type: long_text, label: Root cause detail }
          - corrective_action: { type: long_text, label: Corrective action }
          - ops_signed_off_by: { type: link, to: app_user, label: Ops sign-off, readonly: true }
          - product_impact: { type: choice, label: Product impact, choices: product_impact, readonly: true }
          - qa_assessment:  { type: long_text, label: QA assessment, readonly: true }
        validation:
          rules:
            - when: exception_type == temp_excursion
              require: [excursion_minutes, max_temp_c]
              message: Enter the minutes out of range and the peak temperature from the logger.
        access:
          Logistics Partner: { actions: [view, add], rows: { own: delivery.logistics_partner } }
          Supply Chain Ops:  { actions: [view, add, edit, export] }
          Quality Assurance: { actions: [view, export], rows: { where: "exception_type in [temp_excursion, damaged]" } }
        workflow:
          statuses:
            - { code: open,          label: Open,          color: red, initial: true }
            - { code: investigating, label: Investigating, color: amber }
            - { code: pending_qa,    label: Pending QA,    color: purple }
            - { code: resolved,      label: Resolved,      color: green, final: true }
          transitions:
            - { name: acknowledge, label: Acknowledge, from: open, to: investigating, roles: [Supply Chain Ops], primary: true,
                on_done: "Email the partner's escalation contact that the exception is under investigation." }
            - name: sign_off
              label: Sign Off
              from: investigating
              to: resolved
              roles: [Supply Chain Ops]
              primary: true
              condition: exception_type not_in [temp_excursion, damaged]
              condition_msg: Excursions and damaged packs go to QA for sign-off.
              form:
                - root_cause_category: { type: choice, choices: root_cause_category, required: true }
                - root_cause:          { type: long_text, required: true }
                - corrective_action:   { type: long_text, required: true }
              on_done: Email the logistics partner the root cause and corrective action.
            - name: send_to_qa
              label: Send to QA
              from: investigating
              to: pending_qa
              roles: [Supply Chain Ops]
              primary: true
              condition: exception_type in [temp_excursion, damaged]
              form:
                - root_cause_category: { type: choice, choices: root_cause_category, required: true }
                - root_cause:          { type: long_text, required: true }
                - corrective_action:   { type: long_text, required: true }
              on_done: Set ops_signed_off_by = current user and email Quality Assurance with the logger trace attached.
            - name: qa_sign_off
              label: QA Sign Off
              from: pending_qa
              to: resolved
              roles: [Quality Assurance]
              primary: true
              form:
                - product_impact: { type: choice, choices: product_impact, required: true }
                - qa_assessment:  { type: long_text, required: true }
              condition: { text: The QA approver is not the user in ops_signed_off_by (maker-checker). }
              condition_msg: A different person must give the QA sign-off.
              on_done: "If product_impact is none, release the delivery's hold; otherwise send the delivery back and create a return with reason temp_excursion or damaged. Email Supply Chain Ops the decision."
            - { name: return_to_ops, label: Back to Ops, from: pending_qa, to: investigating, roles: [Quality Assurance],
                form: [ { qa_query: { type: long_text, label: Query for ops, required: true } } ] }
          tags:
            - { code: escalated, label: Escalated, color: red, enable: { roles: [Supply Chain Ops] }, disable: { roles: [Supply Chain Ops] } }
            - { code: repeat_route, label: Repeat on Route, color: amber, system: true, text: Set when the delivery's route has 3 or more exceptions of this type in the last 30 days. }
        table:
          columns:
            - exception_ref:  { label: Exception, searchable: true, sortable: true }
            - delivery:       { label: Delivery, display: delivery_ref, searchable: true }
            - partner:        { source: computed, label: Partner, path: delivery.logistics_partner.legal_name }
            - city:           { source: computed, label: City, path: delivery.city }
            - exception_type: { label: Type, filterable: true }
            - severity:       { label: Severity, filterable: true }
            - reported_at:    { label: Reported, sortable: true }
            - product_impact: { label: Impact, filterable: true, roles: [Quality Assurance, Supply Chain Ops] }
            - status:         { source: status, label: Status, filterable: true }
          default_sort: -reported_at
          quick_filters:
            - { label: Open, where: "status in [open, investigating, pending_qa]", default: true, roles: [Supply Chain Ops, Logistics Partner] }
            - { label: Awaiting QA, where: status == pending_qa, roles: [Quality Assurance], default: true }
            - { label: Excursions, where: exception_type == temp_excursion }
          add_button: Report Exception
        form:
          create:
            roles: [Logistics Partner, Supply Chain Ops]
            sections:
              - { title: Exception, fields: [delivery, exception_type, severity, reported_at, description] }
              - title: Temperature
                fields:
                  - excursion_minutes: { show_when: exception_type == temp_excursion }
                  - max_temp_c:        { show_when: exception_type == temp_excursion }
          edit: { fields: [severity, description], roles: [Supply Chain Ops], editable_in: [open, investigating] }

      - code: delivery_return
        name: Return
        plural: Returns
        kind: transactional
        display: return_ref
        fields:
          - return_ref:   { type: text, label: Return, readonly: true, unique: true, auto: { sequence: "RTN-{YY}-{00000}" } }
          - delivery:     { type: link, to: delivery, required: true, display: delivery_ref }
          - reason:       { type: choice, choices: return_reason, required: true }
          - quantity:     { type: integer, label: Packs, required: true, min: 1, max: 6 }
          - pickup_date:  { type: date, label: Pick-up date }
          - received_serial: { type: text, label: Serial received, readonly: true }
          - received_at:  { type: datetime, label: Received at, readonly: true }
          - disposition:  { type: choice, choices: disposition, readonly: true }
          - credit_note_no: { type: text, label: ERP returns note, readonly: true }
          - notes:        { type: long_text }
        validation:
          duplicate_check:
            scope: { where: "status not_in [rejected]" }
            rules:
              - { match: [delivery], compare: exact, on_match: block, message: This delivery already has an open return. }
        access:
          Pharmacy:          { actions: [view, add], rows: { own: delivery.pharmacy } }
          Logistics Partner: { actions: [view], rows: { own: delivery.logistics_partner } }
          Supply Chain Ops:  { actions: [view, add, export] }
          Quality Assurance: { actions: [view, export] }
        workflow:
          statuses:
            - { code: requested,   label: Requested,   color: gray, initial: true }
            - { code: approved,    label: Approved,    color: blue }
            - { code: in_transit,  label: In Transit,  color: indigo }
            - { code: received,    label: Received,    color: amber }
            - { code: pending_qa,  label: Destruction Pending QA, color: purple }
            - { code: closed,      label: Closed,      color: green, final: true }
            - { code: rejected,    label: Rejected,    color: red, final: true }
          transitions:
            - { name: approve, label: Approve, from: requested, to: approved, roles: [Supply Chain Ops], primary: true,
                form: [ { pickup_date: { type: date, required: true } } ],
                on_done: "Book the pick-up with the delivery's logistics partner for pickup_date." }
            - { name: collect, label: Collected, from: approved, to: in_transit, roles: [Logistics Partner], primary: true }
            - { name: receive, label: Receive, from: in_transit, to: received, roles: [Pharmacy], primary: true,
                form: [ { received_serial: { type: text, label: Scan serial, required: true } } ],
                condition: { text: The scanned serial is the serial that was shipped on the delivery. },
                condition_msg: This is not the pack that was shipped.,
                on_done: Set received_at = now and mark the serial returned. }
            - { name: close, label: Close with Disposition, from: received, to: closed, roles: [Supply Chain Ops], primary: true,
                form: [ { disposition: { type: choice, choices: disposition, required: true } } ],
                condition: { text: The disposition is restock or quarantine; destroy goes to QA. },
                condition_msg: Send a destroy disposition to QA.,
                on_done: Post the return and its disposition to the ERP and store the returns note number. }
            - { name: request_destruction, label: Request Destruction, from: received, to: pending_qa, roles: [Supply Chain Ops], tone: danger }
            - { name: approve_destruction, label: Approve Destruction, from: pending_qa, to: closed, roles: [Quality Assurance], tone: danger,
                confirm: "Approve destruction of this pack?",
                on_done: "Set disposition = destroy, mark the serial destroyed (decommissioned in L3) and post to the ERP." }
            - { name: reject, label: Reject, from: requested, to: rejected, roles: [Supply Chain Ops], tone: danger,
                form: [ { reject_reason: { type: long_text, required: true } } ] }
        table:
          columns:
            - return_ref:  { label: Return, searchable: true, sortable: true }
            - delivery:    { label: Delivery, display: delivery_ref, searchable: true }
            - pharmacy:    { source: computed, label: Pharmacy, path: delivery.pharmacy.name }
            - reason:      { label: Reason, filterable: true }
            - quantity:    { label: Packs }
            - pickup_date: { label: Pick-up, sortable: true }
            - disposition: { label: Disposition, filterable: true }
            - status:      { source: status, label: Status, filterable: true }
          default_sort: -created_at
          quick_filters:
            - { label: To approve, where: status == requested, roles: [Supply Chain Ops], default: true }
            - { label: To collect, where: status == approved, roles: [Logistics Partner], default: true }
            - { label: To receive, where: status == in_transit, roles: [Pharmacy], default: true }
            - { label: Destruction pending, where: status == pending_qa, roles: [Quality Assurance], default: true }
          add_button: Raise Return
        form:
          create: { roles: [Pharmacy, Supply Chain Ops], fields: [delivery, reason, quantity, notes] }

# -----------------------------------------------------------------------------
#  360 PAGES
# -----------------------------------------------------------------------------
detail_views:
  - code: delivery_360
    hero: delivery
    title: "{delivery_ref}"
    back_to: deliveries
    layout: header_tabs_sidebar
    roles: [Supply Chain Ops, Pharmacy, Logistics Partner, Quality Assurance]
    header:
      title: delivery_ref
      subtitle: ["{product.name}", "{route.route_code}", "{patient_ref}"]
      badges: [ { source: status }, { source: tags }, { field: sla_status, prefix: "SLA: " } ]
      facts:
        - { label: Promised by, field: promised_by }
        - { label: Partner, path: logistics_partner.legal_name }
        - { label: Serial, field: serial_no, copyable: true }
        - { label: Failed attempts, field: attempts }
        - { label: Delivered at, field: delivered_at, fallback: "—" }
      actions:
        transitions: true
        tags: true
        buttons:
          - { key: report_exception, label: Report Exception, type: create_related, entity: route_exception, prefill: { delivery: hero } }
      banners:
        - { show_when: has_tag sla_breach, tone: danger, text: This delivery has breached its promised-by time. }
        - { show_when: status == on_hold, tone: danger, text: "On hold for QA: the pack must not be delivered until QA releases it." }
        - { show_when: has_tag cold_chain, tone: info, text: "Cold-chain pack (2–8 °C): record the temperature at the door." }
    stats:
      - { label: Failed attempts, value: { count: route_exception, via: delivery, where: "exception_type in [address_issue, recipient_absent]" }, tone: amber, link_to_tab: exceptions }
      - { label: Open exceptions, value: { count: route_exception, via: delivery, where: "status in [open, investigating, pending_qa]" }, tone: red, link_to_tab: exceptions }
      - { label: Out-of-range readings, value: { count: temperature_reading, via: delivery, where: out_of_range is_true }, tone: red, link_to_tab: temperature, show_when: has_tag cold_chain }
      - { label: Returns, value: { count: delivery_return, via: delivery }, tone: purple, link_to_tab: returns }
    sidebar:
      - { type: fields, title: Order, fields: [erp_order_no, pharmacy, city, delivery_type, preferred_slot] }
      - { type: fields, title: Recipient, fields: [patient_ref, delivery_address, pincode] }
      - { type: fields, title: Pack, fields: [product, serial_no, batch_no, quantity, temperature_class, logger_id] }
      - type: custom
        title: Journey
        text: "A vertical stepper: booked, handed over, out for delivery, each failed attempt, delivered or returned, each with its time and the scan that confirmed it; the current step highlighted and the promised-by time marked."
        preview: |
          const d = ctx.record, pods = ctx.related('proof_of_delivery', 'delivery'), exc = ctx.related('route_exception', 'delivery'), rets = ctx.related('delivery_return', 'delivery');
          const t = v => v ? String(v).slice(0, 16).replace('T', ' ') : '', rank = { booked: 0, handed_over: 1, out_for_delivery: 2, attempt_failed: 3, on_hold: 3, delivered: 4, returning: 4, returned: 5, cancelled: 0 }[d.status] || 0;
          const pod = pods.slice().sort((a, b) => String(b.captured_at).localeCompare(String(a.captured_at)))[0], ret = rets[0];
          const fails = Math.max(d.status === 'attempt_failed' ? 1 : 0, (+d.attempts || 0) - (d.status === 'delivered' ? 1 : 0)), why = exc.filter(e => ['recipient_absent', 'address_issue'].includes(e.exception_type));
          const steps = [
            { label: 'Booked', at: d.created_at, scan: d.erp_order_no && 'ERP order ' + d.erp_order_no, done: true },
            { label: 'Handed over', at: d.handed_over_at, scan: d.serial_no && 'Serial ' + d.serial_no + ' scanned at pickup', done: rank >= 1 },
            { label: 'Out for delivery', at: null, scan: d.logger_id && 'Logger ' + d.logger_id + ' started', done: rank >= 2 },
            ...Array.from({ length: fails }, (_, i) => ({ label: `Attempt ${i + 1} failed`, at: why[i] && why[i].reported_at, scan: why[i] ? ctx.fmt(why[i], 'exception_type') : 'No exception logged', done: true, bad: true })),
            ['returning', 'returned'].includes(d.status)
              ? { label: d.status === 'returned' ? 'Returned' : 'Returning to pharmacy', at: ret && (ret.received_at || ret.pickup_date), scan: ret && (ret.received_serial ? 'Serial ' + ret.received_serial + ' received' : ctx.fmt(ret, 'reason')), done: rank >= 4, bad: true }
              : { label: 'Delivered', at: d.delivered_at, scan: pod && `${ctx.fmt(pod, 'method')}${pod.scanned_serial ? ' · serial ' + pod.scanned_serial : ''}${pod.received_by ? ' · ' + pod.received_by : ''}`, done: rank >= 4 }];
          const cur = d.status === 'cancelled' ? -1 : steps.map(s => s.done).lastIndexOf(true), late = d.promised_by && new Date(d.promised_by) < new Date(d.delivered_at || Date.now());
          return `<div style="display:flex;flex-direction:column">${steps.map((s, i) => { const on = i === cur, col = s.bad ? '#D92D20' : s.done ? 'var(--brand)' : '#D0D5DD'; return `
            ${i === steps.length - 1 && d.promised_by ? `<div style="margin:0 0 8px 22px;padding:4px 8px;border:1px dashed ${late ? '#FDA29B' : '#D0D5DD'};border-radius:6px;font-size:12px;color:${late ? '#B42318' : '#667085'}">Promised by ${ctx.esc(ctx.fmt(d, 'promised_by'))}${late ? ' · missed' : ''}</div>` : ''}
            <div style="display:grid;grid-template-columns:14px 1fr;gap:8px;min-height:46px">
              <div style="display:flex;flex-direction:column;align-items:center"><i style="width:12px;height:12px;border-radius:50%;margin-top:3px;background:${s.done ? col : '#fff'};border:2px solid ${col};${on ? 'box-shadow:0 0 0 4px var(--b100)' : ''}"></i>${i < steps.length - 1 ? `<i style="flex:1;width:2px;background:${steps[i + 1].done ? col : '#EAECF0'}"></i>` : ''}</div>
              <div style="padding-bottom:10px"><div style="font-size:13px;font-weight:${on ? 650 : 550};color:${s.done ? '#101828' : '#98A2B3'}">${ctx.esc(s.label)}${on ? ' <span class="pv-badge">Current</span>' : ''}</div>
                <div class="pv-muted">${ctx.esc(s.done ? t(s.at) || 'time not captured' : 'pending')}</div>${s.scan && s.done ? `<div class="pv-muted" style="color:#475467">${ctx.esc(s.scan)}</div>` : ''}</div></div>`; }).join('')}
            ${d.status === 'cancelled' ? '<span class="pv-badge" style="background:#FEF3F2;color:#B42318;border-color:#FECDCA">Cancelled</span>' : ''}</div>`;
    tabs:
      - code: pod
        label: Proof of Delivery
        type: related_table
        entity: proof_of_delivery
        via: delivery
        count_badge: true
        columns: [pod_ref, method, relation, captured_at, temperature_c, distance_m, status]
        add: { label: Capture POD, prefill: { delivery: hero } }
        empty_state: { title: No proof yet, text: "The courier captures the OTP, the serial scan and (for cold chain) the door temperature.", cta: add }
      - code: temperature
        label: Temperature
        type: related_table
        entity: temperature_reading
        via: delivery
        show_when: has_tag cold_chain
        columns: [reading_at, temperature_c, source, out_of_range]
        add: { label: Add Reading, prefill: { delivery: hero } }
      - code: exceptions
        label: Exceptions
        type: related_table
        entity: route_exception
        via: delivery
        count_badge: { where: "status in [open, investigating, pending_qa]", tone: red }
        columns: [exception_ref, exception_type, severity, reported_at, product_impact, status]
        add: { label: Report Exception, prefill: { delivery: hero } }
      - code: returns
        label: Returns
        type: related_table
        entity: delivery_return
        via: delivery
        columns: [return_ref, reason, quantity, pickup_date, disposition, status]
      - code: activity
        label: Tracking
        type: timeline
        sources:
          - { entity: delivery, events: [created, transition, tag] }
          - { entity: proof_of_delivery, via: delivery, events: [created, transition] }
          - { entity: route_exception, via: delivery, events: [created, transition] }
          - { entity: delivery_return, via: delivery, events: [created, transition] }
    states:
      not_found: { title: Delivery not found, back_to: deliveries }

  - code: partner_360
    hero: logistics_partner
    title: "{legal_name}"
    back_to: partners
    layout: header_tabs
    roles: [Supply Chain Ops, Logistics Partner]
    header:
      avatar: { fallback_initials: legal_name }
      title: legal_name
      subtitle: ["{partner_code}", "{states_served}"]
      badges: [ { source: tags }, { field: cold_chain_qualified, prefix: "Cold chain: " } ]
      facts:
        - { label: On-time (30 d), field: on_time_pct }
        - { label: First attempt (30 d), field: first_attempt_pct }
        - { label: Contract until, field: contract_valid_until }
        - { label: Escalation, field: escalation_contact, copyable: true }
      actions:
        tags: true
        buttons:
          - { key: edit, label: Edit, type: edit, roles: [Supply Chain Ops] }
      banners:
        - { show_when: has_tag qualification_expiring, tone: warning, text: "Cold-chain qualification runs out on {qualification_valid_until}." }
    stats:
      - { label: Open deliveries, value: { count: delivery, via: logistics_partner, where: "status in [handed_over, out_for_delivery, attempt_failed, on_hold]" }, tone: blue, link_to_tab: deliveries }
      - { label: Breached now, value: { count: delivery, via: logistics_partner, where: "sla_status == breached" }, tone: red, link_to_tab: deliveries }
      - { label: Open exceptions, value: { count: route_exception, via: delivery.logistics_partner, where: "status in [open, investigating, pending_qa]" }, tone: amber, link_to_tab: exceptions }
      - { label: Routes, value: { count: route, via: logistics_partner }, tone: teal, link_to_tab: routes }
    tabs:
      - code: deliveries
        label: Deliveries
        type: related_table
        entity: delivery
        via: logistics_partner
        columns: [delivery_ref, city, route, promised_by, sla_status, status]
        row_click: delivery_360
      - code: exceptions
        label: Exceptions
        type: related_table
        entity: route_exception
        via: delivery.logistics_partner
        columns: [exception_ref, delivery, exception_type, severity, reported_at, status]
      - code: routes
        label: Routes
        type: related_table
        entity: route
        via: logistics_partner
        columns: [route_code, name, city, pharmacy, sla_hours, cold_chain]
      - code: scorecard
        label: Scorecard
        type: custom
        text: "On-time % and first-attempt % per week for the last 12 weeks (line), excursions and disputed PODs per month (bar), and a by-city table of deliveries, on-time %, failed attempts and returns."
        preview: |
          const dl = ctx.related('delivery', 'logistics_partner'), ids = dl.map(d => d.id), mine = r => ids.includes(r.delivery);
          const exc = ctx.rows('route_exception').filter(mine).filter(e => e.exception_type === 'temp_excursion'), disp = ctx.rows('proof_of_delivery').filter(mine).filter(p => p.status === 'disputed'), rets = ctx.rows('delivery_return').filter(mine);
          const now = new Date(), wk = d => Math.floor((now - new Date(d)) / 6048e5), pct = (n, t) => t ? Math.round(100 * n / t) : null;
          const W = Array.from({ length: 12 }, (_, i) => 11 - i), ot = [], fa = []; let po = null, pf = null;
          W.forEach(w => { const rs = dl.filter(d => d.promised_by && wk(d.promised_by) >= w), del = rs.filter(d => d.status === 'delivered'); po = rs.length ? pct(rs.filter(d => d.sla_status !== 'breached').length, rs.length) : po; pf = del.length ? pct(del.filter(d => (+d.attempts || 1) <= 1).length, del.length) : pf; ot.push(po); fa.push(pf); });
          const X = i => 30 + i * 34, Y = v => 130 - v * 1.1, pl = s => s.map((v, i) => v == null ? '' : `${X(i)},${Y(v)}`).filter(Boolean).join(' ');
          const months = [5, 4, 3, 2, 1, 0].map(i => { const d = new Date(now.getFullYear(), now.getMonth() - i, 15); return { k: d.toISOString().slice(0, 7), label: d.toLocaleString('en', { month: 'short' }) }; });
          const mc = (rs, f) => months.map(m => rs.filter(r => String(r[f] || '').slice(0, 7) === m.k).length), ex = mc(exc, 'reported_at'), dp = mc(disp, 'captured_at'), mTop = Math.max(1, ...ex, ...dp);
          const cities = (ctx.entity('delivery').fields.find(f => f.key === 'city').opts || []).map(c => { const rs = dl.filter(d => d.city === c.id); return { c, n: rs.length, ot: pct(rs.filter(d => d.sla_status !== 'breached').length, rs.length), fail: rs.reduce((a, d) => a + Math.max(0, (+d.attempts || 0) - (d.status === 'delivered' ? 1 : 0)), 0), ret: rets.filter(r => rs.some(d => d.id === r.delivery)).length }; }).filter(x => x.n);
          const legend = (c, l) => `<span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${c}"></i> ${l}</span>`;
          if (!dl.length) return `<div class="pv-muted">No deliveries assigned to ${ctx.esc(ctx.record.legal_name)} yet.</div>`;
          return `<div style="display:grid;grid-template-columns:1.4fr 1fr;gap:12px;align-items:start">
            <div class="pv-card"><b style="font-weight:600">On-time and first-attempt % to date, last 12 weeks</b>
              <svg viewBox="0 0 420 150" style="width:100%;height:auto;font:10px sans-serif;fill:#98A2B3">${[0, 50, 95, 100].map(v => `<line x1="30" x2="408" y1="${Y(v)}" y2="${Y(v)}" stroke="${v === 95 ? '#FDA29B' : '#EAECF0'}" stroke-dasharray="${v === 95 ? '4 3' : ''}"/>${v === 95 ? '' : `<text x="0" y="${Y(v) + 3}">${v}%</text>`}`).join('')}${W.map((w, i) => i % 2 ? '' : `<text x="${X(i) - 8}" y="146">${w ? 'W-' + w : 'Now'}</text>`).join('')}
                ${[[ot, '#1570EF'], [fa, '#12B76A']].map(([s, c]) => `<polyline points="${pl(s)}" fill="none" stroke="${c}" stroke-width="2"/>${s.map((v, i) => v == null ? '' : `<circle cx="${X(i)}" cy="${Y(v)}" r="2.5" fill="${c}"/>`).join('')}`).join('')}</svg>
              <div class="pv-muted" style="display:flex;gap:12px">${legend('#1570EF', 'On-time')}${legend('#12B76A', 'First attempt')}${legend('#FDA29B', '95% target')}</div></div>
            <div class="pv-card"><b style="font-weight:600">Excursions and disputed PODs per month</b>
              <div style="display:flex;align-items:flex-end;gap:10px;height:110px;margin-top:10px">${months.map((m, i) => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px"><div style="display:flex;align-items:flex-end;gap:3px;height:86px">${[[ex[i], '#F04438'], [dp[i], '#F79009']].map(([v, c]) => `<i title="${v}" style="width:10px;height:${Math.max(2, 86 * v / mTop)}px;background:${v ? c : '#EAECF0'};border-radius:3px 3px 0 0"></i>`).join('')}</div><span class="pv-muted">${m.label}</span></div>`).join('')}</div>
              <div class="pv-muted" style="display:flex;gap:12px">${legend('#F04438', `Excursions (${exc.length})`)}${legend('#F79009', `Disputed PODs (${disp.length})`)}</div></div>
          </div>
          <table class="z-t" style="margin-top:12px"><thead><tr><th>City</th><th>Deliveries</th><th>On-time %</th><th>Failed attempts</th><th>Returns</th></tr></thead><tbody>${cities.map(x => `<tr><td><b style="font-weight:550">${ctx.esc(x.c.label)}</b></td><td>${x.n}</td><td style="color:${x.ot < 95 ? '#B42318' : '#067647'};font-weight:600">${x.ot}%</td><td>${x.fail}</td><td>${x.ret}</td></tr>`).join('')}</tbody></table>`;
    states:
      not_found: { title: Partner not found, back_to: partners }
