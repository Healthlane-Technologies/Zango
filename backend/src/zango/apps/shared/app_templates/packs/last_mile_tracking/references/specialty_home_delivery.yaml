    - { id: nagpur,    label: Nagpur }
    - { id: bengaluru, label: Bengaluru }
    - { id: mysuru,    label: Mysuru }
    - { id: hubballi,  label: Hubballi }
  delivery_type:
    - { id: home,   label: Home delivery,   color: blue }
    - { id: clinic, label: Clinic / infusion centre, color: indigo }
  delivery_slot:
    - { id: morning,   label: "Morning (9–12)" }
    - { id: afternoon, label: "Afternoon (12–4)" }
    - { id: evening,   label: "Evening (4–8)" }
