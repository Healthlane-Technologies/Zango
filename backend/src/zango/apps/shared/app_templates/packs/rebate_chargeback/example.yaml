# Rebates & Chargebacks — US Specialty: rebate and chargeback management for a
# US specialty portfolio. About 40 GPO, IDN and PBM agreements; three national
# wholesalers send chargebacks daily over EDI 844; PBMs and IDNs claim rebates
# quarterly with utilisation data checked against 867 sales data; Finance books
# monthly accruals with maker-checker sign-off and posts them to SAP. A
# filled-in instance of the Rebate & Chargeback Management template.
spec_version: 1

# -----------------------------------------------------------------------------
#  APP
# -----------------------------------------------------------------------------
app:
  code: us_specialty_gtn
  name: Rebates & Chargebacks — US Specialty
  description: Run 40 GPO, IDN and PBM agreements, validate daily wholesaler chargebacks and quarterly rebate claims against contract terms, and book monthly gross-to-net accruals into SAP.
  timezone: America/New_York
  locale: en-US
  currency: USD
  theme: { primary: "#4338CA", secondary: "#475569" }
  custom_requirements:
    - area: integration
      title: SAP connector
      text: >
        Nightly at 02:00 ET, pull the material master with WAC and its effective date, and the
        sold-to customer master, from SAP. When a rebate claim is approved, post a payment request
        with the claim_ref; when a chargeback batch is credited, post one credit memo per batch;
        when an accrual is posted or reversed, post the journal to the gross-to-net GL accounts.
        SAP returns document numbers, which drive the mark_paid and settle transitions.
    - area: integration
      title: EDI 844 / 849 chargebacks
      text: >
        Each of the three national wholesalers sends an EDI 844 file every business day through
        the VAN. Every file creates one chargeback_batch with its lines as chargeback records and
        starts validation. When a batch is credited or partly disputed, send the 849 response
        with the accepted and rejected lines and reason codes.
    - area: integration
      title: 867 sales data and claims data feed
      text: >
        Load weekly 867 product transfer data from the wholesalers and quarterly utilisation files
        from PBMs and IDNs. Claim validation compares claimed units with 867 units for the same
        customer, product and quarter and flags any line more than 5% over.
    - area: report
      title: Gross-to-net reporting
      text: Monthly gross-to-net bridge (WAC sales, chargebacks, rebates, admin fees, net sales) by product and customer type, and accrual versus actual by agreement and quarter, exportable to Excel.
    - area: permission
      title: Customer scoping
      text: Each Customer login sees only its own agreements, eligibility roster, claims, chargebacks and payments. Internal roles see all customers.

# -----------------------------------------------------------------------------
#  CHOICE SETS
# -----------------------------------------------------------------------------
