# CAR-T Scheduling — East: a filled-in Cell Therapy Orchestration app.
# 12 authorised treatment centres request apheresis slots, a central
# manufacturing scheduler approves each request against weekly capacity and
# per-site quotas, QA releases each batch, couriers log every custody handoff,
# and the site confirms infusion. Every step carries the chain-of-identity ID.

spec_version: 1

app:
  code: car_t_scheduling_east
  name: CAR-T Scheduling — East
  description: Vein-to-vein scheduling and chain of custody for an autologous CAR-T therapy across 12 authorised treatment centres in the East region.
  timezone: Asia/Kolkata
  locale: en-IN
  currency: INR
  theme: { primary: "#7C3AED", secondary: "#475467" }
  custom_requirements:
    - area: permission
      title: Chain-of-identity masking
      text: Patient initials and year of birth are visible only to the patient's own treatment site and the Manufacturing Scheduler; couriers and QA see the COI ID alone.
    - area: backend
      title: Audit trail
      text: Every create, edit, transition and custody event is written to an append-only audit log with user, timestamp, old and new values, exportable as CSV by the Manufacturing Scheduler.
    - area: backend
      title: Electronic signatures
      text: Collection, release, receipt and infusion confirmations ask for the user's password again and record it as an e-signature with meaning (collected, released, received, infused).

choice_sets:
  indication:
    - { id: dlbcl, label: DLBCL }
    - { id: b_all, label: B-ALL }
    - { id: mm,    label: Multiple Myeloma }
    - { id: mcl,   label: Mantle Cell Lymphoma }
    - { id: fl,    label: Follicular Lymphoma }
  therapy_product:
    - { id: anti_cd19, label: Anti-CD19 CAR-T }
    - { id: anti_bcma, label: Anti-BCMA CAR-T }
  region:
    - { id: kolkata,     label: Kolkata }
    - { id: bhubaneswar, label: Bhubaneswar }
    - { id: guwahati,    label: Guwahati }
    - { id: patna,       label: Patna }
    - { id: ranchi,      label: Ranchi }
  priority:
    - { id: standard, label: Standard, color: gray }
    - { id: urgent,   label: Urgent,   color: red }
  shipment_leg:
    - { id: inbound,  label: Apheresis to manufacturing, color: blue }
    - { id: outbound, label: Manufacturing to site,      color: purple }
  shipper_type:
    - { id: cryo_dewar, label: LN2 dry shipper (≤ -150 °C) }
    - { id: cold_chain, label: 2–8 °C insulated box }
  custody_event_type:
    - { id: handover,  label: Handover,              color: blue }
    - { id: receipt,   label: Receipt,               color: green }
    - { id: scan,      label: Checkpoint scan,       color: gray }
    - { id: storage,   label: Into storage,          color: indigo }
    - { id: excursion, label: Temperature excursion, color: red }
  temperature_status:
    - { id: in_range,  label: In range,  color: green }
    - { id: excursion, label: Excursion, color: red }
  batch_doc_type:
    - { id: coa,           label: Certificate of analysis }
    - { id: release_cert,  label: QP release certificate }
    - { id: deviation,     label: Deviation report }
    - { id: bag_label,     label: Final bag label proof }

roles:
  - name: Site Coordinator
    description: Coordinator at one of the 12 treatment centres; enrols patients, requests slots, receives the product and confirms infusion.
    landing: patients
    menu:
      - { page: dashboard, icon: layout-dashboard }
      - { page: patients,  label: My Patients,   icon: users }
      - { page: slots,     label: Slot Requests, icon: calendar-clock }
      - { page: shipments, label: Inbound Product, icon: truck }
      - { page: custody_events, label: Custody Log, icon: link }
  - name: Apheresis Center
    description: Apheresis unit attached to a treatment centre; collects on the confirmed date and hands material to the courier.
    landing: slots
    menu:
      - { page: slots,     label: Apheresis Schedule, icon: calendar-clock }
      - { page: patients,  icon: users }
      - { page: shipments, label: Outgoing Material, icon: truck }
  - name: Manufacturing Scheduler
    description: Central scheduler who approves every slot request against capacity and quota, plans batches and books couriers.
    landing: dashboard
    menu:
      - { page: dashboard,        icon: layout-dashboard }
      - { page: capacity_planner, icon: calendar-range }
      - { page: slots,            label: Slot Requests, icon: calendar-clock }
      - { page: batches,          icon: flask-conical }
      - { page: patients,         icon: users }
      - { page: shipments,        icon: truck }
      - { page: custody_events,   icon: link }
      - group: Network
        icon: network
        items:
          - { page: treatment_sites }
          - { page: apheresis_centres }
          - { page: manufacturing_sites }
          - { page: capacity_weeks }
          - { page: couriers }
  - name: Quality Assurance
    description: Reviews batch records and releases or rejects each batch.
    landing: batches
    menu:
      - { page: batches,        label: Release Queue, icon: shield-check }
      - { page: custody_events, label: Custody Log,   icon: link }
  - name: Courier
    description: Specialist courier partner; picks up, transports and hands over shippers and logs every custody event.
    landing: shipments
    menu:
      - { page: shipments,      label: My Shipments, icon: truck }
      - { page: custody_events, label: Custody Log,  icon: link }

pages:
  - code: dashboard
    type: custom
    route: /app/dashboard
    title: Orchestration Dashboard
    component: OrchestrationDashboard
    roles: [Site Coordinator, Manufacturing Scheduler]
    text: >
      KPI row: slots this month (vs last month), patients in manufacturing, shipments in transit,
      on-time infusion rate (infused on or before target infusion, last 90 days). Below: vein-to-vein
      time by site (median days, enrolment to infusion) and a table of patients by stage with COI, site,
      stage, slot date and days in stage, oldest first. Site Coordinators see only their own centre.
    preview: |
      const P = ctx.rows('patient'), sl = ctx.rows('slot'), sh = ctx.rows('shipment'), PE = ctx.entity('patient');
      const now = new Date(), days = d => Math.floor((now - new Date(d)) / 864e5), ym = d => String(d || '').slice(0, 7);
      const thisM = now.toISOString().slice(0, 7), lastM = new Date(now.getFullYear(), now.getMonth() - 1, 15).toISOString().slice(0, 7);
      const slotDate = s => s.apheresis_date || s.preferred_date, booked = s => ['confirmed', 'used'].includes(s.status);
      const slotsM = sl.filter(s => booked(s) && ym(slotDate(s)) === thisM).length, slotsL = sl.filter(s => booked(s) && ym(slotDate(s)) === lastM).length;
      const inf = P.filter(p => p.status === 'infused' && p.infusion_date), inf90 = inf.filter(p => days(p.infusion_date) <= 90), base = inf90.length ? inf90 : inf;
      const onTime = base.length ? Math.round(100 * base.filter(p => !p.expected_infusion_date || p.infusion_date <= p.expected_infusion_date).length / base.length) : null;
      const med = a => { a = a.slice().sort((x, y) => x - y); return a.length ? a[Math.floor((a.length - 1) / 2)] : 0; };
      const bySite = {}; P.filter(p => p.status !== 'withdrawn').forEach(p => { const end = p.infusion_date || p.expected_infusion_date, d = end ? Math.round((new Date(end) - new Date(p.created_at)) / 864e5) : null; if (d > 0) (bySite[p.treatment_site] = bySite[p.treatment_site] || { name: ctx.fmt(p, 'treatment_site'), d: [] }).d.push(d); });
      const sites = Object.values(bySite).map(s => ({ ...s, m: med(s.d) })).sort((a, b) => a.m - b.m), top = Math.max(1, ...sites.map(s => s.m));
      const stageStart = p => ({ apheresis_collected: p.collection_date, infused: p.infusion_date })[p.status] || p.created_at;
      const pipe = P.filter(p => !['infused', 'withdrawn'].includes(p.status)).map(p => ({ p, s: sl.filter(s => s.patient === p.id && s.status !== 'cancelled').sort((a, b) => String(slotDate(b)).localeCompare(String(slotDate(a))))[0], d: Math.max(0, days(stageStart(p))) })).sort((a, b) => b.d - a.d);
      const badge = r => { const s = PE.wf.smap[r.status] || { label: r.status, color: 'gray' }, [bg, fg] = ctx.tone(s.color); return `<span class="pv-badge" style="background:${bg};color:${fg};border-color:transparent">${ctx.esc(s.label)}</span>`; };
      const delta = slotsM - slotsL;
      return `
      <div class="pv-kpis">
        <div class="pv-kpi" data-go="slots"><span>Slots this month</span><b>${slotsM}</b><span style="color:${delta >= 0 ? '#067647' : '#B42318'}">${delta >= 0 ? '+' : ''}${delta} vs last month</span></div>
        <div class="pv-kpi" data-go="patients"><span>Patients in manufacturing</span><b>${P.filter(p => p.status === 'in_manufacturing').length}</b></div>
        <div class="pv-kpi" data-go="shipments"><span>Shipments in transit</span><b>${sh.filter(s => ['picked_up', 'in_transit'].includes(s.status)).length}</b><span style="color:#B42318">${sh.filter(s => s.status === 'exception').length} exceptions</span></div>
        <div class="pv-kpi"><span>On-time infusion${inf90.length ? ', last 90 days' : ''}</span><b>${onTime == null ? '—' : onTime + '%'}</b><div class="pv-bar" style="margin-top:8px"><i style="width:${onTime || 0}%"></i></div></div>
      </div>
      <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:12px;align-items:start">
        <div class="d-panel"><h3>${ctx.icon('timer')}Vein-to-vein by site<span class="sp"></span><span class="pv-muted">median days</span></h3>
          <div style="padding:12px 16px;display:flex;flex-direction:column;gap:10px">${sites.map(s => `
            <div style="display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;font-size:13px"><span style="font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ctx.esc(s.name)}</span>
              <div class="pv-bar" style="height:10px"><i style="width:${Math.round(100 * s.m / top)}%"></i></div><b style="text-align:right;font-weight:600">${s.m}d</b></div>`).join('') || '<span class="pv-muted">No enrolments yet.</span>'}
            <span class="pv-muted">Enrolment to infusion; planned infusion date for patients not yet infused.</span></div></div>
        <div class="d-panel"><h3>${ctx.icon('users')}Patients by stage<span class="sp"></span><span class="pv-badge">${pipe.length} active</span></h3>
          <div style="overflow-x:auto"><table class="z-t"><thead><tr><th>COI</th><th>Site</th><th>Stage</th><th>Slot date</th><th>Days</th></tr></thead><tbody>${pipe.slice(0, 8).map(x => `
            <tr class="click" data-go="patient_360:${x.p.id}"><td><b style="font-weight:550">${ctx.esc(x.p.coi_id)}</b></td><td style="max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ctx.esc(ctx.fmt(x.p, 'treatment_site'))}</td><td>${badge(x.p)}</td>
              <td>${x.s ? ctx.esc(ctx.fmt(x.s, x.s.apheresis_date ? 'apheresis_date' : 'preferred_date')) : '<span class="pv-muted">No slot</span>'}</td><td style="font-weight:550;color:${x.d > 30 ? '#B42318' : 'inherit'}">${x.d}</td></tr>`).join('')}</tbody></table></div></div>
      </div>`;
  - code: capacity_planner
    type: custom
    route: /app/capacity
    title: Capacity Planner
    component: CapacityPlanner
    roles: [Manufacturing Scheduler]
    text: >
      A 8-week grid, one row per manufacturing site, one column per week: booked / total slots, coloured
      green under 75%, amber to 100%, red when full. Clicking a cell lists the confirmed and waitlisted
      slots for that week. A side panel shows each treatment site's quota use this month.
    preview: |
      const ms = ctx.rows('manufacturing_site'), cw = ctx.rows('capacity_week'), sl = ctx.rows('slot').filter(s => ['confirmed', 'used', 'waitlisted'].includes(s.status));
      const iso = d => d.toISOString().slice(0, 10), mon = new Date(); mon.setHours(0, 0, 0, 0); mon.setDate(mon.getDate() - (mon.getDay() + 6) % 7);
      const weeks = [...Array(8)].map((_, i) => { const a = new Date(mon); a.setDate(a.getDate() + 7 * i); const b = new Date(a); b.setDate(b.getDate() + 7); return { a: iso(a), b: iso(b), label: a.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) }; });
      const inW = (d, w) => d && d >= w.a && d < w.b, sd = s => s.apheresis_date || s.preferred_date;
      const occ = (s, w) => { const a = sd(s), b = s.expected_release || a; return a && a < w.b && b >= w.a; }; // a slot holds capacity from apheresis to release
      const cell = (m, w) => { const c = cw.find(x => x.manufacturing_site === m.id && inW(x.week_start, w)), ss = sl.filter(s => s.manufacturing_site === m.id && occ(s, w));
        const total = c ? +c.total_slots || 0 : +m.default_capacity || 0, booked = c ? +c.booked_slots || 0 : ss.filter(s => s.status !== 'waitlisted').length; return { total, booked, wait: ss.filter(s => s.status === 'waitlisted').length, pct: total ? booked / total : 1 }; };
      const col = p => p >= 1 ? ['#FEE4E2', '#B42318'] : p >= .75 ? ['#FEF0C7', '#B54708'] : ['#DCFAE6', '#067647'];
      const month = new Date().toISOString().slice(0, 7), P = ctx.rows('patient');
      const quota = ctx.rows('treatment_site').filter(t => t.is_authorised !== false).map(t => { const ids = P.filter(p => p.treatment_site === t.id).map(p => p.id); const used = sl.filter(s => s.status !== 'waitlisted' && ids.includes(s.patient) && String(sd(s)).slice(0, 7) === month).length; return { t, used, q: +t.monthly_quota || 0 }; }).sort((a, b) => b.used / (b.q || 1) - a.used / (a.q || 1));
      return `
      <div style="display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px;align-items:start">
        <div class="d-panel"><h3>${ctx.icon('calendar-range')}Booked / total slots, next 8 weeks<span class="sp"></span><span class="pv-muted">green &lt;75% · amber to 100% · red full</span></h3>
          <table class="z-t" style="table-layout:fixed"><colgroup><col style="width:180px"></colgroup><thead><tr><th>Site · week of</th>${weeks.map(w => `<th style="text-align:center;padding:8px 2px">${w.label}</th>`).join('')}</tr></thead><tbody>${ms.map(m => `
            <tr><td><b style="font-weight:550">${ctx.esc(m.name)}</b><div class="pv-muted">${ctx.esc(m.city || '')} · ${+m.turnaround_days || '—'}d turnaround</div></td>${weeks.map(w => { const c = cell(m, w), [bg, fg] = col(c.pct); return `
              <td style="padding:4px 3px"><div data-go="slots" title="${c.wait} waitlisted" style="cursor:pointer;background:${bg};color:${fg};border-radius:8px;padding:7px 4px;text-align:center;font-weight:600;font-size:12.5px">${c.booked}/${c.total}${c.wait ? `<div style="font-weight:500;font-size:11px">+${c.wait} wait</div>` : ''}</div></td>`; }).join('')}</tr>`).join('')}</tbody></table></div>
        <div class="d-panel"><h3>${ctx.icon('hospital')}Site quota, this month</h3>
          <div style="padding:12px 14px;display:flex;flex-direction:column;gap:11px">${quota.map(x => { const pct = x.q ? Math.min(100, Math.round(100 * x.used / x.q)) : 0, full = x.q && x.used >= x.q; return `
            <div data-go="treatment_sites"><div style="display:flex;justify-content:space-between;font-size:13px"><span style="font-weight:550">${ctx.esc(x.t.centre_name)}</span><span style="font-size:12px;color:${full ? '#B42318' : '#667085'}">${x.used} / ${x.q}</span></div>
              <div class="pv-bar" style="margin-top:5px"><i style="width:${pct}%;${full ? 'background:#D92D20' : ''}"></i></div></div>`; }).join('') || '<span class="pv-muted">No authorised sites.</span>'}</div></div>
      </div>`;
  - { code: patients,            type: crud,   entity: patient,            route: /app/patients,       title: Patients }
  - { code: patient_360,         type: detail, detail_view: patient_360,   route: /app/patients/:id }
  - { code: slots,               type: crud,   entity: slot,               route: /app/slots,          title: Slot Requests }
  - { code: batches,             type: crud,   entity: batch,              route: /app/batches,        title: Batches }
  - { code: batch_360,           type: detail, detail_view: batch_360,     route: /app/batches/:id }
  - { code: shipments,           type: crud,   entity: shipment,           route: /app/shipments,      title: Shipments }
  - { code: custody_events,      type: crud,   entity: custody_event,      route: /app/custody-events, title: Custody Events }
  - { code: treatment_sites,     type: crud,   entity: treatment_site,     route: /app/network/treatment-sites,     title: Treatment Sites }
  - { code: apheresis_centres,   type: crud,   entity: apheresis_centre,   route: /app/network/apheresis-centres,   title: Apheresis Centres }
  - { code: manufacturing_sites, type: crud,   entity: manufacturing_site, route: /app/network/manufacturing-sites, title: Manufacturing Sites }
  - { code: capacity_weeks,      type: crud,   entity: capacity_week,      route: /app/network/capacity,            title: Weekly Capacity }
  - { code: couriers,            type: crud,   entity: courier,            route: /app/network/couriers,            title: Couriers }

modules:
  # ===========================================================================
  - code: network
    name: Network
    description: Authorised treatment centres, apheresis units, manufacturing sites, weekly capacity and couriers.
    entities:
      - code: treatment_site
        name: Treatment Site
        kind: master
        display: centre_name
        app_user: { role: Site Coordinator, name: coordinator_name, email: coordinator_email, mobile: coordinator_phone, create_on: is_authorised is_true }
        fields:
          - site_code:          { type: text, label: Site code, required: true, unique: true, pattern: "^TS-[0-9]{2}$", pattern_msg: Use TS- and two digits. }
          - centre_name:        { type: text, label: Centre, required: true, unique: true }
          - city:               { type: text, required: true }
          - region:             { type: choice, choices: region, required: true }
          - coordinator_name:   { type: text, required: true }
          - coordinator_email:  { type: email, required: true }
          - coordinator_phone:  { type: phone, pattern: "^[6-9][0-9]{9}$", pattern_msg: 10-digit mobile. }
          - monthly_quota:      { type: integer, label: Slots per month, min: 1, max: 12, required: true, help: Slots this site may hold in a calendar month. }
          - is_authorised:      { type: boolean, label: Authorised, default: true }
          - authorisation_expiry: { type: date, label: Authorisation expires }
        access:
          Manufacturing Scheduler: { actions: [view, add, edit, export] }
          Site Coordinator:        { actions: [view], rows: { own: id } }
        table:
          columns:
            - site_code:            { label: Code, searchable: true, sortable: true }
            - centre_name:          { label: Centre, searchable: true, sortable: true }
            - region:               { label: Region, filterable: true }
            - coordinator_name:     { label: Coordinator }
            - monthly_quota:        { label: Quota / month }
            - quota_used:           { source: computed, label: Used this month, format: number, shows: Count of this site's slots confirmed for an apheresis date in the current month. }
            - authorisation_expiry: { label: Authorisation expires, sortable: true }
            - is_authorised:        { label: Authorised, filterable: true }
          default_sort: site_code
          quick_filters:
            - { label: Authorised, where: is_authorised is_true, default: true }
        form:
          create:
            sections:
              - { title: Centre, fields: [site_code, centre_name, city, region] }
              - { title: Coordinator, fields: [coordinator_name, coordinator_email, coordinator_phone] }
              - { title: Authorisation, fields: [monthly_quota, is_authorised, authorisation_expiry] }
          edit: { same_as: create }
        custom_requirements:
          - { area: scheduled, title: Authorisation expiry, text: "Daily at 07:00, email the Manufacturing Scheduler about sites whose authorisation expires within 30 days, and set is_authorised = false the day after expiry." }

      - code: apheresis_centre
        name: Apheresis Centre
        kind: master
        display: centre_name
        app_user: { role: Apheresis Center, name: centre_name, email: contact_email }
        fields:
          - centre_name:    { type: text, label: Centre, required: true, unique: true }
          - treatment_site: { type: link, to: treatment_site, display: centre_name, required: true }
          - city:           { type: text }
          - contact_email:  { type: email, required: true }
          - collection_days: { type: multi_choice, label: Collection days, choices: [ {id: mon, label: Mon}, {id: tue, label: Tue}, {id: wed, label: Wed}, {id: thu, label: Thu}, {id: fri, label: Fri} ] }
        access:
          Manufacturing Scheduler: { actions: [view, add, edit] }
          Site Coordinator:        { actions: [view], rows: { own: treatment_site } }
          Apheresis Center:        { actions: [view], rows: { own: id } }
        table:
          columns:
            - centre_name:     { label: Centre, searchable: true }
            - treatment_site:  { label: Treatment site, display: centre_name, filterable: true }
            - city:            { label: City }
            - collection_days: { label: Collects on }
          default_sort: centre_name
        form:
          create: { fields: [centre_name, treatment_site, city, contact_email, collection_days] }
          edit:   { same_as: create }

      - code: manufacturing_site
        name: Manufacturing Site
        kind: master
        display: name
        fields:
          - name:              { type: text, required: true, unique: true }
          - city:              { type: text, required: true }
          - default_capacity:  { type: integer, label: Default slots per week, min: 1, max: 20, required: true }
          - turnaround_days:   { type: integer, label: Vein-to-vein target (days), min: 10, max: 40, required: true }
        access:
          Manufacturing Scheduler: { actions: [view, add, edit] }
          Quality Assurance:       { actions: [view] }
        table:
          columns:
            - name:             { label: Site, searchable: true }
            - city:             { label: City }
            - default_capacity: { label: Slots / week }
            - turnaround_days:  { label: Target days }
        form:
          create: { fields: [name, city, default_capacity, turnaround_days] }
          edit:   { same_as: create }

      - code: capacity_week
        name: Capacity Week
        kind: master
        display: week_start
        fields:
          - manufacturing_site: { type: link, to: manufacturing_site, display: name, required: true }
          - week_start:         { type: date, label: Week starting, required: true, help: A Monday. }
          - total_slots:        { type: integer, label: Slots, min: 0, max: 20, required: true }
          - booked_slots:       { type: integer, label: Booked, readonly: true, computed: Count of confirmed slots at this site with an apheresis date in this week. }
          - note:               { type: text, help: "e.g. Line maintenance, reduced capacity." }
        validation:
          duplicate_check:
            rules:
              - { match: [manufacturing_site, week_start], compare: exact, on_match: block, message: Capacity for this site and week already exists. }
        access:
          Manufacturing Scheduler: { actions: [view, add, edit, export] }
        table:
          columns:
            - manufacturing_site: { label: Site, display: name, filterable: true }
            - week_start:         { label: Week, sortable: true }
            - total_slots:        { label: Slots }
            - booked_slots:       { label: Booked }
            - utilisation:        { source: computed, label: Utilisation, format: percent, shows: booked_slots / total_slots. }
            - note:               { label: Note }
          default_sort: week_start
        form:
          create: { fields: [manufacturing_site, week_start, total_slots, note] }
          edit:   { same_as: create }

      - code: courier
        name: Courier
        kind: master
        display: legal_name
        app_user: { role: Courier, name: legal_name, email: ops_email, mobile: ops_phone }
        fields:
          - legal_name:        { type: text, label: Courier, required: true, unique: true }
          - ops_email:         { type: email, label: Operations email, required: true }
          - ops_phone:         { type: phone, required: true }
          - gdp_certified:     { type: boolean, label: GDP certified, default: true }
          - tracking_enabled:  { type: boolean, label: Tracking API connected }
        access:
          Manufacturing Scheduler: { actions: [view, add, edit] }
          Courier:                 { actions: [view], rows: { own: id } }
        table:
          columns:
            - legal_name:       { label: Courier, searchable: true }
            - ops_email:        { label: Operations email }
            - ops_phone:        { label: Phone }
            - gdp_certified:    { label: GDP, filterable: true }
            - tracking_enabled: { label: Live tracking, filterable: true }
        form:
          create: { fields: [legal_name, ops_email, ops_phone, gdp_certified, tracking_enabled] }
          edit:   { same_as: create }

  # ===========================================================================
  - code: therapy
    name: Therapy Journey
    description: The patient's chain of identity, slot booking and manufacturing.
    entities:
      - code: patient
        name: Patient
        kind: hero
        display: coi_id
        description: One patient's CAR-T order, identified on every record, label and handoff by its COI ID.
        fields:
          - coi_id:             { type: text, label: COI ID, readonly: true, unique: true, auto: { sequence: "COI-{YY}{0000}" } }
          - patient_initials:   { type: text, label: Initials, required: true, pattern: "^[A-Z]{2,3}$", pattern_msg: 2-3 capital letters. }
          - year_of_birth:      { type: integer, min: 1940, max: 2015, required: true }
          - weight_kg:          { type: decimal, label: Weight (kg), min: 20, max: 200, required: true }
          - hospital_mrn:       { type: text, label: Hospital MRN, help: Stays at the site; never shown to other parties. }
          - treatment_site:     { type: link, to: treatment_site, display: centre_name, required: true, limit_choices: is_authorised is_true }
          - treating_physician: { type: text, required: true }
          - indication:         { type: choice, choices: indication, required: true }
          - therapy_product:    { type: choice, label: Product, choices: therapy_product, required: true }
          - priority:           { type: choice, choices: priority, default: standard }
          - apheresis_centre:   { type: link, to: apheresis_centre, display: centre_name, required: true, limit_choices: treatment_site == form.treatment_site }
          - consent_signed:     { type: boolean, label: Treatment consent signed, required: true }
          - consent_form:       { type: file, accept: [pdf], max_size_mb: 10 }
          - expected_infusion_date: { type: date, label: Target infusion }
          - collection_date:    { type: date, readonly: true }
          - infusion_date:      { type: date, readonly: true }
          - hold_reason:        { type: long_text, readonly: true }
        validation:
          rules:
            - { when: consent_signed is_true, require: [consent_form], message: Upload the signed consent form. }
          duplicate_check:
            scope: { where: "status not_in [withdrawn]" }
            rules:
              - { match: [hospital_mrn, treatment_site], compare: exact, on_match: block, message: This MRN already has an active COI at this site. }
              - { match: [patient_initials, year_of_birth, treatment_site], compare: exact, on_match: warn, message: A patient with the same initials and year of birth is already enrolled here. }
        access:
          Site Coordinator:        { actions: [view, add, edit, export, detail], rows: { own: treatment_site } }
          Apheresis Center:        { actions: [view, detail], rows: { own: apheresis_centre } }
          Manufacturing Scheduler: { actions: [view, export, detail] }
        workflow:
          statuses:
            - { code: enrolled,            label: Enrolled,            color: gray, initial: true }
            - { code: apheresis_scheduled, label: Apheresis Scheduled, color: blue }
            - { code: apheresis_collected, label: Apheresis Collected, color: teal }
            - { code: in_manufacturing,    label: In Manufacturing,    color: indigo }
            - { code: ready_to_infuse,     label: Ready to Infuse,     color: purple }
            - { code: infused,             label: Infused,             color: green }
            - { code: on_hold,             label: On Hold,             color: amber }
            - { code: withdrawn,           label: Withdrawn,           color: red, final: true }
          transitions:
            - { name: schedule_apheresis, label: Apheresis Scheduled, from: enrolled, to: apheresis_scheduled, trigger: system,
                text: When the Manufacturing Scheduler confirms this patient's slot. }
            - name: collect
              label: Confirm Collection
              from: apheresis_scheduled
              to: apheresis_collected
              roles: [Apheresis Center]
              primary: true
              form:
                - collection_date: { type: date, required: true }
                - bag_count:       { type: integer, label: Bags collected, min: 1, max: 4, required: true }
                - coi_verified:    { type: boolean, label: COI label checked against the patient wristband, required: true }
              condition: { text: The COI on the collection bag label matches the patient's COI and the collection date is the confirmed slot date or one day after. }
              condition_msg: Check the COI label and collection date before confirming.
              on_done: Save collection_date, mark the slot Used, create the inbound shipment with the slot's courier and email the courier and the Manufacturing Scheduler.
            - { name: start_manufacturing, label: Manufacturing Started, from: apheresis_collected, to: in_manufacturing, trigger: system,
                text: When the patient's batch moves to In Manufacturing. }
            - { name: product_received, label: Product Received, from: in_manufacturing, to: ready_to_infuse, trigger: system,
                text: When the outbound shipment is received at the treatment site. }
            - name: infuse
              label: Confirm Infusion
              from: ready_to_infuse
              to: infused
              roles: [Site Coordinator]
              primary: true
              confirm: Confirm this patient has been infused?
              form:
                - infusion_date:  { type: date, required: true }
                - coi_scanned:    { type: boolean, label: Bag COI scanned at bedside and matched, required: true }
                - administered_by: { type: text, required: true }
              condition: { text: "The released batch's COI equals the patient's COI, the bag is within its expiry, and the shipment was received with no open excursion." }
              condition_msg: The product's COI must match this patient and the product must be in date.
              on_done: Save infusion_date, close the chain of custody, email the Manufacturing Scheduler and start the 28-day follow-up reminder.
            - name: hold
              label: Put on Hold
              from: [enrolled, apheresis_scheduled, ready_to_infuse]
              to: on_hold
              roles: [Site Coordinator]
              form: [ { hold_reason: { type: long_text, required: true } } ]
              on_done: Save hold_reason, email the Manufacturing Scheduler, and if a slot is confirmed ask whether to keep or release it.
            - { name: resume, label: Resume, from: on_hold, to: enrolled, roles: [Site Coordinator], on_done: Clear hold_reason. }
            - name: withdraw
              label: Withdraw
              from: [enrolled, apheresis_scheduled, on_hold]
              to: withdrawn
              roles: [Site Coordinator]
              tone: danger
              confirm: Withdraw this patient? Their slot will be released.
              form: [ { withdrawal_reason: { type: long_text, required: true } } ]
              on_done: Cancel any open slot request and release its manufacturing capacity.
          tags:
            - { code: bridging_therapy, label: On Bridging Therapy, color: amber,
                enable: { roles: [Site Coordinator] }, disable: { roles: [Site Coordinator] } }
            - { code: late, label: Behind Target, color: red, system: true,
                text: Set nightly when today is past expected_infusion_date and the patient is not infused. }
        form:
          create:
            roles: [Site Coordinator]
            title: Enrol Patient
            sections:
              - { title: Patient, fields: [patient_initials, year_of_birth, weight_kg, hospital_mrn, indication, therapy_product, priority] }
              - { title: Care team, fields: [treatment_site, treating_physician, apheresis_centre, expected_infusion_date] }
              - { title: Consent, fields: [consent_signed, consent_form] }
            on_create: Generate the COI ID and offer the printable COI label set (wristband, collection bag, shipper).
            after_create: patient_360
          edit:
            same_as: create
            roles: [Site Coordinator]
            editable_in: [enrolled, on_hold]
            readonly_when:
              - { when: status != enrolled, fields: [treatment_site, therapy_product] }
        table:
          columns:
            - coi_id:           { label: COI, searchable: true, sortable: true, link_to: patient_360 }
            - patient_initials: { label: Initials, roles: [Site Coordinator, Manufacturing Scheduler] }
            - treatment_site:   { label: Site, display: centre_name, filterable: true }
            - therapy_product:  { label: Product, filterable: true }
            - priority:         { label: Priority, filterable: true }
            - status:           { source: status, label: Stage, filterable: true }
            - slot_date:        { source: computed, label: Slot, shows: Confirmed apheresis date of the patient's latest confirmed or used slot. }
            - expected_infusion_date: { label: Target infusion, sortable: true }
            - tags:             { source: tags, label: Flags }
          default_sort: -created_at
          quick_filters:
            - { label: Needs a slot, where: status == enrolled, roles: [Site Coordinator] }
            - { label: Ready to infuse, where: status == ready_to_infuse, roles: [Site Coordinator] }
            - { label: In manufacturing, where: status == in_manufacturing }
            - { label: Behind target, where: has_tag late }
          row_click: patient_360
          add_button: Enrol Patient
          row_actions:
            - { key: open_360, label: Open COI 360, type: navigate, to: patient_360 }
            - { key: request_slot, label: Request Slot, type: navigate, to: slots, roles: [Site Coordinator], show_when: status == enrolled }
            - { key: coi_labels, label: Print COI Labels, type: download, roles: [Site Coordinator, Apheresis Center],
                text: "A label sheet: wristband, two collection bag labels and a shipper label, each with COI ID, initials, year of birth and a GS1 DataMatrix." }
        custom_requirements:
          - { area: notification, title: Stage emails, text: "On every stage change, email the site coordinator a one-line update with COI, new stage and next expected date; never include initials or MRN in the subject." }
          - { area: scheduled, title: Follow-up reminder, text: "28 days after infusion_date, remind the site coordinator to record the day-28 follow-up outcome." }

      - code: slot
        name: Slot
        kind: transactional
        display: slot_ref
        description: An apheresis date and the manufacturing capacity reserved for it; every request is approved centrally.
        fields:
          - slot_ref:           { type: text, label: Slot, readonly: true, unique: true, auto: { sequence: "SLT-{YY}-{0000}" } }
          - patient:            { type: link, to: patient, display: coi_id, required: true }
          - apheresis_centre:   { type: link, to: apheresis_centre, display: centre_name, required: true }
          - preferred_date:     { type: date, label: Preferred apheresis date, required: true }
          - alternate_date:     { type: date, label: Alternate date }
          - priority:           { type: choice, choices: priority, default: standard }
          - manufacturing_site: { type: link, to: manufacturing_site, display: name }
          - courier:            { type: link, to: courier, display: legal_name, help: Courier booked for the inbound leg. }
          - apheresis_date:     { type: date, label: Confirmed apheresis date, readonly: true }
          - expected_release:   { type: date, label: Expected release, readonly: true }
          - decision_note:      { type: text, readonly: true }
        validation:
          rules:
            - text: A slot can be requested only for an enrolled patient with no other open slot request.
              message: This patient already has an open slot or is past enrolment.
            - when: alternate_date is_set
              require_expr: alternate_date > preferred_date
              message: The alternate date must be after the preferred date.
            - text: The preferred date is at least 5 working days from today unless priority is urgent.
              message: Standard requests need 5 working days' notice.
        access:
          Site Coordinator:        { actions: [view, add], rows: { own: patient.treatment_site } }
          Apheresis Center:        { actions: [view], rows: { own: apheresis_centre } }
          Manufacturing Scheduler: { actions: [view, edit, export] }
        workflow:
          statuses:
            - { code: requested,  label: Requested,  color: amber, initial: true }
            - { code: confirmed,  label: Confirmed,  color: green }
            - { code: waitlisted, label: Waitlisted, color: purple }
            - { code: used,       label: Used,       color: blue, final: true }
            - { code: declined,   label: Declined,   color: gray, final: true }
            - { code: cancelled,  label: Cancelled,  color: red, final: true }
          transitions:
            - name: confirm
              label: Confirm Slot
              from: [requested, waitlisted]
              to: confirmed
              roles: [Manufacturing Scheduler]
              primary: true
              form:
                - manufacturing_site: { type: link, to: manufacturing_site, required: true }
                - apheresis_date:     { type: date, required: true }
                - expected_release:   { type: date, required: true }
                - courier:            { type: link, to: courier, required: true }
              condition:
                all:
                  - text: The capacity_week for the chosen site and the apheresis week has booked_slots < total_slots.
                  - text: The treatment site has used fewer confirmed slots this month than its monthly_quota, unless priority is urgent.
              condition_msg: That week is full or the site is over quota; waitlist the request or pick another week.
              on_done: Save the decision, increment the week's booked slots, move the patient to Apheresis Scheduled, book the courier pickup, and email the site coordinator, apheresis centre and courier.
            - { name: waitlist, label: Waitlist, from: requested, to: waitlisted, roles: [Manufacturing Scheduler],
                form: [ { decision_note: { type: text, required: true } } ],
                on_done: Save the note and tell the site coordinator the earliest week likely to free up. }
            - { name: decline, label: Decline, from: [requested, waitlisted], to: declined, roles: [Manufacturing Scheduler], tone: danger,
                form: [ { decision_note: { type: text, required: true } } ], on_done: Email the site coordinator the reason. }
            - { name: cancel, label: Cancel, from: [requested, waitlisted, confirmed], to: cancelled, roles: [Site Coordinator, Manufacturing Scheduler], tone: danger,
                form: [ { cancel_reason: { type: long_text, required: true } } ],
                on_done: Release the reserved capacity and cancel the courier booking if one exists. }
            - { name: mark_used, label: Mark Used, from: confirmed, to: used, trigger: system, text: When the apheresis centre confirms collection for the patient. }
        form:
          create:
            roles: [Site Coordinator]
            title: Request Slot
            fields:
              - patient
              - apheresis_centre
              - priority
              - preferred_date
              - alternate_date
            on_create: Email the Manufacturing Scheduler a new-request notice with COI, site, priority and dates.
        table:
          columns:
            - slot_ref:           { label: Slot, searchable: true }
            - patient:            { label: COI, display: coi_id, link_to: patient_360 }
            - site:               { source: computed, label: Site, path: patient.treatment_site.centre_name }
            - priority:           { label: Priority, filterable: true }
            - preferred_date:     { label: Preferred, sortable: true }
            - apheresis_date:     { label: Confirmed, sortable: true }
            - manufacturing_site: { label: Manufacturing, display: name, filterable: true }
            - status:             { source: status, label: Status, filterable: true }
          default_sort: preferred_date
          quick_filters:
            - { label: Awaiting decision, where: "status in [requested, waitlisted]", roles: [Manufacturing Scheduler], default: true }
            - { label: Urgent, where: priority == urgent }
            - { label: Upcoming collections, where: status == confirmed, roles: [Apheresis Center], default: true }
          add_button: Request Slot
        custom_requirements:
          - { area: scheduled, title: Offer freed capacity, text: "When a confirmed slot is cancelled, email the Manufacturing Scheduler the oldest waitlisted urgent request for that site's week first, then the oldest standard one." }

      - code: batch
        name: Batch
        plural: Batches
        kind: hero
        display: batch_no
        fields:
          - batch_no:             { type: text, label: Batch, readonly: true, unique: true, auto: { sequence: "B{YY}-{0000}" } }
          - patient:              { type: link, to: patient, display: coi_id, required: true }
          - slot:                 { type: link, to: slot, display: slot_ref, limit_choices: patient == form.patient }
          - manufacturing_site:   { type: link, to: manufacturing_site, display: name, required: true }
          - material_received_on: { type: date }
          - expected_release:     { type: date }
          - dose_million_cells:   { type: decimal, label: Dose (million CAR+ cells) }
          - bag_expiry:           { type: date, label: Product expiry }
          - released_by:          { type: link, to: app_user, readonly: true }
        access:
          Site Coordinator:        { actions: [view], rows: { own: patient.treatment_site } }
          Manufacturing Scheduler: { actions: [view, add, edit, export, detail] }
          Quality Assurance:       { actions: [view, export, detail] }
        workflow:
          statuses:
            - { code: awaiting_material, label: Awaiting Material, color: gray, initial: true }
            - { code: in_manufacturing,  label: In Manufacturing,  color: indigo }
            - { code: qc_testing,        label: QC Testing,        color: amber }
            - { code: pending_release,   label: Pending Release,   color: purple }
            - { code: released,          label: Released,          color: green }
            - { code: failed,            label: Failed,            color: red, final: true }
          transitions:
            - { name: start, label: Start Manufacturing, from: awaiting_material, to: in_manufacturing, roles: [Manufacturing Scheduler], primary: true,
                condition: material_received_on is_set, condition_msg: Record when the starting material arrived first.,
                on_done: Move the patient to In Manufacturing and email the site coordinator the expected release date. }
            - { name: to_qc, label: Send to QC, from: in_manufacturing, to: qc_testing, roles: [Manufacturing Scheduler] }
            - { name: submit_release, label: Submit for Release, from: qc_testing, to: pending_release, roles: [Manufacturing Scheduler],
                condition: { text: A certificate of analysis document is uploaded for this batch. }, condition_msg: Upload the CoA first. }
            - name: release
              label: Release
              from: pending_release
              to: released
              roles: [Quality Assurance]
              primary: true
              form:
                - dose_million_cells: { type: decimal, required: true }
                - bag_expiry:         { type: date, required: true }
              condition: { text: "The COI on the final bag label proof equals the patient's COI, and the releaser did not start the batch." }
              condition_msg: COI mismatch or the same person started the batch.
              on_done: Save dose and expiry, set released_by, book the outbound shipment and email the site coordinator the delivery window.
            - { name: send_back, label: Send Back to QC, from: pending_release, to: qc_testing, roles: [Quality Assurance],
                form: [ { qa_note: { type: long_text, required: true } } ] }
            - name: fail
              label: Fail Batch
              from: [in_manufacturing, qc_testing, pending_release]
              to: failed
              roles: [Manufacturing Scheduler, Quality Assurance]
              tone: danger
              form: [ { failure_reason: { type: long_text, required: true } } ]
              on_done: Email the site coordinator and the treating physician's site to discuss re-collection; put the patient on hold.
          tags:
            - { code: deviation, label: Deviation, color: amber,
                enable: { roles: [Quality Assurance, Manufacturing Scheduler] }, disable: { roles: [Quality Assurance] } }
        form:
          create: { roles: [Manufacturing Scheduler], title: New Batch, fields: [patient, slot, manufacturing_site, material_received_on, expected_release] }
          edit:   { same_as: create, roles: [Manufacturing Scheduler], editable_in: [awaiting_material, in_manufacturing] }
        table:
          columns:
            - batch_no:           { label: Batch, searchable: true, link_to: batch_360 }
            - patient:            { label: COI, display: coi_id }
            - manufacturing_site: { label: Site, display: name, filterable: true }
            - material_received_on: { label: Material in, sortable: true }
            - expected_release:   { label: Expected release, sortable: true }
            - days_in_mfg:        { source: computed, label: Days, format: days, shows: Days since material_received_on. }
            - status:             { source: status, label: Status, filterable: true }
            - tags:               { source: tags, label: Flags }
          default_sort: expected_release
          quick_filters:
            - { label: Awaiting my release, where: status == pending_release, roles: [Quality Assurance], default: true }
            - { label: In progress, where: "status in [awaiting_material, in_manufacturing, qc_testing]", roles: [Manufacturing Scheduler] }
          row_click: batch_360
          add_button: New Batch

      - code: batch_document
        name: Batch Document
        kind: child
        parent: { entity: batch, field: batch }
        display: doc_type
        fields:
          - batch:    { type: link, to: batch, required: true, on_delete: cascade }
          - doc_type: { type: choice, choices: batch_doc_type, required: true }
          - file:     { type: file, required: true, accept: [pdf], max_size_mb: 20 }
          - note:     { type: text }
        access:
          Manufacturing Scheduler: { actions: [view, add] }
          Quality Assurance:       { actions: [view, add] }
        table:
          columns:
            - doc_type:   { label: Document, filterable: true }
            - file:       { label: File }
            - note:       { label: Note }
            - created_at: { label: Uploaded, sortable: true }
          default_sort: -created_at
        form:
          create: { fields: [doc_type, file, note] }

  # ===========================================================================
  - code: logistics
    name: Logistics and Custody
    description: Inbound and outbound shipments and every custody handoff.
    entities:
      - code: shipment
        name: Shipment
        kind: transactional
        display: shipment_ref
        fields:
          - shipment_ref:      { type: text, label: Shipment, readonly: true, unique: true, auto: { sequence: "SHP-{00000}" } }
          - patient:           { type: link, to: patient, display: coi_id, required: true }
          - batch:             { type: link, to: batch, display: batch_no, limit_choices: patient == form.patient, help: Outbound leg only. }
          - leg:               { type: choice, choices: shipment_leg, required: true }
          - origin_centre:     { type: link, to: apheresis_centre, display: centre_name, label: Pickup from, help: Inbound leg only; the apheresis centre handing over the material. }
          - shipper_type:      { type: choice, choices: shipper_type, required: true }
          - courier:           { type: link, to: courier, display: legal_name, required: true }
          - awb_no:            { type: text, label: AWB }
          - logger_id:         { type: text, label: Temperature logger }
          - pickup_date:       { type: date, required: true }
          - expected_delivery: { type: date, required: true }
          - delivered_at:      { type: datetime, readonly: true }
        validation:
          rules:
            - { when: leg == outbound, require: [batch], message: An outbound shipment must name the released batch. }
            - { when: leg == inbound, require: [origin_centre], message: Name the apheresis centre the material is picked up from. }
            - { when: leg == inbound, require_expr: shipper_type == cryo_dewar, message: Starting material travels in an LN2 dry shipper., on_fail: warn }
        access:
          Site Coordinator:        { actions: [view], rows: { own: patient.treatment_site } }
          Apheresis Center:        { actions: [view], rows: { own: origin_centre } }
          Manufacturing Scheduler: { actions: [view, add, edit, export] }
          Courier:                 { actions: [view], rows: { own: courier } }
        workflow:
          statuses:
            - { code: booked,     label: Booked,     color: gray, initial: true }
            - { code: picked_up,  label: Picked Up,  color: blue }
            - { code: in_transit, label: In Transit, color: indigo }
            - { code: delivered,  label: Delivered,  color: teal }
            - { code: received,   label: Received,   color: green, final: true }
            - { code: exception,  label: Exception,  color: red }
          transitions:
            - name: pick_up
              label: Pick Up
              from: booked
              to: picked_up
              roles: [Courier]
              primary: true
              form:
                - awb_no:    { type: text, required: true }
                - logger_id: { type: text, required: true }
              on_done: Log a handover custody event from the sender to the courier with time and location.
            - { name: depart, label: In Transit, from: picked_up, to: in_transit, roles: [Courier] }
            - { name: deliver, label: Deliver, from: in_transit, to: delivered, roles: [Courier], primary: true,
                on_done: Set delivered_at and log a handover custody event at the destination. }
            - name: receive
              label: Confirm Receipt
              from: delivered
              to: received
              roles: [Site Coordinator, Manufacturing Scheduler]
              primary: true
              form:
                - coi_matched: { type: boolean, label: COI on the shipper matches, required: true }
                - logger_ok:   { type: boolean, label: Logger shows no excursion, required: true }
              condition: { text: "The receiver is the site coordinator of the destination site for an outbound leg, or the Manufacturing Scheduler for an inbound leg." }
              on_done: Log a receipt custody event; for an inbound leg set the batch's material_received_on, for an outbound leg move the patient to Ready to Infuse.
            - name: report_exception
              label: Report Exception
              from: [picked_up, in_transit, delivered]
              to: exception
              roles: [Courier, Site Coordinator, Manufacturing Scheduler]
              tone: danger
              form: [ { exception_note: { type: long_text, required: true } } ]
              on_done: SMS and email the Manufacturing Scheduler and the site coordinator at once, with the COI, AWB and last custody event.
            - { name: resolve, label: Resolve, from: exception, to: in_transit, roles: [Manufacturing Scheduler],
                form: [ { resolution: { type: long_text, required: true } } ] }
          tags:
            - { code: temp_excursion, label: Temperature Excursion, color: red, system: true, text: Set when any custody event on this shipment records an excursion. }
            - { code: delayed, label: Delayed, color: amber, system: true, text: Set when the courier tracking ETA is later than expected_delivery. }
        form:
          create:
            roles: [Manufacturing Scheduler]
            title: Book Shipment
            sections:
              - title: Consignment
                fields:
                  - patient
                  - leg
                  - origin_centre: { show_when: leg == inbound }
                  - batch: { show_when: leg == outbound }
                  - shipper_type
              - { title: Courier, fields: [courier, pickup_date, expected_delivery] }
          edit: { same_as: create, roles: [Manufacturing Scheduler], editable_in: [booked] }
        table:
          columns:
            - shipment_ref:      { label: Shipment, searchable: true }
            - patient:           { label: COI, display: coi_id }
            - leg:               { label: Leg, filterable: true }
            - courier:           { label: Courier, display: legal_name, filterable: true }
            - awb_no:            { label: AWB, searchable: true }
            - pickup_date:       { label: Pickup, sortable: true }
            - expected_delivery: { label: Due, sortable: true }
            - status:            { source: status, label: Status, filterable: true }
            - tags:              { source: tags, label: Flags }
          default_sort: expected_delivery
          quick_filters:
            - { label: Moving now, where: "status in [picked_up, in_transit]", default: true }
            - { label: Awaiting my receipt, where: status == delivered, roles: [Site Coordinator] }
            - { label: Exceptions, where: status == exception }
          add_button: Book Shipment
          row_actions:
            - { key: track, label: Track, type: navigate, to: { field: awb_no }, show_when: awb_no is_set }
            - { key: manifest, label: Download Manifest, type: download, text: "Shipment manifest with COI, shipper type, logger ID, chain of custody so far and receiver signature block." }
        custom_requirements:
          - { area: integration, title: Courier tracking API, text: "Every 15 minutes while picked_up or in_transit, pull the courier's tracking status and ETA by AWB; write a checkpoint scan custody event for each new scan and set the delayed tag when ETA passes expected_delivery." }

      - code: custody_event
        name: Custody Event
        kind: transactional
        display: event_type
        fields:
          - shipment:         { type: link, to: shipment, display: shipment_ref, required: true, on_delete: protect }
          - event_type:       { type: choice, choices: custody_event_type, required: true }
          - event_at:         { type: datetime, label: When, required: true }
          - city:             { type: text, label: Location, required: true }
          - handed_by_name:   { type: text, label: Handed by, required: true }
          - received_by_name: { type: text, label: Received by }
          - coi_verified:     { type: boolean, label: COI verified, required: true }
          - temperature:      { type: choice, choices: temperature_status, required: true }
          - photo:            { type: image, label: Seal photo }
        validation:
          rules:
            - { when: "event_type in [handover, receipt]", require: [received_by_name], message: Name who took custody. }
            - { when: coi_verified is_false, require: [received_by_name], message: Name who received the material when the COI could not be verified. }
        access:
          Courier:                 { actions: [view, add], rows: { own: shipment.courier } }
          Site Coordinator:        { actions: [view, add], rows: { own: shipment.patient.treatment_site } }
          Manufacturing Scheduler: { actions: [view, export] }
          Quality Assurance:       { actions: [view, export] }
        form:
          create:
            title: Log Custody Event
            fields: [shipment, event_type, event_at, city, handed_by_name, received_by_name, coi_verified, temperature, photo]
            on_create: If temperature is excursion or coi_verified is false, move the shipment to Exception and alert the Manufacturing Scheduler.
        table:
          columns:
            - shipment:         { label: Shipment, display: shipment_ref, searchable: true }
            - coi:              { source: computed, label: COI, path: shipment.patient.coi_id }
            - event_type:       { label: Event, filterable: true }
            - event_at:         { label: When, sortable: true }
            - city:             { label: Location }
            - handed_by_name:   { label: Handed by }
            - received_by_name: { label: Received by }
            - coi_verified:     { label: COI verified, filterable: true }
            - temperature:      { label: Temperature, filterable: true }
          default_sort: -event_at
          quick_filters:
            - { label: Excursions, where: temperature == excursion }
            - { label: COI not verified, where: coi_verified is_false }
          add_button: Log Custody Event

detail_views:
  - code: patient_360
    hero: patient
    title: "{coi_id}"
    back_to: patients
    layout: header_tabs_sidebar
    roles: [Site Coordinator, Apheresis Center, Manufacturing Scheduler]
    header:
      title: coi_id
      subtitle: ["{patient_initials}", "{therapy_product}", "{treatment_site.centre_name}"]
      badges: [ { source: status }, { source: tags }, { field: priority } ]
      facts:
        - { label: COI, field: coi_id, copyable: true }
        - { label: Indication, field: indication }
        - { label: Physician, field: treating_physician }
        - { label: Collected, field: collection_date, fallback: "—" }
        - { label: Target infusion, field: expected_infusion_date }
        - { label: Infused, field: infusion_date, show_when: status == infused }
      actions:
        transitions: true
        tags: true
        buttons:
          - { key: request_slot, label: Request Slot, icon: calendar-plus, type: create_related, entity: slot, prefill: { patient: hero }, roles: [Site Coordinator], show_when: status == enrolled }
          - { key: coi_labels, row_action: coi_labels }
      banners:
        - { show_when: status == on_hold, tone: warning, text: "On hold: {hold_reason}" }
        - { show_when: has_tag late, tone: danger, text: "Past the target infusion date of {expected_infusion_date}." }
        - { show_when: status == ready_to_infuse, tone: info, text: Product received. Scan the bag COI at the bedside before confirming infusion. }
    stats:
      - { label: Slots, value: { count: slot, via: patient }, icon: calendar-clock, tone: blue, link_to_tab: slots }
      - { label: Shipments, value: { count: shipment, via: patient }, icon: truck, tone: indigo, link_to_tab: shipments }
      - { label: Custody events, value: { count: custody_event, via: shipment.patient }, icon: link, tone: teal, link_to_tab: custody }
      - { label: Excursions, value: { count: custody_event, via: shipment.patient, where: temperature == excursion }, icon: thermometer, tone: red, link_to_tab: custody }
    sidebar:
      - { type: fields, title: Patient, fields: [patient_initials, year_of_birth, weight_kg, indication, therapy_product, priority] }
      - { type: fields, title: Sites, fields: [treatment_site, apheresis_centre, treating_physician] }
      - type: custom
        title: Vein-to-vein
        text: "A vertical stepper: enrolled, slot confirmed, collected, manufacturing, released, shipped, received, infused, each with its date and days since the previous step; the current step highlighted."
        preview: |
          const p = ctx.record, slot = ctx.related('slot', 'patient').filter(s => ['confirmed', 'used'].includes(s.status))[0];
          const batch = ctx.related('batch', 'patient').filter(b => b.status !== 'failed')[0], out = ctx.related('shipment', 'patient').filter(s => s.leg === 'outbound')[0];
          const order = ['enrolled', 'apheresis_scheduled', 'apheresis_collected', 'in_manufacturing', 'ready_to_infuse', 'infused'];
          const steps = [
            { label: 'Enrolled', date: String(p.created_at || '').slice(0, 10), at: 0 },
            { label: 'Slot confirmed', date: slot && (slot.apheresis_date || slot.preferred_date), at: 1 },
            { label: 'Collected', date: p.collection_date, at: 2 },
            { label: 'Manufacturing', date: batch && batch.material_received_on, at: 3 },
            { label: 'Released', date: batch && batch.status === 'released' && batch.expected_release, at: 3.5 },
            { label: 'Shipped', date: out && out.pickup_date, at: 3.7 },
            { label: 'Received', date: out && ['received'].includes(out.status) && String(out.delivered_at || out.expected_delivery || '').slice(0, 10), at: 4 },
            { label: 'Infused', date: p.infusion_date, at: 5 },
          ];
          const cur = order.indexOf(p.status), stalled = cur < 0;
          const curStep = stalled ? -1 : steps.reduce((k, s, i) => s.at <= cur ? i : k, 0);
          let prev = null;
          return `<div style="display:flex;flex-direction:column">${stalled ? `<div class="pv-badge" style="margin-bottom:8px;background:#FEF0C7;color:#B54708;border-color:transparent">${ctx.esc(ctx.fmt(p, 'status'))}</div>` : ''}${steps.map((s, i) => {
            const done = !stalled && i < curStep, now = i === curStep, d = (done || now) && s.date ? s.date : null;
            const gap = d && prev ? Math.round((new Date(d) - new Date(prev)) / 864e5) : null; if (d) prev = d;
            const dot = now ? 'var(--brand)' : done ? '#12B76A' : '#D0D5DD';
            return `<div style="display:grid;grid-template-columns:18px 1fr;gap:10px">
              <div style="display:flex;flex-direction:column;align-items:center"><i style="width:12px;height:12px;border-radius:50%;margin-top:3px;background:${dot};${now ? 'box-shadow:0 0 0 4px var(--b100)' : ''}"></i>${i < steps.length - 1 ? `<i style="flex:1;width:2px;background:${done ? '#12B76A' : '#EAECF0'};min-height:18px"></i>` : ''}</div>
              <div style="padding-bottom:10px"><div style="font-size:13px;font-weight:${now ? 650 : 550};color:${done || now ? '#101828' : '#98A2B3'}">${s.label}</div>
                <div class="pv-muted">${d ? ctx.esc(new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })) + (gap > 0 ? ` · +${gap}d` : '') : now ? 'In progress' : '—'}</div></div></div>`; }).join('')}</div>`;
    tabs:
      - code: slots
        label: Slots
        type: related_table
        entity: slot
        via: patient
        columns: [slot_ref, priority, preferred_date, apheresis_date, manufacturing_site, status]
        count_badge: true
        add: { label: Request Slot, prefill: { patient: hero }, show_when: status == enrolled }
        empty_state: { title: No slot yet, text: Request an apheresis slot to start manufacturing planning., cta: add }
      - { code: batches, label: Manufacturing, type: related_table, entity: batch, via: patient, columns: [batch_no, manufacturing_site, expected_release, status], row_click: batch_360 }
      - { code: shipments, label: Shipments, type: related_table, entity: shipment, via: patient, columns: [shipment_ref, leg, courier, pickup_date, expected_delivery, status, tags], count_badge: true }
      - { code: custody, label: Chain of Custody, type: related_table, entity: custody_event, via: shipment.patient, columns: [shipment, event_type, event_at, city, handed_by_name, received_by_name, coi_verified, temperature], add: false }
      - code: activity
        label: Activity
        type: timeline
        sources:
          - { entity: patient, events: [created, updated, transition, tag] }
          - { entity: slot, via: patient, events: [created, transition] }
          - { entity: batch, via: patient, events: [transition] }
          - { entity: shipment, via: patient, events: [transition] }
          - { entity: custody_event, via: shipment.patient, events: [created] }
        show_field_changes: true
    states:
      not_found: { title: COI not found, text: It may belong to another site., back_to: patients }

  - code: batch_360
    hero: batch
    title: "{batch_no}"
    back_to: batches
    layout: header_tabs
    roles: [Manufacturing Scheduler, Quality Assurance]
    header:
      title: batch_no
      subtitle: ["{patient.coi_id}", "{manufacturing_site.name}"]
      badges: [ { source: status }, { source: tags } ]
      facts:
        - { label: COI, path: patient.coi_id, copyable: true }
        - { label: Material in, field: material_received_on }
        - { label: Expected release, field: expected_release }
        - { label: Dose, field: dose_million_cells, show_when: status == released }
        - { label: Expiry, field: bag_expiry, show_when: status == released }
      actions: { transitions: true, tags: true }
      banners:
        - { show_when: has_tag deviation, tone: warning, text: A deviation is open on this batch; attach the deviation report before release. }
    stats:
      - { label: Documents, value: { count: batch_document, via: batch }, tone: blue, link_to_tab: documents }
      - { label: Days in manufacturing, value: { text: today minus material_received_on }, tone: indigo }
    tabs:
      - code: documents
        label: Documents
        type: related_table
        entity: batch_document
        via: batch
        columns: inherit
        count_badge: true
        add: { label: Upload Document, prefill: { batch: hero } }
        empty_state: { title: No documents, text: Upload the CoA and bag label proof before submitting for release., cta: add }
      - { code: details, label: Details, type: fields, sections: [ { title: Batch, columns: 2, fields: [patient, slot, manufacturing_site, material_received_on, expected_release, dose_million_cells, bag_expiry, released_by] } ] }
      - code: activity
        label: Activity
        type: timeline
        sources:
          - { entity: batch, events: [created, updated, transition, tag] }
          - { entity: batch_document, via: batch, events: [created] }
    states:
      not_found: { title: Batch not found, back_to: batches }
