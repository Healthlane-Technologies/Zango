  - code: patients
    name: Patients
    description: Patient enrollment, contraception counseling and monthly pregnancy testing.
    entities:
      - code: patient
        name: Patient
        kind: hero
        display: rems_id
        fields:
          - rems_id:       { type: text, label: REMS ID, readonly: true, unique: true, auto: { sequence: "RP-{YY}{00000}" } }
          - patient_name:  { type: text, required: true }
          - year_of_birth: { type: integer, required: true, min: 1950, max: 2014 }
          - category:      { type: choice, label: Patient category, choices: patient_category, required: true }
          - prescriber:    { type: link, to: prescriber, display: full_name, required: true, limit_choices: status == certified }
          - enrollment_channel: { type: choice, label: Channel, choices: enrollment_channel, default: portal }
          - agreement_signed: { type: boolean, label: Patient-prescriber agreement signed, required: true }
          - agreement_file: { type: file, label: Signed agreement, accept: [pdf, jpg] }
          - counseled_on:   { type: date, label: Contraception counseling }
          - primary_method: { type: choice, label: Primary contraception, choices: contraception }
          - secondary_method: { type: choice, label: Secondary contraception, choices: contraception }
          - comprehension_ok: { type: boolean, label: Monthly comprehension questions answered }
          - last_test_date: { type: date, label: Last negative test, readonly: true }
          - next_test_due:  { type: date, label: Next test due, readonly: true }
          - suspension_reason: { type: long_text, readonly: true }
        validation:
          rules:
            - { when: agreement_signed is_true, require: [agreement_file], message: Upload the signed patient-prescriber agreement. }
            - { when: category == frp, require: [counseled_on, primary_method, secondary_method], message: "Record counseling and two forms of contraception for a female of reproductive potential." }
            - { when: category == frp, require_expr: primary_method != secondary_method, message: The two contraception methods must differ. }
          duplicate_check:
            scope: { where: "status not_in [discontinued]" }
            rules:
              - { match: [patient_name, year_of_birth], compare: fuzzy, threshold: 0.9, on_match: warn, message: A patient with a similar name and year of birth is already enrolled. }
        access:
          Prescriber:        { actions: [view, add, edit, detail], rows: { own: prescriber } }
          Call Center Agent: { actions: [view, add, edit, detail] }
          REMS Coordinator:  { actions: [view, edit, export, detail] }
          Pharmacy:          { actions: [view], rows: { text: Only patients named on the pharmacy's own authorization requests. } }
        workflow:
          statuses:
            - { code: pending_review, label: Pending Review, color: amber, initial: true }
            - { code: enrolled,       label: Enrolled,       color: green }
            - { code: suspended,      label: Suspended,      color: red }
            - { code: discontinued,   label: Discontinued,   color: gray, final: true }
          transitions:
            - name: enroll
              label: Confirm Enrollment
              from: pending_review
              to: enrolled
              roles: [REMS Coordinator]
              primary: true
              condition:
                all:
                  - agreement_signed is_true
                  - prescriber.status == certified
                  - text: A female of reproductive potential has a negative screening and confirmation test, the latest within 7 days.
              condition_msg: The agreement, prescriber certification and pregnancy tests must all be in place.
              on_done: Email the prescriber the patient's REMS ID and post the welcome kit and medication guide to the patient.
            - { name: suspend, label: Suspend, from: enrolled, to: suspended, roles: [REMS Coordinator, Prescriber], tone: danger,
                form: [ { suspension_reason: { type: long_text, required: true } } ],
                on_done: Save suspension_reason and deny any open authorization requests for this patient. }
            - { name: reinstate, label: Reinstate, from: suspended, to: enrolled, roles: [REMS Coordinator],
                condition: { text: For a female of reproductive potential a new negative test is on file within 7 days. } }
            - { name: transfer, label: Transfer Prescriber, from: [enrolled, suspended], to: enrolled, roles: [REMS Coordinator, Call Center Agent],
                form: [ { prescriber: { type: link, to: prescriber, required: true, limit_choices: status == certified } } ],
                on_done: Move the patient to the new prescriber and email both prescribers. }
            - { name: discontinue, label: Discontinue, from: [pending_review, enrolled, suspended], to: discontinued, roles: [Prescriber, REMS Coordinator], tone: danger,
                form: [ { discontinue_reason: { type: long_text, required: true } } ],
                on_done: For a female of reproductive potential remind the prescriber to record the end-of-therapy pregnancy test within 30 days. }
          tags:
            - { code: test_due, label: Test Due, color: amber, system: true, text: Set when next_test_due is within 3 days or past. }
            - { code: pregnancy_reported, label: Pregnancy Reported, color: red, system: true, text: Set when a positive pregnancy test is recorded. }
        form:
          create:
            roles: [Prescriber, Call Center Agent]
            title: Enroll Patient
            sections:
              - { title: Patient, fields: [patient_name, year_of_birth, category, enrollment_channel] }
              - { title: Agreement, fields: [prescriber, agreement_signed, agreement_file] }
              - title: Contraception
                fields:
                  - counseled_on:     { show_when: category == frp }
                  - primary_method:   { show_when: category == frp }
                  - secondary_method: { show_when: category == frp }
            on_create: Generate the REMS ID and queue the enrollment for coordinator review.
            after_create: patient_360
          edit:
            same_as: create
            roles: [Prescriber, Call Center Agent, REMS Coordinator]
            readonly_when:
              - { when: status == enrolled, fields: [patient_name, year_of_birth, category, prescriber] }
            editable_in: [pending_review, enrolled]
        table:
          columns:
            - rems_id:       { label: REMS ID, searchable: true, sortable: true, link_to: patient_360 }
            - patient_name:  { label: Patient, searchable: true }
            - category:      { label: Category, filterable: true }
            - prescriber:    { label: Prescriber, display: full_name, filterable: true }
            - last_test_date: { label: Last negative test, sortable: true }
            - next_test_due: { label: Next test due, sortable: true }
            - status:        { source: status, label: Status, filterable: true }
            - tags:          { source: tags, label: Flags }
          default_sort: -created_at
          quick_filters:
            - { label: Pending review, where: status == pending_review, roles: [REMS Coordinator], default: true }
            - { label: Test due, where: has_tag test_due }
            - { label: Reproductive potential, where: category == frp }
          row_click: patient_360
          add_button: Enroll Patient

      - code: pregnancy_test
        name: Pregnancy Test
        kind: transactional
        display: test_ref
        description: A pregnancy test recorded by the prescriber; required before the first dose and every month for a female of reproductive potential.
        fields:
          - test_ref:    { type: text, label: Test, readonly: true, unique: true, auto: { sequence: "PT-{YY}{000000}" } }
          - patient:     { type: link, to: patient, display: rems_id, required: true, on_delete: protect }
          - purpose:     { type: choice, choices: test_purpose, required: true }
          - test_type:   { type: choice, choices: test_type, required: true }
          - sample_date: { type: date, required: true }
          - result:      { type: choice, choices: test_result, required: true }
          - lab_facility: { type: text, label: CLIA-certified lab }
          - report_file: { type: file, label: Lab report, accept: [pdf, jpg] }
        access:
          Prescriber:        { actions: [view, add], rows: { own: patient.prescriber } }
          Call Center Agent: { actions: [view, add] }
          REMS Coordinator:  { actions: [view, export] }
        validation:
          rules:
            - { when: sample_date is_set, require_expr: sample_date <= today, message: The sample date cannot be in the future. }
            - { when: test_type == urine_hcg, require: [lab_facility], message: "Name the CLIA-certified lab or clinic that ran the urine test." }
        form:
          create:
            roles: [Prescriber, Call Center Agent]
            title: Record Pregnancy Test
            fields: [patient, purpose, test_type, sample_date, result, lab_facility, report_file]
            on_create: "On a negative result update the patient's last_test_date and set next_test_due 30 days later. On a positive result suspend the patient, tag Pregnancy Reported, open a critical non-compliance finding, and alert the REMS Coordinator and pharmacovigilance within one hour."
        table:
          columns:
            - test_ref:    { label: Test, searchable: true }
            - patient:     { label: Patient, display: rems_id, link_to: patient_360, searchable: true }
            - purpose:     { label: Purpose, filterable: true }
            - test_type:   { label: Type, filterable: true }
            - sample_date: { label: Sample date, sortable: true }
            - result:      { label: Result, filterable: true }
            - lab_facility: { label: Lab }
          default_sort: -sample_date
          quick_filters:
            - { label: Positive or indeterminate, where: "result in [positive, indeterminate]", roles: [REMS Coordinator] }
          add_button: Record Test

  - code: dispensing
    name: Dispensing
    description: Dispense authorizations before every fill and the non-compliance they surface.
    entities:
      - code: dispense_authorization
        name: Dispense Authorization
        kind: transactional
        display: auth_no
        fields:
          - auth_no:      { type: text, label: Authorization, readonly: true, unique: true, auto: { sequence: "RDA-{YY}{000000}" } }
          - patient:      { type: link, to: patient, display: rems_id, required: true }
          - prescriber:   { type: link, to: prescriber, display: full_name, required: true }
          - pharmacy:     { type: link, to: pharmacy, display: legal_name, required: true, limit_choices: status == certified }
          - channel:      { type: choice, choices: request_channel, required: true, default: portal }
          - rx_number:    { type: text, label: Rx number, required: true }
          - rx_date:      { type: date, label: Rx written, required: true }
          - strength_mg:  { type: integer, label: Strength (mg), required: true, min: 10, max: 40 }
          - days_supply:  { type: integer, required: true, min: 1, max: 30 }
          - authorized_on: { type: date, readonly: true }
          - expires_on:   { type: date, label: Dispense by, readonly: true }
          - denial_reason: { type: choice, choices: denial_reason, readonly: true }
          - dispensed_on: { type: date, readonly: true }
          - lot_number:   { type: text, label: Lot, readonly: true }
        validation:
          rules:
            - { when: rx_date is_set, require_expr: rx_date <= today, message: The prescription date cannot be in the future. }
            - { text: "For a female of reproductive potential the prescription was written within 7 days of the latest negative test.", message: The prescription is outside the 7-day window after the test. }
        access:
          Pharmacy:          { actions: [view, add], rows: { own: pharmacy } }
          Prescriber:        { actions: [view], rows: { own: prescriber } }
          Call Center Agent: { actions: [view, add] }
          REMS Coordinator:  { actions: [view, edit, export] }
        workflow:
          statuses:
            - { code: requested,  label: Requested,  color: amber, initial: true }
            - { code: referred,   label: Referred to Coordinator, color: purple }
            - { code: authorized, label: Authorized, color: green }
            - { code: denied,     label: Denied,     color: red, final: true }
            - { code: dispensed,  label: Dispensed,  color: blue, final: true }
            - { code: expired,    label: Expired,    color: gray, final: true }
          transitions:
            - { name: auto_authorize, label: Auto-authorize, from: requested, to: authorized, trigger: system,
                text: "At once when the prescriber, pharmacy and patient are in good standing, the comprehension questions are answered, and (for a female of reproductive potential) the latest negative test is under 7 days old. Set authorized_on to today and expires_on to 7 days later." }
            - { name: refer, label: Refer to Coordinator, from: requested, to: referred, trigger: system,
                text: "When a check cannot be decided automatically, such as a test result received by fax and not yet keyed in." }
            - name: authorize
              label: Authorize
              from: referred
              to: authorized
              roles: [REMS Coordinator]
              primary: true
              condition:
                all:
                  - prescriber.status == certified
                  - pharmacy.status == certified
                  - patient.status == enrolled
                  - text: For a female of reproductive potential the latest negative pregnancy test is no more than 7 days old.
              condition_msg: The safe-use checks failed; deny the request with a reason.
              on_done: Set authorized_on to today and expires_on to 7 days later; send the authorization number to the pharmacy by portal or switch response.
            - { name: deny, label: Deny, from: [requested, referred], to: denied, roles: [REMS Coordinator], tone: danger,
                form: [ { denial_reason: { type: choice, choices: denial_reason, required: true } } ],
                on_done: Save denial_reason and email the pharmacy and the prescriber what must be fixed before a new request. }
            - name: dispense
              label: Record Dispense
              from: authorized
              to: dispensed
              roles: [Pharmacy]
              primary: true
              form:
                - dispensed_on: { type: date, required: true, default: today }
                - lot_number:   { type: text, required: true }
                - counseled:    { type: boolean, label: Patient counseled and medication guide given, required: true }
              condition: { text: The dispense date is on or before expires_on. }
              condition_msg: This authorization has expired; request a new one.
              on_done: Save dispensed_on and lot_number; if the dispense is after expires_on open a major non-compliance finding against the pharmacy.
            - { name: expire, label: Expire, from: authorized, to: expired, trigger: system, text: Nightly when expires_on has passed without a dispense. }
            - { name: withdraw, label: Withdraw Request, from: [requested, referred], to: denied, roles: [Pharmacy], confirm: Withdraw this authorization request? }
          tags:
            - { code: early_refill, label: Early Refill, color: amber, system: true, text: Set when requested more than 7 days before the previous fill's days supply runs out. }
        form:
          create:
            roles: [Pharmacy, Call Center Agent]
            title: Request Authorization
            sections:
              - { title: Patient and prescriber, fields: [patient, prescriber, pharmacy, channel] }
              - { title: Prescription, fields: [rx_number, rx_date, strength_mg, days_supply] }
            on_create: Run the safe-use checks at once and show authorized, referred or denied with the reason on screen.
        table:
          columns:
            - auth_no:      { label: Authorization, searchable: true, sortable: true }
            - patient:      { label: Patient, display: rems_id, link_to: patient_360, searchable: true }
            - pharmacy:     { label: Pharmacy, display: legal_name, filterable: true }
            - prescriber:   { label: Prescriber, display: full_name, filterable: true }
            - channel:      { label: Channel, filterable: true }
            - days_supply:  { label: Days supply }
            - expires_on:   { label: Dispense by, sortable: true }
            - denial_reason: { label: Denial reason, filterable: true, roles: [REMS Coordinator, Call Center Agent] }
            - status:       { source: status, label: Status, filterable: true }
          default_sort: -created_at
          quick_filters:
            - { label: Referred to me, where: status == referred, roles: [REMS Coordinator], default: true }
            - { label: Ready to dispense, where: status == authorized, roles: [Pharmacy], default: true }
            - { label: Denied, where: status == denied }
          add_button: Request Authorization
          row_actions:
            - { key: auth_slip, label: Print Authorization, type: download, roles: [Pharmacy], show_when: status == authorized,
                text: "A slip with the authorization number, patient REMS ID, days supply and dispense-by date for the prescription file." }

      - code: noncompliance_event
        name: Non-compliance Finding
        kind: transactional
        display: finding_ref
        description: A deviation from the REMS found by the coordinator, a system check or an audit.
        fields:
          - finding_ref:  { type: text, label: Finding, readonly: true, unique: true, auto: { sequence: "NC-{YY}{0000}" } }
          - nc_type:      { type: choice, label: Type, choices: nc_type, required: true }
          - party:        { type: choice, label: Against, choices: nc_party, required: true }
          - prescriber:   { type: link, to: prescriber, display: full_name }
          - pharmacy:     { type: link, to: pharmacy, display: legal_name }
          - patient:      { type: link, to: patient, display: rems_id }
          - authorization: { type: link, to: dispense_authorization, display: auth_no }
          - detected_on:  { type: date, required: true, default: today }
          - severity:     { type: choice, choices: severity, required: true }
          - description:  { type: long_text, required: true }
          - response:     { type: long_text, label: Stakeholder response, readonly: true }
          - corrective_action: { type: long_text, label: Corrective action, readonly: true }
          - response_due: { type: date, label: Response due }
        validation:
          rules:
            - { when: party == prescriber, require: [prescriber], message: Name the prescriber. }
            - { when: party == pharmacy, require: [pharmacy], message: Name the pharmacy. }
            - { when: nc_type == pregnancy_reported, require_expr: severity == critical, message: A reported pregnancy is always critical. }
        access:
          REMS Coordinator: { actions: [view, add, edit, export] }
          Prescriber:       { actions: [view], rows: { own: prescriber } }
          Pharmacy:         { actions: [view], rows: { own: pharmacy } }
        workflow:
          statuses:
            - { code: open,               label: Open,               color: red, initial: true }
            - { code: awaiting_response,  label: Awaiting Response,  color: amber }
            - { code: under_review,       label: Under Review,       color: blue }
            - { code: capa,               label: Corrective Action,  color: purple }
            - { code: closed,             label: Closed,             color: green, final: true }
          transitions:
            - { name: request_response, label: Request Response, from: open, to: awaiting_response, roles: [REMS Coordinator], primary: true,
                form: [ { response_due: { type: date, required: true } } ],
                on_done: Email the prescriber or pharmacy the finding and a response link due by response_due. }
            - { name: respond, label: Submit Response, from: awaiting_response, to: under_review, roles: [Prescriber, Pharmacy], primary: true,
                form: [ { response: { type: long_text, required: true } } ], on_done: Save the response and notify the REMS Coordinator. }
            - { name: require_capa, label: Require Corrective Action, from: under_review, to: capa, roles: [REMS Coordinator],
                form: [ { corrective_action: { type: long_text, required: true } } ],
                on_done: "Email the corrective action; for a critical finding suspend the prescriber or pharmacy until it is closed." }
            - { name: close, label: Close, from: [open, under_review, capa], to: closed, roles: [REMS Coordinator],
                form: [ { closure_note: { type: long_text, required: true } } ] }
          tags:
            - { code: overdue, label: Response Overdue, color: red, system: true, text: Set when response_due has passed while awaiting response. }
            - { code: reported_to_fda, label: In Assessment Report, color: indigo, enable: { roles: [REMS Coordinator] }, disable: { roles: [REMS Coordinator] } }
        form:
          create:
            roles: [REMS Coordinator]
            title: Log Finding
            sections:
              - { title: Finding, fields: [nc_type, severity, detected_on, description] }
              - { title: Who and what, fields: [party, prescriber, pharmacy, patient, authorization] }
          edit: { same_as: create, roles: [REMS Coordinator], editable_in: [open] }
        table:
          columns:
            - finding_ref: { label: Finding, searchable: true }
            - nc_type:     { label: Type, filterable: true }
            - party:       { label: Against, filterable: true }
            - prescriber:  { label: Prescriber, display: full_name }
            - pharmacy:    { label: Pharmacy, display: legal_name }
            - severity:    { label: Severity, filterable: true }
            - detected_on: { label: Detected, sortable: true }
            - status:      { source: status, label: Status, filterable: true }
            - tags:        { source: tags, label: Flags }
          default_sort: -detected_on
          quick_filters:
            - { label: Open, where: "status not_in [closed]", default: true }
            - { label: Critical, where: severity == critical, roles: [REMS Coordinator] }
          add_button: Log Finding

detail_views:
  - code: patient_360
    hero: patient
    title: "{rems_id}"
    back_to: patients
    layout: header_tabs_sidebar
    roles: [Prescriber, Call Center Agent, REMS Coordinator]
    header:
      title: rems_id
      subtitle: ["{patient_name}", "{category}", "{prescriber.full_name}"]
      badges: [ { source: status }, { source: tags } ]
      facts:
        - { label: Year of birth, field: year_of_birth }
        - { label: Last negative test, field: last_test_date }
        - { label: Next test due, field: next_test_due }
      actions:
        transitions: true
        buttons:
          - { key: new_test, label: Record Test, type: create_related, entity: pregnancy_test, prefill: { patient: hero } }
      banners:
        - { show_when: status == suspended, tone: warning, text: "Suspended: {suspension_reason}" }
        - { show_when: has_tag pregnancy_reported, tone: danger, text: A pregnancy has been reported for this patient. Do not authorize any dispense. }
    stats:
      - { label: Tests, value: { count: pregnancy_test, via: patient }, link_to_tab: tests, tone: teal }
      - { label: Authorizations, value: { count: dispense_authorization, via: patient }, link_to_tab: authorizations, tone: blue }
      - { label: Dispensed, value: { count: dispense_authorization, via: patient, where: status == dispensed }, tone: green }
      - { label: Findings, value: { count: noncompliance_event, via: patient, where: "status not_in [closed]" }, link_to_tab: findings, tone: red }
    sidebar:
      - { type: fields, title: Patient, fields: [patient_name, year_of_birth, category, enrollment_channel] }
      - { type: fields, title: Enrollment, fields: [prescriber, agreement_signed, agreement_file] }
      - { type: fields, title: Contraception, fields: [counseled_on, primary_method, secondary_method, comprehension_ok], show_when: category == frp }
    tabs:
      - { code: tests, label: Pregnancy Tests, type: related_table, entity: pregnancy_test, via: patient, columns: inherit, count_badge: true,
          add: { label: Record Test, prefill: { patient: hero } } }
      - { code: authorizations, label: Dispense Authorizations, type: related_table, entity: dispense_authorization, via: patient, columns: inherit, count_badge: true, add: false }
      - { code: findings, label: Findings, type: related_table, entity: noncompliance_event, via: patient, columns: inherit, add: false, roles: [REMS Coordinator] }
      - code: activity
        label: Activity
        type: timeline
        sources:
          - { entity: patient, events: [created, updated, transition, tag] }
          - { entity: pregnancy_test, via: patient, events: [created] }
          - { entity: dispense_authorization, via: patient, events: [created, transition] }
    states:
      not_found: { title: Patient not found, back_to: patients }

  - code: prescriber_360
    hero: prescriber
    title: "{full_name}"
    back_to: prescribers
    layout: header_tabs_sidebar
    roles: [Prescriber, Call Center Agent, REMS Coordinator]
    header:
      avatar: { fallback_initials: full_name }
      title: full_name
      subtitle: ["{credential}", "{specialty}", "NPI {npi}"]
      badges: [ { source: status }, { source: tags } ]
      facts:
        - { label: NPI, field: npi, copyable: true }
        - { label: Certified on, field: certified_on, fallback: "—" }
        - { label: Recertification due, field: recert_due, fallback: "—" }
      actions: { transitions: true }
      banners:
        - { show_when: status == suspended, tone: warning, text: "Suspended: {suspension_reason}" }
    stats:
      - { label: Patients, value: { count: patient, via: prescriber, where: status == enrolled }, link_to_tab: patients, tone: blue }
      - { label: Authorizations, value: { count: dispense_authorization, via: prescriber }, link_to_tab: authorizations, tone: teal }
      - { label: Open findings, value: { count: noncompliance_event, via: prescriber, where: "status not_in [closed]" }, link_to_tab: findings, tone: red }
    sidebar:
      - { type: fields, title: Practice, fields: [practice_clinic, region, email, phone] }
      - { type: fields, title: Certification, fields: [training_completed_on, assessment_score, assessment_attempts, attestation_signed, npi_verified] }
    tabs:
      - { code: patients, label: Patients, type: related_table, entity: patient, via: prescriber, columns: inherit, count_badge: true,
          add: { label: Enroll Patient, prefill: { prescriber: hero }, show_when: status == certified } }
      - { code: authorizations, label: Authorizations, type: related_table, entity: dispense_authorization, via: prescriber, columns: inherit, add: false }
      - { code: findings, label: Findings, type: related_table, entity: noncompliance_event, via: prescriber, columns: inherit, add: false }
      - code: activity
        label: Activity
        type: timeline
        sources:
          - { entity: prescriber, events: [created, updated, transition, tag] }
          - { entity: patient, via: prescriber, events: [created, transition] }
    states:
      not_found: { title: Prescriber not found, back_to: prescribers }

  - code: pharmacy_360
    hero: pharmacy
    title: "{legal_name}"
    back_to: pharmacies
    layout: header_tabs_sidebar
    roles: [Pharmacy, Call Center Agent, REMS Coordinator]
    header:
      avatar: { fallback_initials: legal_name }
      title: legal_name
      subtitle: ["{pharmacy_type}", "{city}", "NCPDP {ncpdp_id}"]
      badges: [ { source: status }, { source: tags } ]
      facts:
        - { label: Authorized rep, field: authorized_rep_name }
        - { label: Certified on, field: certified_on, fallback: "—" }
        - { label: Recertification due, field: recert_due, fallback: "—" }
      actions: { transitions: true, tags: true }
    stats:
      - { label: Trained staff, value: { count: pharmacy_staff, via: pharmacy, where: is_active is_true }, link_to_tab: staff, tone: teal }
      - { label: Authorizations, value: { count: dispense_authorization, via: pharmacy }, link_to_tab: authorizations, tone: blue }
      - { label: Dispensed, value: { count: dispense_authorization, via: pharmacy, where: status == dispensed }, tone: green }
      - { label: Open findings, value: { count: noncompliance_event, via: pharmacy, where: "status not_in [closed]" }, link_to_tab: findings, tone: red }
    sidebar:
      - { type: fields, title: Pharmacy, fields: [ncpdp_id, pharmacy_type, chain_name, city, region] }
      - { type: fields, title: Qualification, fields: [authorized_rep_name, rep_email, staff_trained_on, sop_attested, sop_file] }
    tabs:
      - { code: staff, label: Staff, type: related_table, entity: pharmacy_staff, via: pharmacy, columns: inherit, count_badge: true,
          add: { label: Add Staff Member, prefill: { pharmacy: hero } }, row_click: drawer }
      - { code: authorizations, label: Authorizations, type: related_table, entity: dispense_authorization, via: pharmacy, columns: inherit, add: false }
      - { code: findings, label: Findings, type: related_table, entity: noncompliance_event, via: pharmacy, columns: inherit, add: false }
      - code: activity
        label: Activity
        type: timeline
        sources:
          - { entity: pharmacy, events: [created, updated, transition, tag] }
          - { entity: dispense_authorization, via: pharmacy, events: [transition] }
    states:
      not_found: { title: Pharmacy not found, back_to: pharmacies }
