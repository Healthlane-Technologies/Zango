# Pregnancy Prevention REMS — US: a filled-in REMS Compliance app.
# One teratogenic oral therapy, about 2,400 certified prescribers and 600
# certified pharmacies. Prescribers certify after training and a knowledge
# assessment, enroll each patient with a signed patient-prescriber agreement
# and log monthly pregnancy tests. Pharmacies certify through an authorized
# representative and need a dispense authorization before every fill, issued
# only when prescriber, patient and pharmacy are in good standing and the
# latest negative test is under 7 days old. A call centre takes fax and phone
# enrollments, and the REMS Coordinator works non-compliance and prepares the
# FDA assessment reports.

spec_version: 1

app:
  code: pregnancy_prevention_rems_us
  name: Pregnancy Prevention REMS — US
  description: Prescriber and pharmacy certification, patient enrollment with monthly pregnancy testing, dispense authorization before every fill, and non-compliance tracking for one teratogenic oral therapy in the US.
  timezone: America/New_York
  locale: en-US
  currency: USD
  theme: { primary: "#0F766E", secondary: "#475467" }
  custom_requirements:
    - area: backend
      title: Audit trail
      text: Every create, edit, transition and authorization decision is written to an append-only audit log with user, timestamp, old and new values; the REMS Coordinator can export it as CSV for any date range.
    - area: backend
      title: Electronic signatures
      text: Prescriber and pharmacy attestations, patient enrollment confirmation and every authorization decision ask for the user's password again and record an e-signature with its meaning (attested, enrolled, authorized, denied).
    - area: permission
      title: Patient privacy
      text: Patient name and year of birth are visible only to the enrolling prescriber, the Call Center Agent and the REMS Coordinator; pharmacies see the REMS patient ID and initials only.
    - area: integration
      title: NPI registry check
      text: When a prescriber submits for certification, look up the NPI in the NPPES registry and store the returned name, taxonomy and state; flag a mismatch for the REMS Coordinator.
    - area: integration
      title: Pharmacy switch
      text: Accept dispense authorization requests from the pharmacy switch (NCPDP telecommunication) as well as the portal, run the same safe-use checks, and return the authorization number or a denial code within 5 seconds.
    - area: scheduled
      title: Reminders and lapses
      text: Daily at 07:00 ET email prescribers whose patients have a pregnancy test due in the next 3 days, warn prescribers and pharmacies 60 and 30 days before recertification is due, and lapse anyone past due.
    - area: report
      title: FDA REMS assessment
      text: A report for any period with counts of certified prescribers and pharmacies, enrolled patients by category, authorizations requested, granted and denied by reason, dispenses outside an authorization, pregnancies reported and non-compliance events by type and outcome, exportable as Excel.

