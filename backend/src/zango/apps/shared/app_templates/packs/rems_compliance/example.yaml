roles:
  - name: Prescriber
    description: Certified prescriber who enrolls their own patients, records monthly pregnancy tests and responds to non-compliance findings.
    landing: patients
    menu:
      - { page: patients,       label: My Patients, icon: users }
      - { page: monitoring,     label: Pregnancy Tests, icon: test-tube }
      - { page: authorizations, label: Dispense Authorizations, icon: shield-check }
      - { page: noncompliance,  label: Findings, icon: triangle-alert }
      - { page: prescribers,    label: My Certification, icon: badge-check }
  - name: Pharmacy
    description: Certified pharmacy, represented by its authorized representative, that requests an authorization before every fill and records the dispense.
    landing: authorizations
    menu:
      - { page: authorizations, label: Dispense Authorizations, icon: shield-check }
      - { page: noncompliance,  label: Findings, icon: triangle-alert }
      - { page: pharmacies,     label: My Certification, icon: badge-check }
  - name: Call Center Agent
    description: REMS call centre agent who keys in fax and phone enrollments and answers prescriber and pharmacy queries.
    landing: patients
    menu:
      - { page: patients,    icon: users }
      - { page: prescribers, icon: stethoscope }
      - { page: pharmacies,  icon: store }
      - { page: authorizations, label: Authorization Lookup, icon: shield-check }
  - name: REMS Coordinator
    description: Runs the program; reviews certifications and enrollments, rules on referred authorizations, works non-compliance and prepares assessment reports.
    landing: dashboard
    menu:
      - { page: dashboard,      icon: layout-dashboard }
      - { page: authorizations, label: Dispense Authorizations, icon: shield-check }
      - { page: patients,       icon: users }
      - { page: monitoring,     label: Pregnancy Tests, icon: test-tube }
      - { page: noncompliance,  label: Non-compliance, icon: triangle-alert }
      - group: Certification
        icon: badge-check
        items:
          - { page: prescribers }
          - { page: pharmacies }
          - { page: pharmacy_staff }
      - { page: assessment_report, icon: file-bar-chart }

pages:
  - code: dashboard
    type: custom
    route: /app/dashboard
    title: REMS Dashboard
    component: RemsDashboard
    roles: [REMS Coordinator]
    text: "KPI row: certified prescribers, certified pharmacies, enrolled patients (and how many are females of reproductive potential), authorizations in the last 7 days with the share granted. Below: a queue of certifications and enrollments awaiting review oldest first; a bar chart of denials by reason for the last 30 days; open critical non-compliance findings; and recertifications due in the next 60 days."
    preview: |
      const pres = ctx.rows('prescriber'), phs = ctx.rows('pharmacy'), pts = ctx.rows('patient'), auths = ctx.rows('dispense_authorization'), ncs = ctx.rows('noncompliance_event');
      const now = new Date(), age = d => Math.floor((now - new Date(d)) / 864e5), until = d => d ? Math.round((new Date(d) - now) / 864e5) : null;
      const wk = auths.filter(a => age(a.created_at) <= 7), dec = wk.filter(a => !['requested', 'referred'].includes(a.status)), granted = dec.filter(a => ['authorized', 'dispensed', 'expired'].includes(a.status));
      const queue = [...pres.filter(p => p.status === 'under_review').map(p => ({ kind: 'Prescriber', name: p.full_name, at: p.created_at, go: 'prescriber_360:' + p.id })),
        ...phs.filter(p => p.status === 'under_review').map(p => ({ kind: 'Pharmacy', name: p.legal_name, at: p.created_at, go: 'pharmacy_360:' + p.id })),
        ...pts.filter(p => p.status === 'pending_review').map(p => ({ kind: 'Patient', name: p.rems_id + ' · ' + ctx.fmt(p, 'category'), at: p.created_at, go: 'patient_360:' + p.id }))].sort((a, b) => String(a.at).localeCompare(String(b.at)));
      const reasons = ctx.entity('dispense_authorization').fields.find(f => f.key === 'denial_reason').opts, denied = auths.filter(a => a.status === 'denied');
      const d30 = denied.filter(a => age(a.created_at) <= 30), den = d30.length ? d30 : denied, byR = reasons.map(o => [o.label, den.filter(a => a.denial_reason === o.id).length]).concat([['Reason not recorded', den.filter(a => !a.denial_reason).length]]).filter((x, i, all) => x[1] || i < all.length - 1), top = Math.max(1, ...byR.map(x => x[1]));
      const crit = ncs.filter(n => n.severity === 'critical' && n.status !== 'closed').sort((a, b) => String(a.detected_on).localeCompare(String(b.detected_on)));
      const recert = [...pres.map(p => ({ name: p.full_name, who: 'Prescriber', d: p.recert_due, st: p.status, go: 'prescriber_360:' + p.id })), ...phs.map(p => ({ name: p.legal_name, who: 'Pharmacy', d: p.recert_due, st: p.status, go: 'pharmacy_360:' + p.id }))]
        .filter(x => x.st === 'certified' && until(x.d) !== null && until(x.d) >= 0 && until(x.d) <= 60).sort((a, b) => String(a.d).localeCompare(String(b.d)));
      const panel = (icon, title, n, body) => `<div class="d-panel"><h3>${ctx.icon(icon)}${title}<span class="sp"></span>${n == null ? '' : `<span class="pv-badge">${n}</span>`}</h3>${body}</div>`;
      return `
      <div class="pv-kpis">
        <div class="pv-kpi" data-go="prescribers"><span>Certified prescribers</span><b>${pres.filter(p => p.status === 'certified').length}</b><span>${pres.filter(p => p.status === 'under_review').length} under review</span></div>
        <div class="pv-kpi" data-go="pharmacies"><span>Certified pharmacies</span><b>${phs.filter(p => p.status === 'certified').length}</b><span>${phs.filter(p => p.status === 'under_review').length} under review</span></div>
        <div class="pv-kpi" data-go="patients"><span>Enrolled patients</span><b>${pts.filter(p => p.status === 'enrolled').length}</b><span>${pts.filter(p => p.status === 'enrolled' && p.category === 'frp').length} females of reproductive potential</span></div>
        <div class="pv-kpi" data-go="authorizations"><span>Authorizations, last 7 days</span><b>${wk.length}</b><span>${dec.length ? Math.round(100 * granted.length / dec.length) + '% granted' : 'none decided yet'}</span></div>
      </div>
      <div style="display:grid;grid-template-columns:1.25fr 1fr;gap:12px;align-items:start">
        ${panel('inbox', 'Awaiting review, oldest first', queue.length, `<table class="z-t"><thead><tr><th>Type</th><th>Name</th><th>Submitted</th><th>Waiting</th></tr></thead><tbody>${queue.slice(0, 7).map(q => `
          <tr class="click" data-go="${q.go}"><td>${q.kind}</td><td>${ctx.esc(q.name)}</td><td>${ctx.esc(String(q.at).slice(0, 10))}</td><td style="font-weight:550;color:${age(q.at) > 14 ? '#B42318' : 'inherit'}">${age(q.at)} days</td></tr>`).join('') || '<tr><td colspan="4" class="pv-muted">Nothing awaiting review.</td></tr>'}</tbody></table>`)}
        ${panel('bar-chart-3', d30.length ? 'Denials by reason, last 30 days' : 'Denials by reason', den.length, `<div style="padding:12px 16px;display:flex;flex-direction:column;gap:9px">${byR.map(([l, n]) => `
          <div style="font-size:13px"><div style="display:flex;justify-content:space-between"><span>${ctx.esc(l)}</span><b style="font-weight:600">${n}</b></div><div class="pv-bar" style="margin-top:4px"><i style="width:${100 * n / top}%;background:#F04438"></i></div></div>`).join('')}</div>`)}
        ${panel('siren', 'Open critical non-compliance', crit.length, `<div style="padding:10px 14px;display:flex;flex-direction:column;gap:8px">${crit.slice(0, 5).map(n => `
          <div class="pv-card" data-go="noncompliance"><div style="display:flex;justify-content:space-between"><b style="font-weight:550">${ctx.esc(n.finding_ref)} · ${ctx.esc(ctx.fmt(n, 'nc_type'))}</b><span class="pv-badge" style="background:#FEF3F2;color:#B42318;border-color:#FECDCA">${ctx.esc(ctx.fmt(n, 'status'))}</span></div>
            <span class="pv-muted">${ctx.esc(ctx.fmt(n, 'party'))} · detected ${ctx.esc(n.detected_on)}${n.tags.includes('reported_to_fda') ? ' · reported to FDA' : ''}</span></div>`).join('') || '<span class="pv-muted">No open critical findings.</span>'}</div>`)}
        ${panel('calendar-clock', 'Recertifications due in 60 days', recert.length, `<div style="padding:10px 14px;display:flex;flex-direction:column;gap:8px">${recert.slice(0, 5).map(x => `
          <div class="pv-card" data-go="${x.go}"><div style="display:flex;justify-content:space-between"><b style="font-weight:550">${ctx.esc(x.name)}</b><span style="color:#B54708;font-weight:550;font-size:12px">${until(x.d)} days</span></div><span class="pv-muted">${x.who} · due ${ctx.esc(x.d)}</span></div>`).join('') || '<span class="pv-muted">No recertifications due in the next 60 days.</span>'}</div>`)}
      </div>`;
  - code: assessment_report
    type: custom
    route: /app/reports/assessment
    title: REMS Assessment Report
    component: AssessmentReport
    roles: [REMS Coordinator]
    text: "Pick a reporting period (default the last 6 months). Shows the FDA REMS assessment metrics: stakeholders certified and decertified, patients enrolled by category and channel, authorizations requested, granted and denied by reason, median time to decision, dispenses outside an authorization, pregnancies reported, and non-compliance events by type, severity and outcome. Export as Excel."
    preview: |
      const now = new Date(), from = new Date(now.getFullYear(), now.getMonth() - 6, now.getDate()), inP = d => d && new Date(d) >= from && new Date(d) <= now;
      const pres = ctx.rows('prescriber'), phs = ctx.rows('pharmacy'), pts = ctx.rows('patient').filter(p => inP(p.created_at)), auths = ctx.rows('dispense_authorization').filter(a => inP(a.created_at)), ncs = ctx.rows('noncompliance_event').filter(n => inP(n.detected_on));
      const opts = (e, k) => ctx.entity(e).fields.find(f => f.key === k).opts, cnt = (rs, k, v) => rs.filter(r => r[k] === v).length;
      const granted = auths.filter(a => ['authorized', 'dispensed', 'expired'].includes(a.status)), denied = auths.filter(a => a.status === 'denied');
      const tt = granted.concat(denied).map(a => (new Date(a.authorized_on) - new Date(a.rx_date)) / 864e5).filter(x => x >= 0).sort((a, b) => a - b), median = tt.length ? Math.round(tt[Math.floor(tt.length / 2)]) : null;
      const cats = opts('patient', 'category'), chans = opts('patient', 'enrollment_channel'), reasons = opts('dispense_authorization', 'denial_reason'), types = opts('noncompliance_event', 'nc_type'), sev = opts('noncompliance_event', 'severity');
      const byR = reasons.map(o => [o.label, cnt(denied, 'denial_reason', o.id)]).concat(denied.some(a => !a.denial_reason) ? [['Reason not recorded', denied.filter(a => !a.denial_reason).length]] : []), topR = Math.max(1, ...byR.map(x => x[1]));
      const kpi = (l, v, sub, go) => `<div class="pv-kpi"${go ? ` data-go="${go}"` : ''}><span>${l}</span><b>${v}</b>${sub ? `<span>${sub}</span>` : ''}</div>`;
      const th = 'style="text-align:right"', td = n => `<td style="text-align:right;font-variant-numeric:tabular-nums">${n || '<span class="pv-muted">0</span>'}</td>`;
      return `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><span class="pv-muted">Reporting period</span>${['Last 6 months', 'Last 12 months', 'Custom'].map((l, i) => `<span class="pv-badge" style="${i ? 'background:#fff;color:#344054;border-color:#D0D5DD' : ''}">${l}</span>`).join('')}
        <span class="pv-muted">${from.toISOString().slice(0, 10)} – ${now.toISOString().slice(0, 10)}</span><span style="flex:1"></span><span class="pv-badge" style="background:#fff;color:#344054;border-color:#D0D5DD">${ctx.icon('download')} Export as Excel</span></div>
      <div class="pv-kpis">
        ${kpi('Stakeholders certified', pres.concat(phs).filter(p => inP(p.certified_on) && !['pending_training', 'under_review'].includes(p.status)).length, `${pres.concat(phs).filter(p => p.status === 'decertified').length} decertified`, 'prescribers')}
        ${kpi('Patients enrolled', pts.length, `${cnt(pts, 'category', 'frp')} FRP`, 'patients')}
        ${kpi('Authorizations requested', auths.length, `${granted.length} granted · ${denied.length} denied`, 'authorizations')}
        ${kpi('Median time to decision', median == null ? '—' : median + ' days', 'Rx date to decision')}
        ${kpi('Dispenses outside an authorization', ncs.filter(n => ['dispense_no_auth', 'dispense_expired'].includes(n.nc_type)).length, '', 'noncompliance')}
        ${kpi('Pregnancies reported', ncs.filter(n => n.nc_type === 'pregnancy_reported').length, '', 'noncompliance')}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start">
        <div class="d-panel"><h3>${ctx.icon('users')}Patients enrolled by category and channel</h3><table class="z-t"><thead><tr><th>Category</th>${chans.map(c => `<th ${th}>${ctx.esc(c.label)}</th>`).join('')}<th ${th}>Total</th></tr></thead><tbody>${cats.map(c => { const rs = pts.filter(p => p.category === c.id); return `
          <tr><td>${ctx.esc(c.label)}</td>${chans.map(ch => td(cnt(rs, 'enrollment_channel', ch.id))).join('')}<td style="text-align:right;font-weight:600">${rs.length}</td></tr>`; }).join('')}</tbody></table></div>
        <div class="d-panel"><h3>${ctx.icon('ban')}Denials by reason<span class="sp"></span><span class="pv-badge">${denied.length}</span></h3><div style="padding:12px 16px;display:flex;flex-direction:column;gap:9px">${byR.map(([l, n]) => `
          <div style="font-size:13px"><div style="display:flex;justify-content:space-between"><span>${ctx.esc(l)}</span><b style="font-weight:600">${n}</b></div><div class="pv-bar" style="margin-top:4px"><i style="width:${100 * n / topR}%;background:#F04438"></i></div></div>`).join('')}</div></div>
      </div>
      <div class="d-panel"><h3>${ctx.icon('shield-alert')}Non-compliance events by type, severity and outcome<span class="sp"></span><span class="pv-badge">${ncs.length}</span></h3><table class="z-t"><thead><tr><th>Type</th>${sev.map(s => `<th ${th}>${ctx.esc(s.label)}</th>`).join('')}<th ${th}>Closed</th><th ${th}>Open / CAPA</th><th ${th}>Reported to FDA</th></tr></thead><tbody>${types.map(t => { const rs = ncs.filter(n => n.nc_type === t.id); return `
        <tr class="click" data-go="noncompliance"><td>${ctx.esc(t.label)}</td>${sev.map(s => td(cnt(rs, 'severity', s.id))).join('')}${td(cnt(rs, 'status', 'closed'))}${td(rs.filter(n => n.status !== 'closed').length)}${td(rs.filter(n => n.tags.includes('reported_to_fda')).length)}</tr>`; }).join('')}</tbody></table></div>`;
  - { code: prescribers,       type: crud,   entity: prescriber,              route: /app/prescribers,        title: Prescribers }
  - { code: prescriber_360,    type: detail, detail_view: prescriber_360,     route: /app/prescribers/:id }
  - { code: pharmacies,        type: crud,   entity: pharmacy,                route: /app/pharmacies,         title: Pharmacies }
  - { code: pharmacy_360,      type: detail, detail_view: pharmacy_360,       route: /app/pharmacies/:id }
  - { code: pharmacy_staff,    type: crud,   entity: pharmacy_staff,          route: /app/pharmacy-staff,     title: Pharmacy Staff }
  - { code: patients,          type: crud,   entity: patient,                 route: /app/patients,           title: Patients }
  - { code: patient_360,       type: detail, detail_view: patient_360,        route: /app/patients/:id }
  - { code: monitoring,        type: crud,   entity: pregnancy_test,          route: /app/pregnancy-tests,    title: Pregnancy Tests }
  - { code: authorizations,    type: crud,   entity: dispense_authorization,  route: /app/authorizations,     title: Dispense Authorizations }
  - { code: noncompliance,     type: crud,   entity: noncompliance_event,     route: /app/non-compliance,     title: Non-compliance }

modules:
  - code: certification
    name: Certification
    description: Prescriber certification, pharmacy qualification and trained pharmacy staff.
    entities:
      - code: prescriber
        name: Prescriber
        kind: hero
        display: full_name
        app_user: { role: Prescriber, name: full_name, email: email, create_on: status == certified }
        fields:
          - full_name:       { type: text, label: Prescriber, required: true }
          - credential:      { type: choice, choices: credential, required: true }
          - npi:             { type: text, label: NPI, required: true, unique: true, pattern: "^[0-9]{10}$", pattern_msg: NPI is 10 digits. }
          - dea_number:      { type: text, label: DEA number, pattern: "^[A-Z]{2}[0-9]{7}$", pattern_msg: Two letters and seven digits. }
          - specialty:       { type: choice, choices: specialty, required: true }
          - practice_clinic: { type: text, label: Practice }
          - region:          { type: choice, choices: region, required: true }
          - email:           { type: email, required: true }
          - phone:           { type: phone }
          - enrollment_channel: { type: choice, label: Channel, choices: enrollment_channel, default: portal }
          - training_completed_on: { type: date, label: Training completed }
          - assessment_score: { type: percent, label: Knowledge assessment score }
          - assessment_attempts: { type: integer, label: Assessment attempts, min: 0, max: 5 }
          - attestation_signed: { type: boolean, label: Prescriber agreement signed }
          - attestation_file: { type: file, label: Signed prescriber agreement, accept: [pdf] }
          - npi_verified:    { type: boolean, label: NPI verified in registry, readonly: true }
          - certified_on:    { type: date, readonly: true }
          - recert_due:      { type: date, label: Recertification due, readonly: true }
          - suspension_reason: { type: long_text, readonly: true }
        validation:
          rules:
            - { when: attestation_signed is_true, require: [attestation_file], message: Upload the signed prescriber agreement. }
            - { when: assessment_attempts > 3, require_expr: assessment_score >= 80, message: "After three failed attempts the prescriber must retake the training before another assessment.", on_fail: warn }
        access:
          REMS Coordinator:  { actions: [view, add, edit, export, detail] }
          Call Center Agent: { actions: [view, add, edit, detail] }
          Prescriber:        { actions: [view, edit, detail], rows: { own: id } }
        workflow:
          statuses:
            - { code: pending_training, label: Pending Training, color: gray, initial: true }
            - { code: under_review,     label: Under Review,     color: amber }
            - { code: certified,        label: Certified,        color: green }
            - { code: suspended,        label: Suspended,        color: red }
            - { code: lapsed,           label: Lapsed,           color: purple }
            - { code: decertified,      label: Decertified,      color: gray, final: true }
          transitions:
            - name: submit
              label: Submit for Certification
              from: [pending_training, lapsed]
              to: under_review
              roles: [Prescriber, Call Center Agent]
              primary: true
              condition:
                all:
                  - training_completed_on is_set
                  - assessment_score >= 80
                  - attestation_signed is_true
              condition_msg: Complete the training, pass the knowledge assessment (80% or more) and sign the prescriber agreement first.
              on_done: Look up the NPI in the NPPES registry, set npi_verified, and email the REMS Coordinator that a certification is waiting.
            - name: certify
              label: Certify
              from: under_review
              to: certified
              roles: [REMS Coordinator]
              primary: true
              condition:
                all:
                  - npi_verified is_true
                  - text: The registry name and state match the enrollment form.
              condition_msg: The NPI could not be verified; request information instead.
              on_done: Set certified_on to today and recert_due to two years from today; create the prescriber's login and email the certificate and REMS prescriber ID.
            - { name: request_info, label: Request Information, from: under_review, to: pending_training, roles: [REMS Coordinator],
                form: [ { info_needed: { type: long_text, required: true } } ], on_done: Email the prescriber what is missing and log a call-centre follow-up. }
            - { name: suspend, label: Suspend, from: certified, to: suspended, roles: [REMS Coordinator], tone: danger, confirm: "Suspend this prescriber? New authorizations for their patients will be denied.",
                form: [ { suspension_reason: { type: long_text, required: true } } ],
                on_done: "Save suspension_reason, deny open authorization requests for this prescriber's patients, and email the prescriber the reason and the corrective steps." }
            - { name: reinstate, label: Reinstate, from: suspended, to: certified, roles: [REMS Coordinator],
                condition: { text: Every critical non-compliance finding against this prescriber is closed. } }
            - { name: lapse, label: Lapse, from: certified, to: lapsed, trigger: system,
                text: Nightly when recert_due has passed without recertification. }
            - { name: decertify, label: Decertify, from: [certified, suspended, lapsed], to: decertified, roles: [REMS Coordinator], tone: danger,
                form: [ { decert_reason: { type: long_text, required: true } } ],
                on_done: Disable the login and ask the prescriber to transfer each enrolled patient to another certified prescriber. }
          tags:
            - { code: recert_due_soon, label: Recertification Due, color: amber, system: true, text: Set when recert_due is within 60 days. }
            - { code: npi_mismatch, label: NPI Mismatch, color: red, system: true, text: Set when the registry name or state differs from the form. }
        form:
          create:
            roles: [Call Center Agent, REMS Coordinator]
            title: Enroll Prescriber
            sections:
              - { title: Prescriber, fields: [full_name, credential, npi, dea_number, specialty, practice_clinic, region, email, phone, enrollment_channel] }
              - { title: Certification, fields: [training_completed_on, assessment_score, assessment_attempts, attestation_signed, attestation_file] }
            after_create: prescriber_360
          edit:
            same_as: create
            roles: [Prescriber, Call Center Agent, REMS Coordinator]
            editable_in: [pending_training, lapsed]
        table:
          columns:
            - full_name:  { label: Prescriber, searchable: true, sortable: true, link_to: prescriber_360 }
            - credential: { label: Credential }
            - npi:        { label: NPI, searchable: true }
            - specialty:  { label: Specialty, filterable: true }
            - region:     { label: Region, filterable: true }
            - patients:   { source: computed, label: Patients, shows: Count of enrolled patients for this prescriber. }
            - recert_due: { label: Recert due, sortable: true }
            - status:     { source: status, label: Status, filterable: true }
            - tags:       { source: tags, label: Flags }
          default_sort: full_name
          quick_filters:
            - { label: Awaiting review, where: status == under_review, roles: [REMS Coordinator], default: true }
            - { label: Certified, where: status == certified }
            - { label: Recert due, where: has_tag recert_due_soon, roles: [REMS Coordinator, Call Center Agent] }
          row_click: prescriber_360
          add_button: Enroll Prescriber
          row_actions:
            - { key: certificate, label: Download Certificate, type: download, show_when: status == certified,
                text: "A one-page PDF certificate with the prescriber's name, NPI, REMS prescriber ID, certification date and expiry." }
            - { key: resend_training, label: Resend Training Link, type: confirm, roles: [Call Center Agent, REMS Coordinator], show_when: status == pending_training,
                confirm: Email the training and assessment link again?, on_done: Email the prescriber a fresh training link valid for 30 days. }

      - code: pharmacy
        name: Pharmacy
        plural: Pharmacies
        kind: hero
        display: legal_name
        app_user: { role: Pharmacy, name: authorized_rep_name, email: rep_email, create_on: status == certified }
        fields:
          - legal_name:     { type: text, label: Pharmacy, required: true }
          - ncpdp_id:       { type: text, label: NCPDP ID, required: true, unique: true, pattern: "^[0-9]{7}$", pattern_msg: NCPDP ID is 7 digits. }
          - pharmacy_type:  { type: choice, label: Type, choices: pharmacy_type, required: true }
          - chain_name:     { type: text, label: Chain or parent company }
          - city:           { type: text, required: true }
          - region:         { type: choice, choices: region, required: true }
          - authorized_rep_name: { type: text, label: Authorized representative, required: true }
          - rep_email:      { type: email, label: Representative email, required: true }
          - rep_phone:      { type: phone, label: Representative phone }
          - staff_trained_on: { type: date, label: Staff training completed }
          - sop_attested:   { type: boolean, label: Dispensing SOP attested, help: The pharmacy obtains a dispense authorization before every fill and dispenses no more than a 30-day supply. }
          - sop_file:       { type: file, label: Signed pharmacy attestation, accept: [pdf] }
          - certified_on:   { type: date, readonly: true }
          - recert_due:     { type: date, label: Recertification due, readonly: true }
        validation:
          rules:
            - { when: sop_attested is_true, require: [sop_file], message: Upload the signed pharmacy attestation. }
            - { text: At least one pharmacist on the staff list has completed REMS training., message: Add a trained pharmacist before submitting. }
        access:
          REMS Coordinator:  { actions: [view, add, edit, export, detail] }
          Call Center Agent: { actions: [view, add, edit, detail] }
          Pharmacy:          { actions: [view, edit, detail], rows: { own: id } }
        workflow:
          statuses:
            - { code: pending_training, label: Pending Training, color: gray, initial: true }
            - { code: under_review,     label: Under Review,     color: amber }
            - { code: certified,        label: Certified,        color: green }
            - { code: suspended,        label: Suspended,        color: red }
            - { code: lapsed,           label: Lapsed,           color: purple }
            - { code: decertified,      label: Decertified,      color: gray, final: true }
          transitions:
            - { name: submit, label: Submit for Certification, from: [pending_training, lapsed], to: under_review, roles: [Pharmacy, Call Center Agent], primary: true,
                condition: { all: [staff_trained_on is_set, sop_attested is_true, { text: At least one trained pharmacist is on the staff list. }] },
                condition_msg: Record staff training and attest to the dispensing SOP first.,
                on_done: Email the REMS Coordinator that a pharmacy is waiting for review. }
            - { name: certify, label: Certify, from: under_review, to: certified, roles: [REMS Coordinator], primary: true,
                on_done: "Set certified_on to today and recert_due to two years from today; create the representative's login, enable the NCPDP ID on the pharmacy switch and email the certificate." }
            - { name: request_info, label: Request Information, from: under_review, to: pending_training, roles: [REMS Coordinator],
                form: [ { info_needed: { type: long_text, required: true } } ], on_done: Email the authorized representative what is missing. }
            - { name: suspend, label: Suspend, from: certified, to: suspended, roles: [REMS Coordinator], tone: danger,
                form: [ { suspension_reason: { type: long_text, required: true } } ],
                on_done: Disable the NCPDP ID on the pharmacy switch so new requests are denied and email the representative the reason. }
            - { name: reinstate, label: Reinstate, from: suspended, to: certified, roles: [REMS Coordinator],
                condition: { text: Every critical non-compliance finding against this pharmacy is closed. } }
            - { name: lapse, label: Lapse, from: certified, to: lapsed, trigger: system, text: Nightly when recert_due has passed without recertification. }
            - { name: decertify, label: Decertify, from: [certified, suspended, lapsed], to: decertified, roles: [REMS Coordinator], tone: danger,
                form: [ { decert_reason: { type: long_text, required: true } } ] }
          tags:
            - { code: recert_due_soon, label: Recertification Due, color: amber, system: true, text: Set when recert_due is within 60 days. }
            - code: audit_selected
              label: Selected for Audit
              color: indigo
              enable:  { roles: [REMS Coordinator], condition: status == certified }
              disable: { roles: [REMS Coordinator] }
        form:
          create:
            roles: [Call Center Agent, REMS Coordinator]
            title: Enroll Pharmacy
            sections:
              - { title: Pharmacy, fields: [legal_name, ncpdp_id, pharmacy_type, chain_name, city, region] }
              - { title: Authorized representative, fields: [authorized_rep_name, rep_email, rep_phone] }
              - { title: Qualification, fields: [staff_trained_on, sop_attested, sop_file] }
            after_create: pharmacy_360
          edit:
            same_as: create
            roles: [Pharmacy, Call Center Agent, REMS Coordinator]
            editable_in: [pending_training, lapsed]
        table:
          columns:
            - legal_name:     { label: Pharmacy, searchable: true, sortable: true, link_to: pharmacy_360 }
            - ncpdp_id:       { label: NCPDP ID, searchable: true }
            - pharmacy_type:  { label: Type, filterable: true }
            - city:           { label: City }
            - region:         { label: Region, filterable: true }
            - authorized_rep_name: { label: Authorized rep }
            - recert_due:     { label: Recert due, sortable: true }
            - status:         { source: status, label: Status, filterable: true }
            - tags:           { source: tags, label: Flags }
          default_sort: legal_name
          quick_filters:
            - { label: Awaiting review, where: status == under_review, roles: [REMS Coordinator], default: true }
            - { label: Selected for audit, where: has_tag audit_selected, roles: [REMS Coordinator] }
          row_click: pharmacy_360
          add_button: Enroll Pharmacy

      - code: pharmacy_staff
        name: Pharmacy Staff Member
        plural: Pharmacy Staff
        kind: child
        parent: { entity: pharmacy, field: pharmacy }
        display: staff_name
        fields:
          - pharmacy:      { type: link, to: pharmacy, display: legal_name, required: true, on_delete: cascade }
          - staff_name:    { type: text, label: Name, required: true }
          - staff_role:    { type: choice, label: Role, choices: staff_role, required: true }
          - license_no:    { type: text, label: License number }
          - trained_on:    { type: date, label: REMS training completed }
          - is_active:     { type: boolean, label: Active, default: true }
