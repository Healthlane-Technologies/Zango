# Oncology Trials — India: clinical trial management for a sponsor's oncology
# portfolio of three Phase II/III studies running at 38 sites across India.
# CRAs monitor every site every six weeks and submit visit reports within five
# working days; issues and protocol deviations go to the site for a response,
# major ones need study manager sign-off and critical ones also the medical
# monitor's. Enrollment comes nightly from the EDC and approved reports and
# closed issues are filed to the eTMF. A filled-in instance of the Clinical
# Trial Management template.
spec_version: 1

# -----------------------------------------------------------------------------
#  APP
# -----------------------------------------------------------------------------
app:
  code: oncology_trials_india
  name: Oncology Trials — India
  description: Run three oncology studies at 38 Indian sites — start-up milestones, site activation with regulatory documents, enrollment from EDC, six-weekly monitoring visits with reports, and deviation tracking through sign-off.
  timezone: Asia/Kolkata
  locale: en-IN
  currency: INR
  theme: { primary: "#1D4ED8", secondary: "#475569" }
  custom_requirements:
    - area: integration
      title: EDC connector
      text: >
        Nightly at 02:00, call the EDC reporting API for each study and pull, per site, the
        counts of subjects screened, screen-failed, randomised and discontinued as of the
        previous day. Write one enrollment snapshot per site per week (week ending Sunday)
        and update the site's randomised and screen_failures fields. Log and email the
        study manager any site number the EDC returns that is not in the app.
    - area: integration
      title: eTMF export
      text: >
        When a visit report is approved, file its PDF to the eTMF under zone 05 (Site
        Management), artifact 05.04.04 Monitoring Visit Report, with the study, site and
        visit date as metadata. When an issue is closed, file the issue record with its
        responses as a PDF under 05.04.05 (Note to File). When a site document is verified,
        file it under the matching TMF artifact. Store the returned eTMF document id.
    - area: backend
      title: Audit trail
      text: >
        Keep a 21 CFR Part 11 / ICH E6(R3) style audit trail of every create, edit, upload
        and status change — who, when, old value, new value and reason where a form asked
        for one. Audit rows can be exported but never edited or deleted.
    - area: scheduled
      title: Visit cadence
      text: >
        Every Monday, for each Active site, check that a monitoring visit is scheduled
        within 42 days of the last completed visit (28 days for sites tagged High Risk);
        if not, email the site's CRA and tag the site Visit Due.
    - area: permission
      title: Sign-in
      text: Sponsor staff sign in with company SSO; site users sign in with email and OTP.

# -----------------------------------------------------------------------------
#  CHOICE SETS
# -----------------------------------------------------------------------------
choice_sets:
  phase:
    - { id: phase_2,  label: Phase II }
    - { id: phase_3,  label: Phase III }
  indication:
    - { id: nsclc,  label: Non-small cell lung cancer }
    - { id: her2_bc, label: HER2+ breast cancer }
    - { id: hnscc,  label: Head and neck SCC }
    - { id: mcrpc,  label: Metastatic prostate cancer }
  region:
    - { id: north, label: North }
    - { id: south, label: South }
    - { id: east,  label: East }
    - { id: west,  label: West }
  visit_type:
    - { id: psv, label: Pre-study visit,       color: gray }
    - { id: siv, label: Site initiation visit, color: blue }
    - { id: imv, label: Interim monitoring,    color: indigo }
    - { id: cov, label: Close-out visit,       color: purple }
    - { id: for_cause, label: For-cause visit, color: red }
  visit_mode:
    - { id: onsite, label: On-site }
    - { id: remote, label: Remote }
  issue_category:
    - { id: protocol_deviation, label: Protocol deviation }
    - { id: informed_consent,   label: Informed consent }
    - { id: eligibility,        label: Eligibility }
    - { id: sdv_discrepancy,    label: SDV discrepancy }
    - { id: ip_accountability,  label: IP accountability }
    - { id: safety_reporting,   label: SAE reporting }
    - { id: regulatory_docs,    label: Regulatory documents }
  severity:
    - { id: minor,    label: Minor,    color: gray }
    - { id: major,    label: Major,    color: amber }
    - { id: critical, label: Critical, color: red }
  site_doc_type:
    - { id: ec_approval,   label: Ethics committee approval }
    - { id: cta,           label: Signed clinical trial agreement }
    - { id: pi_cv,         label: PI CV }
    - { id: gcp_cert,      label: GCP certificate }
    - { id: lab_normals,   label: Lab normal ranges }
    - { id: delegation_log, label: Delegation log }
    - { id: ctri_reg,      label: CTRI registration }

# -----------------------------------------------------------------------------
#  ROLES
# -----------------------------------------------------------------------------
roles:
  - name: Study Manager
    description: Owns one or more studies; plans milestones, selects and activates sites, approves visit reports and signs off major and critical issues.
    landing: dashboard
    menu:
      - { page: dashboard,  icon: layout-dashboard }
      - { page: studies,    icon: flask-conical }
      - { page: sites,      icon: hospital }
      - { page: visits,     label: Monitoring Visits, icon: calendar-check }
      - { page: issues,     label: Issues & Deviations, icon: triangle-alert }
      - group: Planning
        icon: flag
        items:
          - { page: milestones }
          - { page: enrollment, label: Enrollment Log }

  - name: CRA
    description: Monitors 4–6 assigned sites; schedules and logs visits, writes visit reports, collects site documents and raises and verifies issues.
    landing: visits
    menu:
      - { page: visits,     label: My Visits, icon: calendar-check }
      - { page: sites,      label: My Sites,  icon: hospital }
      - { page: issues,     label: Issues & Deviations, icon: triangle-alert }
      - { page: site_docs,  label: Site Documents, icon: folder-open }

  - name: Medical Monitor
    description: Reviews critical deviations and SAE-reporting issues and gives the second sign-off on critical issues.
    landing: issues
    menu:
      - { page: issues,  label: Deviations for Review, icon: stethoscope }
      - { page: studies, icon: flask-conical }
      - { page: sites,   icon: hospital }

  - name: Site
    description: External login for the site's study coordinator; sees only its own site, visits, issues and documents, responds to action items and uploads documents.
    landing: issues
    menu:
      - { page: issues,    label: Action Items, icon: triangle-alert }
      - { page: visits,    label: Monitoring Visits, icon: calendar-check }
      - { page: site_docs, label: Our Documents, icon: folder-open }
      - { page: sites,     label: Our Site, icon: hospital }

# -----------------------------------------------------------------------------
#  PAGES
# -----------------------------------------------------------------------------
pages:
  - { code: studies,    type: crud,   entity: study,               route: /app/studies,          title: Studies }
  - { code: study_360,  type: detail, detail_view: study_360,      route: /app/studies/:id }
  - { code: milestones, type: crud,   entity: milestone,           route: /app/milestones,       title: Milestones }
  - { code: sites,      type: crud,   entity: site,                route: /app/sites,            title: Sites }
  - { code: site_360,   type: detail, detail_view: site_360,       route: /app/sites/:id }
  - { code: site_docs,  type: crud,   entity: site_document,       route: /app/site-documents,   title: Site Documents }
  - { code: enrollment, type: crud,   entity: enrollment_snapshot, route: /app/enrollment,       title: Enrollment Log }
  - { code: visits,     type: crud,   entity: monitoring_visit,    route: /app/visits,           title: Monitoring Visits }
  - { code: issues,     type: crud,   entity: issue,               route: /app/issues,           title: Issues & Deviations }
  - code: dashboard
    type: custom
    route: /app/dashboard
    title: Oncology Portfolio
    component: OncologyPortfolioDashboard
    roles: [Study Manager]
    text: >
      Filter by study (default: all three). KPI row: sites active / planned (38), subjects
      randomised against target with % of target, screen-failure rate, open deviations
      (critical count in red), visit reports overdue. Row two: cumulative randomisation by
      week per study against the planned curve (line, last 26 weeks); sites by status per
      study (stacked bar). Row three: milestones due in the next 60 days with At Risk ones
      first; the ten sites with the most open major or critical issues, with their CRA;
      sites with no completed visit in the last 42 days.

# -----------------------------------------------------------------------------
#  MODULES
# -----------------------------------------------------------------------------
modules:
  # ---------------------------------------------------------------- studies --
  - code: studies
    name: Studies
    description: The three oncology studies, their enrollment targets and start-up milestone plan.
    entities:
      - code: study
        name: Study
        plural: Studies
        kind: hero
        display: protocol_no
        fields:
          - protocol_no:       { type: text, label: Protocol no., required: true, unique: true, pattern: "^ONC-[0-9]{3}$", pattern_msg: "Use the ONC-nnn protocol code, e.g. ONC-301." }
          - title:             { type: text, label: Study title, required: true, max_length: 300 }
          - phase:             { type: choice, choices: phase, required: true }
          - indication:        { type: choice, choices: indication, required: true }
          - ctri_no:           { type: text, label: CTRI no., pattern: "^CTRI/20[0-9]{2}/[0-9]{2}/0[0-9]{5}$", pattern_msg: "Format CTRI/YYYY/MM/0NNNNN." }
          - study_manager:     { type: link, to: app_user, label: Study manager }
          - planned_sites:     { type: integer, label: Planned sites, min: 8, max: 16 }
          - target_enrollment: { type: integer, label: Target subjects, required: true, min: 120, max: 420 }
          - randomised:        { type: integer, label: Randomised, readonly: true, min: 20, max: 260, computed: Sum of randomised across the study's sites from the latest EDC snapshot. }
          - screen_fail_rate:  { type: integer, label: Screen-fail %, readonly: true, min: 12, max: 38, computed: Screen failures divided by subjects screened across all sites. }
          - fpi_date:          { type: date, label: First patient in, readonly: true }
          - lpi_planned:       { type: date, label: Last patient in (planned) }
          - hold_reason:       { type: long_text, label: Hold reason, readonly: true }
        validation:
          rules:
            - { when: lpi_planned is_set, require_expr: lpi_planned > today, message: The planned last-patient-in date must be in the future. }
        access:
          Study Manager:   { actions: [view, add, edit, export, detail] }
          CRA:             { actions: [view, detail] }
          Medical Monitor: { actions: [view, detail] }
        workflow:
          statuses:
            - { code: planning,   label: Planning,   color: gray, initial: true }
            - { code: start_up,   label: Start-up,   color: blue }
            - { code: enrolling,  label: Enrolling,  color: green }
            - { code: follow_up,  label: Follow-up,  color: teal }
            - { code: close_out,  label: Close-out,  color: purple }
            - { code: on_hold,    label: On Hold,    color: amber }
            - { code: closed,     label: Closed,     color: indigo, final: true }
          transitions:
            - name: start_up
              label: Start Site Start-up
              from: planning
              to: start_up
              roles: [Study Manager]
              primary: true
              condition: { text: "The Protocol final and DCGI approval milestones are achieved and ctri_no is set." }
              condition_msg: Achieve Protocol final and DCGI approval and enter the CTRI number first.
              on_done: Email every CRA assigned to a site of the study that start-up has begun, with the site document checklist.
            - name: open_enrollment
              label: Open Enrollment
              from: start_up
              to: enrolling
              roles: [Study Manager]
              primary: true
              condition: { text: At least one site of the study is Active. }
              condition_msg: Activate at least one site first.
              on_done: Email all Active sites and their CRAs that screening may begin; set fpi_date when the EDC reports the first randomisation.
            - { name: close_enrollment, label: Close Enrollment, from: enrolling, to: follow_up, roles: [Study Manager],
                confirm: "Close enrollment at every site of this study? Sites can no longer screen.",
                on_done: Move every Active site of the study to Enrollment Closed and email the sites. }
            - { name: begin_close_out, label: Begin Close-out, from: follow_up, to: close_out, roles: [Study Manager],
                on_done: Ask each CRA to schedule a close-out visit for every site. }
            - { name: hold, label: Put on Hold, from: [start_up, enrolling, follow_up], to: on_hold, roles: [Study Manager], tone: danger,
                form: [ { hold_reason: { type: long_text, required: true } } ],
                on_done: "Email every CRA, Site user and the Medical Monitor of the study the reason; pause screening at all sites." }
            - { name: resume, label: Resume, from: on_hold, to: enrolling, roles: [Study Manager] }
            - { name: close, label: Close Study, from: close_out, to: closed, roles: [Study Manager],
                condition: { text: "Every site is Closed, every issue is Closed and Database lock is achieved." },
                condition_msg: Close all sites and issues and achieve Database lock first. }
        form:
          create:
            title: New Study
            sections:
              - { title: Protocol, fields: [protocol_no, title, phase, indication, ctri_no] }
              - { title: Plan, fields: [study_manager, planned_sites, target_enrollment, lpi_planned] }
            after_create: study_360
          edit:
            same_as: create
            readonly_when:
              - { when: "status in [enrolling, follow_up, close_out]", fields: [protocol_no, phase] }
            editable_in: [planning, start_up, enrolling, follow_up, on_hold]
        table:
          columns:
            - protocol_no:       { label: Protocol, searchable: true, sortable: true, link_to: study_360 }
            - phase:             { label: Phase, filterable: true }
            - indication:        { label: Indication, filterable: true }
            - planned_sites:     { label: Sites }
            - target_enrollment: { label: Target }
            - randomised:        { label: Randomised, sortable: true }
            - screen_fail_rate:  { label: Screen-fail % }
            - status:            { source: status, label: Status, filterable: true }
          default_sort: protocol_no
          quick_filters:
            - { label: Active, where: "status in [start_up, enrolling, follow_up]", default: true }
          row_click: study_360
          add_button: New Study

      - code: milestone
        name: Milestone
        plural: Milestones
        kind: child
        parent: { entity: study, field: study }
        display: milestone_name
        fields:
          - study:          { type: link, to: study, required: true, display: protocol_no, on_delete: cascade }
          - milestone_name: { type: choice, label: Milestone, required: true, choices: [ {id: protocol_final, label: Protocol final}, {id: dcgi_approval, label: DCGI approval}, {id: first_ec_approval, label: First EC approval}, {id: first_site_active, label: First site active}, {id: fpi, label: First patient in}, {id: half_enrolled, label: 50% randomised}, {id: lpi, label: Last patient in}, {id: db_lock, label: Database lock}, {id: csr_final, label: CSR final} ] }
          - planned_date:   { type: date, label: Planned, required: true }
          - forecast_date:  { type: date, label: Forecast }
          - actual_date:    { type: date, label: Actual, readonly: true }
          - owner:          { type: link, to: app_user }
          - risk_note:      { type: long_text, label: Risk note, readonly: true }
        validation:
          duplicate_check:
            rules:
              - { match: [study, milestone_name], compare: exact, on_match: block, message: This milestone already exists for the study. }
        access:
          Study Manager:   { actions: [view, add, edit, export] }
          CRA:             { actions: [view] }
          Medical Monitor: { actions: [view] }
        workflow:
          statuses:
            - { code: planned,  label: Planned,  color: gray, initial: true }
            - { code: at_risk,  label: At Risk,  color: amber }
            - { code: achieved, label: Achieved, color: green, final: true }
            - { code: missed,   label: Missed,   color: red }
          transitions:
            - { name: flag_risk, label: Flag At Risk, from: planned, to: at_risk, roles: [Study Manager],
                form: [ { risk_note: { type: long_text, required: true } } ],
                on_done: Email the milestone owner and the head of clinical operations the risk note. }
            - { name: auto_risk, label: At Risk, from: planned, to: at_risk, trigger: system, text: Nightly when forecast_date is more than 14 days after planned_date. }
            - { name: achieve, label: Mark Achieved, from: [planned, at_risk, missed], to: achieved, roles: [Study Manager], primary: true,
                form: [ { actual_date: { type: date, required: true } } ] }
            - { name: miss, label: Missed, from: [planned, at_risk], to: missed, trigger: system, text: Nightly when planned_date < today and actual_date is empty. }
        table:
          columns:
            - study:          { label: Study, display: protocol_no, filterable: true }
            - milestone_name: { label: Milestone, filterable: true }
            - planned_date:   { label: Planned, sortable: true }
            - forecast_date:  { label: Forecast }
            - actual_date:    { label: Actual }
            - owner:          { label: Owner }
            - status:         { source: status, label: Status, filterable: true }
          default_sort: planned_date
          quick_filters:
            - { label: At risk or missed, where: "status in [at_risk, missed]", default: true }
          add_button: Add Milestone
        form:
          create: { fields: [study, milestone_name, planned_date, forecast_date, owner] }
          edit:   { fields: [planned_date, forecast_date, owner], editable_in: [planned, at_risk, missed] }

  # ------------------------------------------------------------------ sites --
  - code: sites
    name: Site Management
    description: Sites per study, their CRA, regulatory documents, activation and weekly enrollment from EDC.
    entities:
      - code: site
        name: Site
        plural: Sites
        kind: hero
        display: institution
        app_user: { role: Site, name: coordinator_name, email: coordinator_email, mobile: coordinator_mobile, create_on: "status in [active, enr_closed, on_hold]" }
        fields:
          - site_no:            { type: text, label: Site no., required: true, pattern: "^[1-9][0-9]{2}$", pattern_msg: Three digits. }
          - institution:        { type: text, label: Institution, required: true, max_length: 200 }
          - study:              { type: link, to: study, required: true, display: protocol_no }
          - city:               { type: text, required: true }
          - region:             { type: choice, choices: region, required: true }
          - pi_name:            { type: text, label: Principal investigator, required: true }
          - ec_reg_no:          { type: text, label: EC registration no., pattern: "^ECR/[0-9]{3,4}/Inst/[A-Z]{2}/20[0-9]{2}$", pattern_msg: "The CDSCO ethics committee registration, e.g. ECR/1234/Inst/MH/2019." }
          - coordinator_name:   { type: text, label: Study coordinator, required: true }
          - coordinator_email:  { type: email, label: Coordinator email, required: true }
          - coordinator_mobile: { type: phone, label: Coordinator mobile, pattern: "^[6-9][0-9]{9}$", pattern_msg: 10-digit mobile without +91. }
          - cra:                { type: link, to: app_user, label: CRA }
          - target_enrollment:  { type: integer, label: Target, min: 12, max: 30 }
          - randomised:         { type: integer, label: Randomised, readonly: true, min: 0, max: 16, computed: Randomised at this site from the latest EDC snapshot. }
          - screen_failures:    { type: integer, label: Screen failures, readonly: true, min: 0, max: 7 }
          - activated_on:       { type: date, label: Activated on, readonly: true }
          - last_visit_on:      { type: date, label: Last monitoring visit, readonly: true, computed: Visit date of the latest completed monitoring visit. }
          - hold_reason:        { type: long_text, label: Hold reason, readonly: true }
        validation:
          duplicate_check:
            rules:
              - { match: [study, site_no], compare: exact, on_match: block, message: This site number is already used in the study. }
              - { match: [study, institution], compare: fuzzy, threshold: 0.9, on_match: warn, message: This institution may already be a site in the study. }
        access:
          Study Manager:   { actions: [view, add, edit, export, detail] }
          CRA:             { actions: [view, edit, detail], rows: { text: Sites whose cra is the current user. } }
          Medical Monitor: { actions: [view, detail] }
          Site:            { actions: [view, detail], rows: { own: id } }
        workflow:
          statuses:
            - { code: selected,   label: Selected,          color: gray, initial: true }
            - { code: activating, label: Activating,        color: blue }
            - { code: active,     label: Active,            color: green }
            - { code: enr_closed, label: Enrollment Closed, color: teal }
            - { code: on_hold,    label: On Hold,           color: amber }
            - { code: closed,     label: Closed,            color: indigo, final: true }
          transitions:
            - { name: start_activation, label: Start Activation, from: selected, to: activating, roles: [Study Manager], primary: true,
                on_done: "Email the CRA to collect the EC approval, signed CTA, PI CV, GCP certificates and lab normals, and to schedule the SIV." }
            - name: activate
              label: Activate Site
              from: activating
              to: active
              roles: [Study Manager]
              primary: true
              condition:
                all:
                  - text: "Verified site documents include EC approval, signed CTA, PI CV, GCP certificate and lab normal ranges."
                  - text: The site initiation visit report is Approved.
              condition_msg: Verify the five activation documents and approve the SIV report first.
              on_done: "Set activated_on = today, create the Site login for the coordinator, email the green-light letter to the PI and coordinator, and release the first IP shipment request."
            - { name: hold, label: Put on Hold, from: active, to: on_hold, roles: [Study Manager], tone: danger,
                form: [ { hold_reason: { type: long_text, required: true } } ],
                on_done: Pause screening at the site and email the PI and coordinator the reason. }
            - { name: release, label: Release Hold, from: on_hold, to: active, roles: [Study Manager] }
            - { name: close_enrollment, label: Close Enrollment, from: active, to: enr_closed, roles: [Study Manager] }
            - { name: close, label: Close Site, from: [enr_closed, on_hold], to: closed, roles: [Study Manager],
                condition: { text: The close-out visit report is Approved and no issue of the site is open. },
                condition_msg: Approve the close-out visit report and close all issues first.,
                on_done: Disable the Site login and file the site close-out letter in the eTMF. }
          tags:
            - { code: high_risk, label: High Risk, color: red, enable: { roles: [Study Manager, CRA] }, disable: { roles: [Study Manager] } }
            - { code: low_enroller, label: Low Enroller, color: amber, system: true, text: Set on the 1st of each month when randomised is below half the pro-rata target for the months since activation. }
            - { code: visit_due, label: Visit Due, color: purple, system: true, text: Set by the Monday visit-cadence check; cleared when a visit is scheduled. }
        form:
          create:
            title: Add Site
            sections:
              - { title: Site, fields: [study, site_no, institution, city, region, ec_reg_no] }
              - { title: People, fields: [pi_name, coordinator_name, coordinator_email, coordinator_mobile, cra] }
              - { title: Enrollment, fields: [target_enrollment] }
            after_create: site_360
          edit:
            same_as: create
            roles: [Study Manager, CRA]
            readonly_when:
              - { when: "status in [active, enr_closed, closed]", fields: [study, site_no] }
              - { when: current_user.role == "CRA", fields: [cra, target_enrollment] }
        table:
          columns:
            - site_no:           { label: Site, searchable: true, sortable: true }
            - institution:       { label: Institution, searchable: true, link_to: site_360 }
            - study:             { label: Study, display: protocol_no, filterable: true }
            - region:            { label: Region, filterable: true }
            - pi_name:           { label: PI, searchable: true }
            - randomised:        { label: Randomised, sortable: true }
            - target_enrollment: { label: Target }
            - last_visit_on:     { label: Last visit, sortable: true }
            - status:            { source: status, label: Status, filterable: true }
            - tags:              { source: tags, label: Flags }
          default_sort: site_no
          quick_filters:
            - { label: Activating, where: status == activating, roles: [Study Manager] }
            - { label: High risk, where: has_tag high_risk }
            - { label: Visit due, where: has_tag visit_due, roles: [CRA, Study Manager] }
          row_click: site_360
          add_button: Add Site

      - code: site_document
        name: Site Document
        plural: Site Documents
        kind: child
        parent: { entity: site, field: site }
        display: doc_type
        fields:
          - site:        { type: link, to: site, required: true, display: institution, on_delete: cascade }
          - doc_type:    { type: choice, label: Document, choices: site_doc_type, required: true }
          - file:        { type: file, required: true, accept: [pdf], max_size_mb: 20 }
          - version:     { type: text, placeholder: "v2.0" }
          - valid_until: { type: date, label: Valid until, help: For EC approvals and GCP certificates. }
          - etmf_id:     { type: text, label: eTMF id, readonly: true }
        access:
          CRA:           { actions: [view, add], rows: { text: Documents of sites whose cra is the current user. } }
          Study Manager: { actions: [view, export] }
          Site:          { actions: [view, add], rows: { own: site } }
        workflow:
          statuses:
            - { code: uploaded, label: Uploaded, color: blue, initial: true }
            - { code: verified, label: Verified, color: green }
            - { code: rejected, label: Rejected, color: red }
            - { code: expired,  label: Expired,  color: gray, final: true }
          transitions:
            - { name: verify, label: Verify, from: uploaded, to: verified, roles: [CRA], primary: true,
                on_done: File the document in the eTMF and store the returned id in etmf_id. }
            - { name: reject, label: Reject, from: uploaded, to: rejected, roles: [CRA],
                form: [ { reject_reason: { type: text, required: true } } ],
                on_done: Email the site coordinator the reason and a re-upload link. }
            - { name: expire, label: Expire, from: verified, to: expired, trigger: system,
                text: Nightly when valid_until < today; email the CRA and the coordinator 30 days before. }
        table:
          columns:
            - site:        { label: Site, display: institution, searchable: true, filterable: true }
            - doc_type:    { label: Document, filterable: true }
            - version:     { label: Version }
            - valid_until: { label: Valid until, sortable: true }
            - status:      { source: status, label: Status, filterable: true }
          default_sort: site
          quick_filters:
            - { label: To verify, where: status == uploaded, roles: [CRA], default: true }
            - { label: Rejected, where: status == rejected, roles: [Site] }
          add_button: Upload Document
        form:
          create: { fields: [site, doc_type, file, version, valid_until] }

      - code: enrollment_snapshot
        name: Enrollment Snapshot
        plural: Enrollment Snapshots
        kind: child
        parent: { entity: site, field: site }
        display: week_ending
        fields:
          - site:          { type: link, to: site, required: true, display: institution, on_delete: cascade }
          - week_ending:   { type: date, label: Week ending, required: true }
          - screened:      { type: integer, required: true, min: 8, max: 26 }
          - screen_failed: { type: integer, label: Screen failed, required: true, min: 1, max: 8 }
          - randomised:    { type: integer, required: true, min: 4, max: 16 }
          - discontinued:  { type: integer, min: 0, max: 3 }
        access:
          Study Manager: { actions: [view, export] }
          CRA:           { actions: [view, export], rows: { text: Snapshots of sites whose cra is the current user. } }
          Site:          { actions: [view], rows: { own: site } }
        table:
          columns:
            - site:          { label: Site, display: institution, searchable: true, filterable: true }
            - study:         { source: computed, label: Study, path: site.study.protocol_no }
            - week_ending:   { label: Week ending, sortable: true }
            - screened:      { label: Screened }
            - screen_failed: { label: Screen failed }
            - randomised:    { label: Randomised, sortable: true }
            - discontinued:  { label: Discontinued }
          default_sort: -week_ending
          footer_totals: [screened, screen_failed, randomised]
        custom_requirements:
          - area: integration
            title: Written by the EDC sync
            text: Snapshots are created only by the nightly EDC connector; no one adds or edits them in the app.

  # ------------------------------------------------------------- monitoring --
  - code: monitoring
    name: Monitoring Visits
    description: Six-weekly visit planning, visit logging, visit reports and their review.
    entities:
      - code: monitoring_visit
        name: Monitoring Visit
        plural: Monitoring Visits
        kind: transactional
        display: visit_ref
        fields:
          - visit_ref:       { type: text, label: Visit, readonly: true, unique: true, auto: { sequence: "MV-{YY}-{0000}" } }
          - site:            { type: link, to: site, required: true, display: institution }
          - visit_type:      { type: choice, label: Type, choices: visit_type, required: true, default: imv }
          - mode:            { type: choice, choices: visit_mode, required: true, default: onsite }
          - planned_date:    { type: date, label: Planned, required: true }
          - visit_date:      { type: date, label: Visit date }
          - cra:             { type: link, to: app_user, label: CRA }
          - subjects_sdv:    { type: integer, label: Subjects SDV'd, min: 0, max: 10 }
          - pages_sdv:       { type: integer, label: CRF pages SDV'd, min: 0, max: 240 }
          - findings:        { type: integer, label: Findings, readonly: true, min: 0, max: 5, computed: Count of issues raised from this visit. }
          - report:          { type: file, label: Visit report, accept: [pdf, docx], max_size_mb: 20 }
          - report_due:      { type: date, label: Report due, readonly: true, computed: visit_date + 5 working days. }
          - review_comments: { type: long_text, label: Review comments, readonly: true }
        validation:
          rules:
            - { when: visit_date is_set, require_expr: visit_date <= today, message: The visit date cannot be in the future. }
          duplicate_check:
            scope: { where: "status not_in [cancelled]" }
            rules:
              - { match: [site, planned_date], compare: exact, on_match: warn, message: A visit is already planned at this site on this date. }
        access:
          CRA:             { actions: [view, add, edit, export], rows: { text: Visits of sites whose cra is the current user. } }
          Study Manager:   { actions: [view, add, export] }
          Medical Monitor: { actions: [view] }
          Site:            { actions: [view], rows: { own: site } }
        workflow:
          statuses:
            - { code: scheduled,  label: Scheduled,        color: blue, initial: true }
            - { code: confirmed,  label: Confirmed by Site, color: teal }
            - { code: completed,  label: Visit Done,       color: indigo }
            - { code: submitted,  label: Report Submitted, color: amber }
            - { code: returned,   label: Report Returned,  color: red }
            - { code: approved,   label: Report Approved,  color: green, final: true }
            - { code: cancelled,  label: Cancelled,        color: gray, final: true }
          transitions:
            - { name: confirm, label: Confirm Visit, from: scheduled, to: confirmed, roles: [Site], primary: true,
                on_done: "Email the CRA that the site confirmed, with the coordinator's note on PI availability." }
            - { name: complete, label: Log Visit, from: [scheduled, confirmed], to: completed, roles: [CRA], primary: true,
                form: [ { visit_date: { type: date, required: true } }, { subjects_sdv: { type: integer, required: true } }, { pages_sdv: { type: integer } } ],
                on_done: "Set the site's last_visit_on, clear the Visit Due tag, and start the 5-working-day report clock." }
            - { name: submit_report, label: Submit Report, from: [completed, returned], to: submitted, roles: [CRA], primary: true,
                form: [ { report: { type: file, required: true, accept: [pdf, docx] } } ],
                on_done: Notify the study's Study Manager that a visit report is waiting for review. }
            - { name: return, label: Return Report, from: submitted, to: returned, roles: [Study Manager],
                form: [ { review_comments: { type: long_text, required: true } } ],
                on_done: Email the CRA the review comments; the report clock restarts at 2 working days. }
            - name: approve
              label: Approve Report
              from: submitted
              to: approved
              roles: [Study Manager]
              primary: true
              condition: { text: The approver is not the CRA who wrote the report. }
              condition_msg: A different person must approve the report.
              on_done: "Email the follow-up letter (open action items with due dates) to the PI and coordinator, and file the report in the eTMF."
            - { name: cancel, label: Cancel Visit, from: [scheduled, confirmed], to: cancelled, roles: [CRA, Study Manager], tone: danger,
                form: [ { cancel_reason: { type: text, required: true } } ],
                on_done: Email the site the cancellation and ask the CRA to reschedule within 14 days. }
          tags:
            - { code: report_overdue, label: Report Overdue, color: red, system: true, text: Set nightly when report_due < today and the report is not submitted; email the CRA and Study Manager. }
        table:
          columns:
            - visit_ref:    { label: Visit, searchable: true, sortable: true }
            - site:         { label: Site, display: institution, searchable: true, filterable: true }
            - study:        { source: computed, label: Study, path: site.study.protocol_no }
            - visit_type:   { label: Type, filterable: true }
            - mode:         { label: Mode, filterable: true }
            - planned_date: { label: Planned, sortable: true }
            - visit_date:   { label: Visited, sortable: true }
            - cra:          { label: CRA, roles: [Study Manager] }
            - findings:     { label: Findings }
            - status:       { source: status, label: Status, filterable: true }
            - tags:         { source: tags, label: Flags }
          default_sort: -planned_date
          quick_filters:
            - { label: Upcoming, where: "status in [scheduled, confirmed]", roles: [CRA, Site], default: true }
            - { label: Reports to review, where: status == submitted, roles: [Study Manager], default: true }
            - { label: Report overdue, where: has_tag report_overdue }
          add_button: Schedule Visit
          row_actions:
            - { key: edit, label: Edit, type: edit, show_when: "status in [scheduled, confirmed]" }
            - { key: report_pdf, label: Download Report, type: download, show_when: "status in [submitted, approved]", text: The uploaded visit report. }
            - { key: follow_up_letter, label: Download Follow-up Letter, type: download, show_when: status == approved, text: "The follow-up letter PDF: visit summary, findings and open action items." }
        form:
          create: { roles: [CRA, Study Manager], title: Schedule Monitoring Visit, fields: [site, visit_type, mode, planned_date, cra], on_create: Email the site coordinator the proposed date and ask them to confirm. }
          edit:   { fields: [visit_type, mode, planned_date], editable_in: [scheduled, confirmed] }

  # ----------------------------------------------------------------- issues --
  - code: issues
    name: Issue Tracking
    description: Issues and protocol deviations raised at visits or by the medical monitor, site responses and the sign-off matrix.
    entities:
      - code: issue
        name: Issue
        plural: Issues
        kind: transactional
        display: issue_ref
        fields:
          - issue_ref:       { type: text, label: Issue, readonly: true, unique: true, auto: { sequence: "DEV-{YY}-{00000}" } }
          - site:            { type: link, to: site, required: true, display: institution }
          - visit:           { type: link, to: monitoring_visit, display: visit_ref, limit_choices: site == form.site }
          - category:        { type: choice, choices: issue_category, required: true }
          - severity:        { type: choice, choices: severity, required: true, default: minor }
          - subject_id:      { type: text, label: Subject ID, pattern: "^[1-9][0-9]{2}-[0-9]{3}$", pattern_msg: "Site number, a hyphen and the subject number, e.g. 104-012." }
          - occurred_on:     { type: date, label: Occurred on }
          - description:     { type: long_text, required: true }
          - action_required: { type: long_text, label: Action required, required: true }
          - due_date:        { type: date, label: Due, required: true }
          - capa:            { type: long_text, label: CAPA, help: Corrective and preventive action agreed with the site. }
          - site_response:   { type: long_text, label: Site response, readonly: true }
          - resolved_on:     { type: date, label: Resolved on, readonly: true }
        validation:
          rules:
            - { when: "severity in [major, critical]", require: [capa], message: Major and critical issues need a CAPA. }
            - { when: category == informed_consent, require: [subject_id], message: Informed consent issues must name the subject. }
            - { when: occurred_on is_set, require_expr: occurred_on <= today, message: The occurrence date cannot be in the future. }
        access:
          CRA:             { actions: [view, add, edit, export], rows: { text: Issues of sites whose cra is the current user. } }
          Study Manager:   { actions: [view, add, export] }
          Medical Monitor: { actions: [view, add, export], rows: { where: "severity == critical" } }
          Site:            { actions: [view], rows: { own: site } }
        workflow:
          statuses:
            - { code: open,            label: Open,             color: red, initial: true }
            - { code: site_action,     label: With Site,        color: amber }
            - { code: responded,       label: Site Responded,   color: blue }
            - { code: pending_signoff, label: Pending Sign-off, color: purple }
            - { code: pending_mm,      label: Medical Review,   color: pink }
            - { code: closed,          label: Closed,           color: green, final: true }
          transitions:
            - { name: send_to_site, label: Send to Site, from: open, to: site_action, roles: [CRA, Study Manager], primary: true,
                on_done: Email the site coordinator and PI the action required and the due date. }
            - { name: respond, label: Respond, from: site_action, to: responded, roles: [Site], primary: true,
                form: [ { site_response: { type: long_text, required: true } }, { evidence: { type: file } } ],
                on_done: Notify the CRA that the site has responded. }
            - { name: reopen, label: Not Resolved, from: responded, to: site_action, roles: [CRA],
                form: [ { cra_comment: { type: long_text, required: true } } ],
                on_done: Email the site why the response does not resolve the issue. }
            - { name: verify_minor, label: Verify & Close, from: responded, to: closed, roles: [CRA], primary: true,
                condition: severity == minor,
                condition_msg: Major and critical issues need sign-off.,
                on_done: Set resolved_on = today and file the issue record in the eTMF. }
            - { name: verify, label: Verify Resolution, from: responded, to: pending_signoff, roles: [CRA], primary: true,
                condition: "severity in [major, critical]",
                on_done: Notify the study's Study Manager that a major or critical issue awaits sign-off. }
            - name: sign_off
              label: Sign Off
              from: pending_signoff
              to: closed
              roles: [Study Manager]
              primary: true
              condition: severity == major
              condition_msg: Critical issues go to the Medical Monitor after your review.
              form:
                - signoff_note: { type: long_text }
              on_done: Set resolved_on = today and file the issue record in the eTMF.
            - { name: to_medical, label: Send to Medical Monitor, from: pending_signoff, to: pending_mm, roles: [Study Manager], primary: true,
                condition: severity == critical,
                on_done: Notify the Medical Monitor that a critical deviation awaits the second sign-off. }
            - { name: mm_sign_off, label: Medical Sign-off, from: pending_mm, to: closed, roles: [Medical Monitor], primary: true,
                form: [ { mm_assessment: { type: long_text, required: true, label: Impact on subject safety and data integrity } } ],
                on_done: "Set resolved_on = today, file the record in the eTMF, and if tagged Reportable to EC email the PI to notify the ethics committee within 15 days." }
            - { name: send_back, label: Send Back, from: [pending_signoff, pending_mm], to: site_action, roles: [Study Manager, Medical Monitor],
                form: [ { reason: { type: long_text, required: true } } ],
                on_done: Email the site and the CRA the reason. }
          tags:
            - { code: overdue, label: Overdue, color: red, system: true, text: Set nightly when due_date < today and the issue is not closed; email the CRA. }
            - { code: reportable, label: Reportable to EC, color: purple, enable: { roles: [Study Manager, Medical Monitor] }, disable: { roles: [Study Manager, Medical Monitor] } }
            - { code: important_pd, label: Important PD, color: pink, enable: { roles: [Medical Monitor] }, disable: { roles: [Medical Monitor] } }
        table:
          columns:
            - issue_ref:  { label: Issue, searchable: true, sortable: true }
            - site:       { label: Site, display: institution, searchable: true, filterable: true }
            - study:      { source: computed, label: Study, path: site.study.protocol_no }
            - category:   { label: Category, filterable: true }
            - severity:   { label: Severity, filterable: true }
            - subject_id: { label: Subject }
            - due_date:   { label: Due, sortable: true }
            - status:     { source: status, label: Status, filterable: true }
            - tags:       { source: tags, label: Flags }
          default_sort: due_date
          quick_filters:
            - { label: Awaiting our response, where: status == site_action, roles: [Site], default: true }
            - { label: To verify, where: status == responded, roles: [CRA], default: true }
            - { label: Pending sign-off, where: status == pending_signoff, roles: [Study Manager], default: true }
            - { label: Medical review, where: status == pending_mm, roles: [Medical Monitor] }
            - { label: Major and critical, where: "severity in [major, critical]" }
            - { label: Overdue, where: has_tag overdue }
          add_button: Raise Issue
          row_actions:
            - { key: edit, label: Edit, type: edit, show_when: status == open }
        form:
          create:
            roles: [CRA, Study Manager, Medical Monitor]
            title: Raise Issue or Deviation
            sections:
              - { title: Where, fields: [site, visit, subject_id, occurred_on] }
              - title: Issue
                fields:
                  - category
                  - severity
                  - description
                  - action_required
                  - due_date
                  - capa: { show_when: "severity in [major, critical]" }
          edit: { fields: [category, severity, description, action_required, due_date, capa], editable_in: [open, site_action] }

# -----------------------------------------------------------------------------
#  360 PAGES
# -----------------------------------------------------------------------------
detail_views:
  - code: study_360
    hero: study
    title: "{protocol_no}"
    back_to: studies
    layout: header_tabs_sidebar
    roles: [Study Manager, CRA, Medical Monitor]
    header:
      avatar: { fallback_initials: protocol_no }
      title: protocol_no
      subtitle: ["{phase}", "{indication}", "{ctri_no}"]
      badges: [ { source: status } ]
      facts:
        - { label: Target subjects, field: target_enrollment }
        - { label: Randomised, field: randomised }
        - { label: Screen-fail rate, field: screen_fail_rate }
        - { label: First patient in, field: fpi_date }
        - { label: LPI planned, field: lpi_planned }
      actions: { transitions: true, buttons: [ { key: edit, label: Edit, type: edit, roles: [Study Manager] } ] }
      banners:
        - { show_when: status == on_hold, tone: warning, text: "On hold: {hold_reason}" }
    stats:
      - { label: Active sites, value: { count: site, via: study, where: status == active }, tone: green, link_to_tab: sites }
      - { label: Open deviations, value: { count: issue, via: site.study, where: "status not_in [closed]" }, tone: red, link_to_tab: issues }
      - { label: Reports to review, value: { count: monitoring_visit, via: site.study, where: status == submitted }, tone: amber, link_to_tab: visits }
      - { label: Milestones at risk, value: { count: milestone, via: study, where: "status in [at_risk, missed]" }, tone: purple, link_to_tab: milestones }
    sidebar:
      - { type: fields, title: Protocol, fields: [title, phase, indication, ctri_no, study_manager] }
      - { type: fields, title: Plan, fields: [planned_sites, target_enrollment, lpi_planned] }
      - { type: custom, title: Enrollment curve, text: "Cumulative randomised by week against the planned curve, from the enrollment snapshots of all sites.", roles: [Study Manager] }
    tabs:
      - { code: milestones, label: Milestones, type: related_table, entity: milestone, via: study, count_badge: true,
          columns: [milestone_name, planned_date, forecast_date, actual_date, owner, status],
          add: { label: Add Milestone, prefill: { study: hero } } }
      - { code: sites, label: Sites, type: related_table, entity: site, via: study, count_badge: true,
          columns: [site_no, institution, region, pi_name, randomised, target_enrollment, status] }
      - { code: visits, label: Visits, type: related_table, entity: monitoring_visit, via: site.study,
          columns: [visit_ref, site, visit_type, planned_date, visit_date, findings, status] }
      - { code: issues, label: Deviations, type: related_table, entity: issue, via: site.study, count_badge: { where: "status not_in [closed]", tone: red },
          columns: [issue_ref, site, category, severity, due_date, status] }
      - code: activity
        label: Activity
        type: timeline
        sources:
          - { entity: study, events: [created, updated, transition] }
          - { entity: milestone, via: study, events: [transition] }
          - { entity: site, via: study, events: [transition] }
    states:
      not_found: { title: Study not found, back_to: studies }

  - code: site_360
    hero: site
    title: "{institution}"
    back_to: sites
    layout: header_tabs_sidebar
    roles: [Study Manager, CRA, Medical Monitor, Site]
    header:
      avatar: { fallback_initials: institution }
      title: institution
      subtitle: ["Site {site_no}", "{study.protocol_no}", "{city}"]
      badges: [ { source: status }, { source: tags }, { field: region } ]
      facts:
        - { label: PI, field: pi_name }
        - { label: Coordinator, field: coordinator_name }
        - { label: Randomised, field: randomised }
        - { label: Target, field: target_enrollment }
        - { label: Last visit, field: last_visit_on }
      actions:
        transitions: true
        tags: true
        buttons:
          - { key: schedule_visit, label: Schedule Visit, type: create_related, entity: monitoring_visit, prefill: { site: hero }, roles: [CRA, Study Manager] }
          - { key: raise_issue, label: Raise Issue, type: create_related, entity: issue, prefill: { site: hero }, roles: [CRA, Study Manager, Medical Monitor] }
          - { key: edit, label: Edit, type: edit, roles: [Study Manager, CRA] }
      banners:
        - { show_when: has_tag high_risk, tone: danger, text: This site is flagged high risk; monitor every 4 weeks. }
        - { show_when: has_tag visit_due, tone: warning, text: No monitoring visit is scheduled within the visit window. }
        - { show_when: status == on_hold, tone: warning, text: "On hold: {hold_reason}" }
    stats:
      - { label: Randomised, value: { field: randomised }, tone: green, link_to_tab: enrollment }
      - { label: Screen failures, value: { field: screen_failures }, tone: gray, link_to_tab: enrollment }
      - { label: Open deviations, value: { count: issue, via: site, where: "status not_in [closed]" }, tone: red, link_to_tab: issues }
      - { label: Documents to verify, value: { count: site_document, via: site, where: status == uploaded }, tone: amber, link_to_tab: documents }
    sidebar:
      - { type: fields, title: Site, fields: [site_no, study, city, region, ec_reg_no, activated_on] }
      - { type: fields, title: People, fields: [pi_name, coordinator_name, coordinator_email, coordinator_mobile, cra] }
    tabs:
      - { code: visits, label: Monitoring Visits, type: related_table, entity: monitoring_visit, via: site, count_badge: true,
          columns: [visit_ref, visit_type, mode, planned_date, visit_date, findings, status],
          add: { label: Schedule Visit, prefill: { site: hero } } }
      - { code: issues, label: Deviations, type: related_table, entity: issue, via: site, count_badge: { where: "status not_in [closed]", tone: red },
          columns: [issue_ref, category, severity, subject_id, due_date, status] }
      - code: documents
        label: Documents
        type: related_table
        entity: site_document
        via: site
        count_badge: { where: status == uploaded, tone: amber }
        columns: [doc_type, version, valid_until, status]
        add: { label: Upload Document, prefill: { site: hero } }
        empty_state: { title: No documents yet, text: "Upload the EC approval, signed CTA, PI CV, GCP certificates and lab normals to activate the site.", cta: add }
      - { code: enrollment, label: Enrollment, type: related_table, entity: enrollment_snapshot, via: site,
          columns: [week_ending, screened, screen_failed, randomised, discontinued] }
      - code: activity
        label: Activity
        type: timeline
        sources:
          - { entity: site, events: [created, updated, transition, tag] }
          - { entity: monitoring_visit, via: site, events: [created, transition] }
          - { entity: issue, via: site, events: [created, transition] }
          - { entity: site_document, via: site, events: [created, transition] }
    states:
      not_found: { title: Site not found, back_to: sites }
