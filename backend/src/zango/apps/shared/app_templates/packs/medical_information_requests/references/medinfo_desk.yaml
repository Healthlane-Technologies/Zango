# MedInfo Desk: a worked example of the Medical Information Requests template.
# A specialty pharmaceutical company's medical information desk answers
# questions on its oncology and diabetes portfolio in India. HCPs ask through a
# portal, the toll-free line, the MI mailbox or their MSL (who may only pass on
# unsolicited questions); MI specialists answer from an approved standard
# response library or draft a custom answer with literature references, and a
# medical reviewer approves every custom answer before it goes out. Any adverse
# event or product complaint mentioned is captured and forwarded to
# pharmacovigilance within one business day, and PV records the safety case ID.
# HCP profiles and every closed inquiry are synced with the company CRM.
spec_version: 1

app:
  code: medinfo_desk
  name: MedInfo Desk
  description: Medical information desk for an oncology and diabetes portfolio, with a standard response library, medical review of custom answers, AE capture and CRM sync.
  timezone: Asia/Kolkata
  locale: en-IN
  currency: INR
  theme: { primary: "#1D4ED8", secondary: "#475569" }
  custom_requirements:
    - area: integration
      title: CRM sync
      text: Every night, pull HCP profiles (name, registration number, specialty, institution, email, phone and CRM ID) from the CRM and create or update reporters by CRM ID; when an inquiry is closed, push a medical information activity to the HCP's CRM record with the inquiry ID, product, category and the date answered, but never the question or answer text.
    - area: integration
      title: Literature database search
      text: On a custom response, a "Search literature" button sends the product's generic name and the inquiry keywords to the literature database (PubMed E-utilities), lists the top 20 citations with title, journal, year and PMID, and appends the ones the specialist ticks to the response's literature references in Vancouver style.
    - area: scheduled
      title: Response SLA clock
      text: Every hour on business days, set the overdue tag on inquiries whose due_on is before today and that are not responded, closed or cancelled; at 9:00 every business day, email each MI specialist the list of their inquiries due today or tomorrow.
    - area: scheduled
      title: AE forwarding clock
      text: Every 30 minutes, tag AE reports still captured more than one business day after their awareness date with day1_breach and email the PV mailbox and the MI lead the AE ID and inquiry ID.
    - area: report
      title: Monthly AE reconciliation
      text: On the 3rd of each month, email PV Associate and Medical Reviewer a reconciliation of AE reports captured last month against those acknowledged by PV with a safety case ID, listing any not acknowledged within 5 business days.
    - area: permission
      title: Audit trail
      text: Keep an uneditable audit trail of every field change and transition with user, time, old and new values for inquiries, responses, standard responses and AE reports, retained for 10 years.

choice_sets:
  therapeutic_area:
    - { id: oncology, label: Oncology, color: purple }
    - { id: diabetes, label: Diabetes, color: blue }
  reporter_type:
    - { id: hcp,        label: HCP,        color: blue }
    - { id: pharmacist, label: Pharmacist, color: teal }
    - { id: nurse,      label: Nurse,      color: indigo }
    - { id: patient,    label: Patient,    color: purple }
    - { id: caregiver,  label: Caregiver,  color: pink }
  specialty:
    - { id: medical_oncology, label: Medical Oncology }
    - { id: haematology,      label: Haematology }
    - { id: endocrinology,    label: Endocrinology }
    - { id: diabetology,      label: Diabetology }
    - { id: general_medicine, label: General Medicine }
    - { id: pharmacy,         label: Pharmacy }
  language:
    - { id: en, label: English }
    - { id: hi, label: Hindi }
    - { id: ta, label: Tamil }
    - { id: mr, label: Marathi }
  channel:
    - { id: portal,   label: HCP portal,      color: blue }
    - { id: tollfree, label: Toll-free line,  color: teal }
    - { id: email,    label: MI mailbox,      color: indigo }
    - { id: msl,      label: MSL on behalf,   color: purple }
  inquiry_category:
    - { id: dosing,        label: Dosing and administration }
    - { id: safety,        label: Safety and tolerability }
    - { id: interactions,  label: Drug interactions }
    - { id: special_pops,  label: Renal / hepatic / pregnancy }
    - { id: stability,     label: Storage and stability }
    - { id: clinical_data, label: Clinical trial data }
    - { id: availability,  label: Availability and access }
    - { id: off_label,     label: Off-label use }
  priority:
    - { id: standard, label: Standard (5 days), color: gray }
    - { id: urgent,   label: Urgent (2 days),   color: red }
  audience:
    - { id: hcp,     label: HCP,               color: blue }
    - { id: patient, label: Patient / consumer, color: purple }
  delivery_method:
    - { id: email,  label: Email }
    - { id: portal, label: Portal }
    - { id: letter, label: Courier letter }
    - { id: phone,  label: Phone call }
  seriousness:
    - { id: non_serious, label: Non-serious, color: amber }
    - { id: serious,     label: Serious,     color: red }
  outcome:
    - { id: recovered,  label: Recovered }
    - { id: recovering, label: Recovering }
    - { id: ongoing,    label: Not recovered / ongoing }
    - { id: fatal,      label: Fatal }
    - { id: unknown,    label: Unknown }

roles:
  - name: MI Specialist
    description: Logs and triages inquiries, matches standard responses, drafts custom answers and captures adverse events.
    landing: dashboard
    menu:
      - { page: dashboard,  icon: layout-dashboard }
      - { page: inquiries,  icon: inbox }
      - { page: responses,  icon: file-text }
      - { page: ae_reports, label: AE Capture, icon: alert-triangle }
      - { page: reporters,  icon: users }
      - group: Content
        icon: library
        items:
          - { page: standard_responses, icon: book-open }
          - { page: products,           icon: pill }

  - name: Medical Reviewer
    description: Approves custom responses and standard response documents and reviews monthly MI metrics.
    landing: responses
    menu:
      - { page: responses,          label: Review Queue, icon: clipboard-check }
      - { page: standard_responses, icon: book-open }
      - { page: inquiries,          icon: inbox }
      - { page: ae_reports,         label: AE Capture, icon: alert-triangle }
      - { page: mi_metrics,         icon: bar-chart-3 }

  - name: PV Associate
    description: Receives forwarded adverse events, records the safety case ID or marks them not an AE.
    landing: ae_reports
    menu:
      - { page: ae_reports, label: AE Inbox, icon: shield-alert }
      - { page: inquiries,  label: Source Inquiries, icon: inbox }

  - name: MSL
    description: Medical science liaison who passes on unsolicited HCP questions and follows their answers.
    landing: inquiries
    menu:
      - { page: inquiries, label: My Submissions, icon: send }
      - { page: reporters, label: HCPs, icon: stethoscope }

  - name: HCP
    description: Asks medical questions through the portal and reads the answers; sees only their own inquiries.
    landing: inquiries
    menu:
      - { page: inquiries, label: My Questions, icon: message-circle-question }
      - { page: responses, label: My Answers,   icon: mail-open }

pages:
  - { code: inquiries,          type: crud,   entity: inquiry,           route: /app/inquiries,          title: Inquiries }
  - { code: inquiry_360,        type: detail, detail_view: inquiry_360,  route: /app/inquiries/:id }
  - { code: responses,          type: crud,   entity: response,          route: /app/responses,          title: Responses }
  - { code: ae_reports,         type: crud,   entity: ae_report,         route: /app/ae-reports,         title: Adverse Events }
  - { code: reporters,          type: crud,   entity: reporter,          route: /app/reporters,          title: Reporters }
  - { code: reporter_360,       type: detail, detail_view: reporter_360, route: /app/reporters/:id }
  - { code: standard_responses, type: crud,   entity: standard_response, route: /app/standard-responses, title: Standard Responses }
  - { code: products,           type: crud,   entity: product,           route: /app/masters/products,   title: Products }
  - code: dashboard
    type: custom
    route: /app/dashboard
    title: Desk Today
    component: MiDeskDashboard
    preview: |
      const I = ctx.entity('inquiry'), inq = ctx.rows('inquiry'), resp = ctx.rows('response'), aes = ctx.rows('ae_report');
      const D = 864e5, today = new Date().toISOString().slice(0, 10), dueIn = r => Math.round((new Date(r.due_on) - new Date(today)) / D);
      const open = inq.filter(r => ['new', 'in_progress', 'awaiting_info'].includes(r.status));
      const soon = open.filter(r => r.due_on && dueIn(r) >= 0 && dueIn(r) <= 1).length, late = open.filter(r => r.due_on && dueIn(r) < 0).length;
      const unfwd = aes.filter(a => a.status === 'captured'), breach = unfwd.filter(a => (a.forward_due && a.forward_due < today) || (a.awareness_date && (new Date(today) - new Date(a.awareness_date)) / D > 1)).length;
      const mine = open.filter(r => r.assigned_to === ctx.user), queue = (mine.length ? mine : open).slice().sort((a, b) => String(a.due_on || '9').localeCompare(String(b.due_on || '9'))).slice(0, 8);
      const chans = I.fmap.channel.opts, cols = ['var(--brand)', '#0BA5EC', '#F79009', '#7A5AF8'];
      const recent = new Set(inq.filter(r => (Date.now() - new Date(r.received_on)) / D < 14).map(r => r.received_on)).size, step = recent >= 4 ? 1 : 7;
      const days = [...Array(14)].map((_, i) => new Date(Date.now() - (13 - i) * step * D).toISOString().slice(0, 10)), inB = (r, d) => r.received_on <= d && (new Date(d) - new Date(r.received_on)) / D < step;
      const per = days.map(d => chans.map(c => inq.filter(r => inB(r, d) && r.channel === c.id).length)), top = Math.max(1, ...per.map(p => p.reduce((a, b) => a + b, 0)));
      const badge = r => { const s = I.wf.smap[r.status], [b, f] = ctx.tone(s.color); return `<span class="pv-badge" style="background:${b};color:${f};border-color:${b}">${ctx.esc(s.label)}</span>`; };
      const kpi = (l, v, col, go) => `<div class="pv-kpi" data-go="${go}"><span>${l}</span><b style="color:${col || '#101828'}">${v}</b></div>`;
      return `
      <div class="pv-kpis">
        ${kpi('Open inquiries', open.length, '', 'inquiries')}${kpi('Due today or tomorrow', soon, soon ? '#B54708' : '', 'inquiries')}${kpi('Overdue', late, late ? '#B42318' : '', 'inquiries')}
        ${kpi('Custom responses in medical review', resp.filter(r => r.status === 'in_review' && r.response_type !== 'standard').length, '', 'responses')}
        <div class="pv-kpi" data-go="ae_reports"><span>AE reports not forwarded</span><b style="color:${breach ? '#B42318' : '#101828'}">${unfwd.length}</b><span style="color:${breach ? '#B42318' : 'inherit'}">${breach ? breach + ' past one business day' : 'all within one business day'}</span></div>
      </div>
      <div style="display:grid;grid-template-columns:1.5fr 1fr;gap:12px;align-items:start">
        <div class="d-panel"><h3>${ctx.icon('inbox')}${mine.length ? 'My queue' : 'Open queue'}<span class="sp"></span><span class="pv-muted">by due date</span></h3>
          <table class="z-t"><thead><tr><th>Inquiry</th><th>Reporter</th><th>Product</th><th>Category</th><th>Due</th><th>Status</th></tr></thead><tbody>${queue.map(r => `
            <tr class="click" data-go="inquiry_360:${r.id}"><td><span class="z-link">${ctx.esc(r.inquiry_ref)}</span>${r.priority === 'urgent' ? ' <span class="z-chip" style="background:#FEF3F2;color:#B42318">Urgent</span>' : ''}</td><td>${ctx.esc(ctx.fmt(r, 'reporter'))}</td><td>${ctx.esc(ctx.fmt(r, 'product'))}</td><td>${ctx.esc(ctx.fmt(r, 'category'))}</td>
              <td style="color:${!r.due_on ? 'inherit' : dueIn(r) < 0 ? '#B42318' : dueIn(r) <= 1 ? '#B54708' : 'inherit'};font-weight:550">${!r.due_on ? '—' : dueIn(r) < 0 ? -dueIn(r) + 'd overdue' : dueIn(r) === 0 ? 'Today' : dueIn(r) === 1 ? 'Tomorrow' : ctx.esc(ctx.fmt(r, 'due_on'))}</td><td>${badge(r)}</td></tr>`).join('') || '<tr><td colspan="6" class="pv-muted">Queue is clear.</td></tr>'}</tbody></table></div>
        <div class="d-panel"><h3>${ctx.icon('bar-chart-3')}Received per ${step === 1 ? 'day, last 14 days' : 'week, last 14 weeks'}</h3>
          <div style="padding:14px 16px"><div style="display:flex;align-items:flex-end;gap:5px;height:140px">${per.map((p, i) => `
            <div title="${days[i]}" style="flex:1;display:flex;flex-direction:column-reverse;height:100%">${p.map((n, j) => n ? `<i style="display:block;height:${100 * n / top}%;background:${cols[j % 4]};border-top:1px solid #fff"></i>` : '').join('')}</div>`).join('')}</div>
            <div class="pv-muted" style="display:flex;justify-content:space-between;margin-top:4px"><span>${ctx.esc(days[0].slice(5))}</span><span>today</span></div>
            <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:10px">${chans.map((c, j) => `<span class="pv-muted"><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${cols[j % 4]}"></i> ${ctx.esc(c.label)}</span>`).join('')}</div></div></div>
      </div>`;
    roles: [MI Specialist]
    text: >
      KPI row: open inquiries, due today or tomorrow, overdue, custom responses awaiting medical
      review, AE reports not yet forwarded (red when any is past one business day). Below: the
      current user's queue sorted by due date with reporter, product, category and status, and a
      bar of inquiries received per day over the last 14 days split by channel.
  - code: mi_metrics
    type: custom
    route: /app/metrics
    title: MI Metrics
    component: MiMetrics
    preview: |
      const I = ctx.entity('inquiry'), all = ctx.rows('inquiry'), resp = ctx.rows('response'), srd = ctx.rows('standard_response').filter(s => s.status === 'approved');
      const D = 864e5, m = new Date().toISOString().slice(0, 7), inM = all.filter(r => String(r.received_on).slice(0, 7) === m && resp.some(x => x.inquiry === r.id && x.status === 'sent')), inq = inM.length ? all.filter(r => String(r.received_on).slice(0, 7) === m) : all;
      const sentFor = r => resp.filter(x => x.inquiry === r.id && x.status === 'sent' && x.sent_on).sort((a, b) => String(a.sent_on).localeCompare(String(b.sent_on)))[0];
      const answered = inq.map(r => ({ r, s: sentFor(r) })).filter(x => x.s), pct = (n, d) => d ? Math.round(100 * n / d) + '%' : '—';
      const inSla = answered.filter(x => !x.r.due_on || x.s.sent_on <= x.r.due_on).length, std = answered.filter(x => x.s.response_type === 'standard').length;
      const tts = answered.map(x => Math.max(0, Math.round((new Date(x.s.sent_on) - new Date(x.r.received_on)) / D))).sort((a, b) => a - b), med = tts.length ? tts[Math.floor(tts.length / 2)] : '—';
      const ids = new Set(inq.map(r => r.id)), aes = ctx.rows('ae_report').filter(a => ids.has(a.inquiry)), fwd = aes.filter(a => ['forwarded', 'acknowledged'].includes(a.status) && !(a.tags || []).includes('day1_breach')).length;
      const cats = I.fmap.category.opts, cols = ['var(--brand)', '#0BA5EC', '#F79009', '#7A5AF8', '#12B76A', '#F04438', '#EE46BC', '#667085'];
      const prods = [...new Set(inq.map(r => r.product))].map(p => ({ name: ctx.fmt(inq.find(r => r.product === p), 'product') || 'No product', n: cats.map(c => inq.filter(r => r.product === p && r.category === c.id).length) }));
      const topP = Math.max(1, ...prods.map(p => p.n.reduce((a, b) => a + b, 0)));
      const ch = I.fmap.channel.opts.map((c, i) => ({ label: c.label, n: inq.filter(r => r.channel === c.id).length, col: cols[i] })); let acc = 0;
      const donut = ch.map(c => { const a = acc; acc += 100 * c.n / (inq.length || 1); return `${c.col} ${a}% ${acc}%`; }).join(',');
      const gaps = Object.values(inq.reduce((g, r) => { const k = r.product + '|' + r.category; if (!srd.some(s => s.product === r.product && s.category === r.category)) (g[k] = g[k] || { p: ctx.fmt(r, 'product'), c: ctx.fmt(r, 'category'), n: 0 }).n++; return g; }, {})).sort((a, b) => b.n - a.n).slice(0, 10);
      const kpi = (l, v, s) => `<div class="pv-kpi"><span>${l}</span><b>${v}</b>${s ? `<span>${s}</span>` : ''}</div>`;
      return `
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><select class="z-in" style="width:180px"><option>${new Date().toLocaleString('en', { month: 'long', year: 'numeric' })}</option></select>
        <span class="pv-muted">${inM.length ? '' : 'Nothing answered this month yet; showing all months'}</span><span style="flex:1"></span><button class="z-btn">${ctx.icon('download')}Export to Excel</button></div>
      <div class="pv-kpis">${kpi('Inquiries received', inq.length)}${kpi('Answered within SLA', pct(inSla, answered.length), answered.length + ' answered')}${kpi('Standard response used', pct(std, answered.length))}
        ${kpi('Median days to respond', med)}${kpi('AE reports captured', aes.length, pct(fwd, aes.length) + ' forwarded in 1 business day')}</div>
      <div style="display:grid;grid-template-columns:1.6fr 1fr;gap:12px;align-items:start">
        <div class="d-panel"><h3>${ctx.icon('bar-chart-3')}Inquiries by product and category</h3><div style="padding:12px 16px;display:flex;flex-direction:column;gap:10px">${prods.map(p => `
          <div style="display:grid;grid-template-columns:120px 1fr 30px;gap:10px;align-items:center;font-size:13px"><span>${ctx.esc(p.name)}</span>
            <div style="display:flex;height:14px;border-radius:4px;overflow:hidden;width:${100 * p.n.reduce((a, b) => a + b, 0) / topP}%">${p.n.map((n, j) => n ? `<i title="${ctx.esc(cats[j].label)}" style="flex:${n};background:${cols[j]}"></i>` : '').join('')}</div><b style="font-weight:550;text-align:right">${p.n.reduce((a, b) => a + b, 0)}</b></div>`).join('')}
          <div style="display:flex;flex-wrap:wrap;gap:10px">${cats.map((c, j) => `<span class="pv-muted"><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${cols[j]}"></i> ${ctx.esc(c.label)}</span>`).join('')}</div></div></div>
        <div class="d-panel"><h3>${ctx.icon('pie-chart')}By channel</h3><div style="padding:14px 16px;display:flex;gap:16px;align-items:center">
          <div style="width:110px;height:110px;border-radius:50%;background:conic-gradient(${donut || '#EAECF0 0 100%'});-webkit-mask:radial-gradient(circle,transparent 32px,#000 33px);mask:radial-gradient(circle,transparent 32px,#000 33px)"></div>
          <div style="display:flex;flex-direction:column;gap:6px;font-size:13px">${ch.map(c => `<span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${c.col}"></i> ${ctx.esc(c.label)} <b style="font-weight:550">${c.n}</b></span>`).join('')}</div></div></div>
      </div>
      <div class="d-panel"><h3>${ctx.icon('file-question')}Most asked without an approved standard response<span class="sp"></span><span class="pv-muted">candidates for new SRDs</span></h3>
        <table class="z-t"><thead><tr><th>Product</th><th>Category</th><th>Inquiries</th></tr></thead><tbody>${gaps.map(g => `<tr class="click" data-go="standard_responses"><td>${ctx.esc(g.p)}</td><td>${ctx.esc(g.c)}</td><td><b style="font-weight:550">${g.n}</b></td></tr>`).join('') || '<tr><td colspan="3" class="pv-muted">Every asked topic has an approved standard response.</td></tr>'}</tbody></table></div>`;
    roles: [Medical Reviewer]
    text: >
      Month picker. KPIs: inquiries received, % answered within SLA, % answered with a standard
      response, median days to respond, AE reports captured and % forwarded within one business day.
      Charts: inquiries by product and category (stacked bar), by channel (donut), and the 10 most
      asked categories without an approved standard response (a gap list for new SRDs). Export to Excel.

modules:
  - code: content
    name: Content
    description: Products and the approved standard response library.
    entities:
      - code: product
        name: Product
        plural: Products
        kind: master
        display: name
        fields:
          - name:             { type: text, label: Brand name, required: true, unique: true }
          - generic_name:     { type: text, label: Generic name (INN), required: true }
          - therapeutic_area: { type: choice, choices: therapeutic_area, required: true }
          - strengths:        { type: text, help: "e.g. 100 mg / 150 mg tablets" }
          - prescribing_info: { type: file, label: Prescribing information (PDF), accept: [pdf], max_size_mb: 20 }
          - is_active:        { type: boolean, default: true }
        access:
          MI Specialist:    { actions: [view, add, edit, export] }
          Medical Reviewer: { actions: [view, edit] }
          PV Associate:     { actions: [view] }
          MSL:              { actions: [view] }
          HCP:              { actions: [view] }
        table:
          columns:
            - name:             { label: Brand, searchable: true, sortable: true }
            - therapeutic_area: { label: Therapeutic area, filterable: true }
            - strengths:        { label: Strengths }
            - prescribing_info: { label: PI }
            - is_active:        { label: Active, filterable: true }
          default_sort: name
          quick_filters:
            - { label: Active only, where: is_active is_true, default: true }
          add_button: Add Product
          row_actions:
            - { key: edit, label: Edit, type: edit }
        form:
          create: { fields: [name, generic_name, therapeutic_area, strengths, prescribing_info, is_active] }
          edit:   { same_as: create }

      - code: standard_response
        name: Standard Response
        plural: Standard Responses
        kind: master
        display: srd_ref
        fields:
          - srd_ref:        { type: text, label: SRD ID, readonly: true, unique: true, auto: { sequence: "SRD-{0000}" } }
          - title:          { type: text, required: true, max_length: 200 }
          - product:        { type: link, to: product, required: true, display: name }
          - category:       { type: choice, choices: inquiry_category, required: true }
          - audience:       { type: choice, choices: audience, required: true, default: hcp }
          - version:        { type: text, required: true, default: "1.0" }
          - body:           { type: long_text, label: Response text, required: true }
          - references:     { type: long_text, label: Literature references }
          - document:       { type: file, label: Approved letter (PDF), accept: [pdf], max_size_mb: 10 }
          - effective_from: { type: date, readonly: true }
          - review_due:     { type: date, label: Next review due, required: true }
          - times_used:     { type: integer, readonly: true, computed: "Count of sent responses that used this standard response." }
        validation:
          rules:
            - { when: category == off_label, require_expr: audience == hcp, message: Off-label standard responses can only be written for HCPs. }
          duplicate_check:
            scope: { where: "status not_in [retired]" }
            rules:
              - { match: [product, category, title], compare: fuzzy, threshold: 0.85, on_match: warn, message: A similar standard response already exists for this product and category. }
        access:
          MI Specialist:    { actions: [view, add, edit, export] }
          Medical Reviewer: { actions: [view, edit, export] }
        workflow:
          statuses:
            - { code: draft,     label: Draft,     color: gray, initial: true }
            - { code: in_review, label: In Review, color: amber }
            - { code: approved,  label: Approved,  color: green }
            - { code: retired,   label: Retired,   color: purple, final: true }
          transitions:
            - { name: submit, label: Submit for Review, from: draft, to: in_review, roles: [MI Specialist], primary: true,
                condition: { text: Every claim in the response text has a literature reference or a prescribing-information section. },
                condition_msg: Add references for every claim before review. }
            - name: approve
              label: Approve
              from: in_review
              to: approved
              roles: [Medical Reviewer]
              primary: true
              condition: { text: The reviewer is not the author of this version (maker-checker). }
              condition_msg: Another reviewer must approve a standard response you wrote.
              on_done: "Set effective_from = today, review_due = today + 12 months, and make the SRD available for matching."
            - { name: return, label: Return, from: in_review, to: draft, roles: [Medical Reviewer], tone: danger,
                form: [ { review_comments: { type: long_text, required: true } } ],
                on_done: Email the author the review comments. }
            - { name: revise, label: Start Revision, from: approved, to: draft, roles: [MI Specialist],
                on_done: Increase the minor version and keep the approved text and PDF in history. }
            - { name: retire, label: Retire, from: approved, to: retired, roles: [Medical Reviewer], tone: danger, confirm: "Retire this standard response? It will no longer be offered for matching." }
          tags:
            - { code: review_overdue, label: Review overdue, color: red, system: true, text: Set nightly when review_due is before today. }
            - { code: review_soon, label: Review in 30 days, color: amber, system: true, text: Set nightly when review_due is within the next 30 days. }
        table:
          columns:
            - srd_ref:    { label: SRD, searchable: true, sortable: true }
            - product:    { label: Product, display: name, filterable: true }
            - category:   { label: Category, filterable: true }
            - audience:   { label: Audience, filterable: true }
            - version:    { label: Version }
            - times_used: { label: Times used, sortable: true }
            - review_due: { label: Review due, sortable: true }
            - status:     { source: status, label: Status, filterable: true }
            - tags:       { source: tags, label: Flags }
          default_sort: srd_ref
          quick_filters:
            - { label: Awaiting my review, where: status == in_review, roles: [Medical Reviewer], default: true }
            - { label: Approved, where: status == approved, roles: [MI Specialist], default: true }
            - { label: Review due, where: has_tag review_soon }
          add_button: New Standard Response
          row_actions:
            - { key: edit, label: Edit, type: edit, show_when: "status in [draft, in_review]" }
            - { key: pdf, label: Download PDF, type: download, text: The approved letter PDF of the current version. }
        form:
          create:
            roles: [MI Specialist]
            title: New Standard Response
            sections:
              - { title: Scope, fields: [title, product, category, audience, version, review_due] }
              - { title: Content, fields: [body, references, document] }
          edit: { same_as: create, roles: [MI Specialist, Medical Reviewer], editable_in: [draft, in_review] }

  - code: inquiries
    name: Inquiries
    description: Reporters, inquiries, follow-ups and the responses sent.
    entities:
      - code: reporter
        name: Reporter
        plural: Reporters
        kind: hero
        display: full_name
        app_user: { role: HCP, name: full_name, email: email, mobile: phone, create_on: portal_access is_true }
        fields:
          - reporter_ref:    { type: text, label: Reporter ID, readonly: true, unique: true, auto: { sequence: "RPT-{00000}" } }
          - full_name:       { type: text, required: true, max_length: 200 }
          - reporter_type:   { type: choice, choices: reporter_type, required: true }
          - specialty:       { type: choice, choices: specialty }
          - registration_no: { type: text, label: Medical registration no., pattern: "^[A-Z]{2,4}-[0-9]{4,6}$", pattern_msg: "State council code and number, e.g. MMC-123456." }
          - institution:     { type: text, label: Hospital / clinic }
          - email:           { type: email }
          - phone:           { type: phone, pattern: "^[6-9][0-9]{9}$", pattern_msg: 10-digit mobile without +91. }
          - city:            { type: text }
          - preferred_language: { type: choice, choices: language, default: en }
          - consent_to_contact: { type: boolean, label: Consents to follow-up contact, default: true }
          - portal_access:   { type: boolean, label: HCP portal login, default: false, help: Only verified HCPs get a portal login. }
          - crm_id:          { type: text, label: CRM ID, readonly: true }
        validation:
          rules:
            - { when: reporter_type == hcp, require: [registration_no, specialty], message: Registration number and specialty are needed for HCPs. }
            - { when: portal_access is_true, require_expr: reporter_type == hcp, message: Only HCPs can have a portal login. }
            - { text: An email or a phone number is recorded., message: Enter an email or phone so the answer can be delivered. }
          duplicate_check:
            rules:
              - { match: [registration_no], compare: normalised, on_match: block, message: An HCP with this registration number already exists. }
              - { match: [full_name, phone], compare: fuzzy, threshold: 0.9, on_match: warn, message: This looks like an existing reporter. }
        access:
          MI Specialist:    { actions: [view, add, edit, export, detail] }
          Medical Reviewer: { actions: [view, detail] }
          MSL:              { actions: [view, detail], rows: { where: reporter_type == hcp } }
        table:
          columns:
            - reporter_ref:  { label: ID, searchable: true, sortable: true }
            - full_name:     { label: Name, searchable: true, sortable: true, link_to: reporter_360 }
            - reporter_type: { label: Type, filterable: true }
            - specialty:     { label: Specialty, filterable: true }
            - institution:   { label: Institution }
            - city:          { label: City, filterable: true }
            - open_inquiries: { source: computed, label: Open inquiries, format: number, shows: Count of this reporter's inquiries not closed or cancelled. }
          default_sort: full_name
          row_click: reporter_360
          quick_filters:
            - { label: HCPs, where: reporter_type == hcp }
            - { label: Patients and caregivers, where: "reporter_type in [patient, caregiver]" }
          add_button: Add Reporter
          row_actions:
            - { key: edit, label: Edit, type: edit, roles: [MI Specialist] }
            - { key: open_360, label: Open 360, type: navigate, to: reporter_360 }
        form:
          create:
            roles: [MI Specialist]
            sections:
              - { title: Who, fields: [full_name, reporter_type, specialty, registration_no, institution] }
              - { title: Contact, fields: [email, phone, city, preferred_language, consent_to_contact, portal_access] }
          edit: { same_as: create }

      - code: inquiry
        name: Inquiry
        plural: Inquiries
        kind: hero
        display: inquiry_ref
        fields:
          - inquiry_ref:    { type: text, label: Inquiry ID, readonly: true, unique: true, auto: { sequence: "MI-{YY}-{00000}" } }
          - reporter:       { type: link, to: reporter, required: true, display: full_name }
          - channel:        { type: choice, choices: channel, required: true, default: portal }
          - received_on:    { type: date, required: true, default: today }
          - product:        { type: link, to: product, required: true, display: name, limit_choices: is_active is_true }
          - category:       { type: choice, choices: inquiry_category, required: true }
          - question:       { type: long_text, required: true }
          - language:       { type: choice, choices: language, required: true, default: en }
          - priority:       { type: choice, choices: priority, required: true, default: standard }
          - due_on:         { type: date, label: Response due, readonly: true, computed: "received_on + 2 business days when urgent, + 5 business days otherwise." }
          - assigned_to:    { type: link, to: app_user, label: MI specialist }
          - unsolicited_confirmed: { type: boolean, label: MSL confirms the question was unsolicited, default: false }
          - ae_mentioned:   { type: boolean, label: Adverse event mentioned, default: false }
          - pqc_mentioned:  { type: boolean, label: Product complaint mentioned, default: false }
          - crm_activity_id: { type: text, label: CRM activity ID, readonly: true }
        validation:
          rules:
            - { when: channel == msl, require_expr: unsolicited_confirmed is_true, message: MSLs may only pass on unsolicited questions; confirm the question was unsolicited. }
            - { when: category == off_label, require_expr: "reporter.reporter_type in [hcp, pharmacist, nurse]", message: Off-label questions are answered only for healthcare professionals. }
          duplicate_check:
            scope: { where: "status not_in [closed, cancelled]" }
            rules:
              - { match: [reporter, product, category], compare: exact, on_match: warn, message: This reporter already has an open inquiry on this product and category. }
        access:
          MI Specialist:    { actions: [view, add, edit, export, detail] }
          Medical Reviewer: { actions: [view, export, detail] }
          PV Associate:     { actions: [view, detail], rows: { where: ae_mentioned is_true } }
          MSL:              { actions: [view, add, detail], rows: created_by_me }
          HCP:              { actions: [view, add, detail], rows: { own: reporter } }
        workflow:
          statuses:
            - { code: new,           label: New,           color: blue, initial: true }
            - { code: in_progress,   label: In Progress,   color: indigo }
            - { code: awaiting_info, label: Awaiting Info, color: amber }
            - { code: responded,     label: Responded,     color: teal }
            - { code: closed,        label: Closed,        color: green, final: true }
            - { code: cancelled,     label: Cancelled,     color: gray,  final: true }
          transitions:
            - name: triage
              label: Triage
              from: new
              to: in_progress
              roles: [MI Specialist]
              primary: true
              form:
                - priority:      { type: choice, choices: priority, required: true }
                - ae_mentioned:  { type: boolean }
                - pqc_mentioned: { type: boolean }
              on_done: Assign the inquiry to the current user, compute due_on from the priority, and email the reporter an acknowledgement with the inquiry ID in their preferred language.
            - { name: request_info, label: Ask Reporter, from: in_progress, to: awaiting_info, roles: [MI Specialist],
                form: [ { clarification: { type: long_text, required: true } } ],
                on_done: "Email the reporter the clarification question with a reply link, log it as an outbound follow-up, and pause the SLA clock." }
            - { name: info_received, label: Info Received, from: awaiting_info, to: in_progress, roles: [MI Specialist],
                on_done: Restart the SLA clock and push due_on by the days spent waiting. }
            - { name: mark_responded, label: Mark Responded, from: in_progress, to: responded, trigger: system,
                text: When a response for this inquiry is sent. }
            - name: close
              label: Close
              from: responded
              to: closed
              roles: [MI Specialist]
              primary: true
              condition:
                all:
                  - text: Every AE report on this inquiry is forwarded to PV.
                  - text: When pqc_mentioned is true, the product complaint was emailed to Quality.
              condition_msg: Forward the AE and product complaint before closing.
              on_done: Push a medical information activity to the reporter's CRM record and store the CRM activity ID.
            - { name: reopen, label: Reopen, from: closed, to: in_progress, roles: [MI Specialist],
                form: [ { reopen_reason: { type: long_text, required: true } } ] }
            - { name: cancel, label: Cancel, from: [new, in_progress, awaiting_info], to: cancelled, roles: [MI Specialist], tone: danger,
                form: [ { cancel_reason: { type: choice, required: true, choices: [ { id: duplicate, label: Duplicate }, { id: withdrawn, label: Withdrawn by reporter }, { id: not_medical, label: Not a medical question } ] } } ] }
          tags:
            - { code: ae_reported, label: AE, color: red, system: true, text: Set when an AE report is captured on the inquiry. }
            - { code: pqc, label: Product complaint, color: pink, system: true, text: Set when pqc_mentioned is true. }
            - { code: overdue, label: Overdue, color: amber, system: true, text: Set hourly when due_on is before today and the inquiry is not responded. }
            - code: escalated
              label: Escalated
              color: purple
              enable:  { roles: [MI Specialist] }
              disable: { roles: [MI Specialist, Medical Reviewer] }
        table:
          columns:
            - inquiry_ref: { label: Inquiry, searchable: true, sortable: true, link_to: inquiry_360 }
            - reporter:    { label: Reporter, display: full_name, searchable: true }
            - product:     { label: Product, display: name, filterable: true }
            - category:    { label: Category, filterable: true }
            - channel:     { label: Channel, filterable: true }
            - priority:    { label: Priority, filterable: true }
            - due_on:      { label: Due, sortable: true }
            - assigned_to: { label: Specialist, roles: [MI Specialist, Medical Reviewer] }
            - status:      { source: status, label: Status, filterable: true }
            - tags:        { source: tags, label: Flags }
          default_sort: due_on
          row_click: inquiry_360
          quick_filters:
            - { label: Open, where: "status in [new, in_progress, awaiting_info]", roles: [MI Specialist], default: true }
            - { label: Untriaged, where: status == new, roles: [MI Specialist] }
            - { label: With AE, where: has_tag ae_reported, roles: [MI Specialist, Medical Reviewer, PV Associate] }
            - { label: Off-label, where: category == off_label, roles: [Medical Reviewer] }
          add_button: New Inquiry
          row_actions:
            - { key: open_360, label: Open, type: navigate, to: inquiry_360 }
            - { key: edit, label: Edit, type: edit, show_when: "status in [new, in_progress, awaiting_info]", roles: [MI Specialist] }
        form:
          create:
            roles: [MI Specialist, MSL, HCP]
            title: New Inquiry
            sections:
              - { title: Who is asking, fields: [reporter, channel, received_on, language] }
              - title: Question
                fields:
                  - product
                  - category
                  - question
                  - unsolicited_confirmed: { show_when: channel == msl }
              - { title: Safety, fields: [ae_mentioned, pqc_mentioned] }
            on_create: When ae_mentioned is true, email the MI lead immediately with the inquiry ID.
            after_create: inquiry_360
          edit:
            same_as: create
            roles: [MI Specialist]
            editable_in: [new, in_progress, awaiting_info]
            readonly_when:
              - { when: "status in [in_progress, awaiting_info]", fields: [reporter, channel, received_on] }

      - code: follow_up
        name: Follow-up
        plural: Follow-ups
        kind: child
        parent: { entity: inquiry, field: inquiry }
        display: summary
        fields:
          - inquiry:   { type: link, to: inquiry, required: true, display: inquiry_ref, on_delete: cascade }
          - direction: { type: choice, required: true, choices: [ { id: outbound, label: Outbound, color: blue }, { id: inbound, label: Inbound, color: teal } ] }
          - mode:      { type: choice, choices: delivery_method, required: true }
          - logged_on: { type: date, required: true, default: today }
          - summary:   { type: long_text, required: true }
        access:
          MI Specialist:    { actions: [view, add, edit] }
          Medical Reviewer: { actions: [view] }
        table:
          columns:
            - logged_on: { label: Date, sortable: true }
            - direction: { label: Direction }
            - mode:      { label: Mode }
            - summary:   { label: Summary }
          default_sort: -logged_on
          add_button: Log Follow-up
        form:
          create: { roles: [MI Specialist], fields: [direction, mode, logged_on, summary] }
          edit:   { same_as: create }

      - code: response
        name: Response
        plural: Responses
        kind: transactional
        display: response_ref
        fields:
          - response_ref:      { type: text, label: Response ID, readonly: true, unique: true, auto: { sequence: "RSP-{YY}-{00000}" } }
          - inquiry:           { type: link, to: inquiry, required: true, display: inquiry_ref }
          - response_type:     { type: choice, required: true, default: standard, choices: [ { id: standard, label: Standard, color: green }, { id: adapted, label: Adapted standard, color: teal }, { id: custom, label: Custom, color: purple } ] }
          - standard_response: { type: link, to: standard_response, display: srd_ref, limit_choices: "status == approved" }
          - body:              { type: long_text, label: Response text, required: true }
          - references:        { type: long_text, label: Literature references }
          - enclosures:        { type: file, label: "Enclosures (PI, reprints)", accept: [pdf], max_size_mb: 20 }
          - delivery_method:   { type: choice, choices: delivery_method, required: true, default: email }
          - reviewed_by:       { type: link, to: app_user, readonly: true }
          - sent_on:           { type: date, readonly: true }
        validation:
          rules:
            - { when: "response_type in [standard, adapted]", require: [standard_response], message: Pick the approved standard response used. }
            - { when: response_type == custom, require: [references], message: Custom responses need literature references. }
        access:
          MI Specialist:    { actions: [view, add, edit, export] }
          Medical Reviewer: { actions: [view, edit, export] }
          MSL:              { actions: [view], rows: { where: status == sent } }
          HCP:              { actions: [view], rows: { own: inquiry.reporter } }
        workflow:
          statuses:
            - { code: draft,     label: Draft,     color: gray, initial: true }
            - { code: in_review, label: In Review, color: amber }
            - { code: approved,  label: Approved,  color: indigo }
            - { code: sent,      label: Sent,      color: green, final: true }
          transitions:
            - { name: submit, label: Submit for Review, from: draft, to: in_review, roles: [MI Specialist], primary: true,
                condition: "response_type in [adapted, custom]", condition_msg: "Unchanged standard responses are already approved; send them directly." }
            - name: approve
              label: Approve
              from: in_review
              to: approved
              roles: [Medical Reviewer]
              primary: true
              condition: { text: The reviewer did not draft this response (maker-checker). }
              condition_msg: Another reviewer must approve a response you drafted.
              on_done: Set reviewed_by = current user and record the approval time.
            - { name: return, label: Return, from: in_review, to: draft, roles: [Medical Reviewer], tone: danger,
                form: [ { review_comments: { type: long_text, required: true } } ],
                on_done: Notify the MI specialist with the review comments. }
            - name: send
              label: Send
              from: [draft, approved]
              to: sent
              roles: [MI Specialist]
              primary: true
              condition: { any: [ status == approved, response_type == standard ] }
              condition_msg: Adapted and custom responses need medical approval before sending.
              on_done: "Deliver the response by the chosen method with the standard disclaimer and enclosures, set sent_on = today, move the inquiry to responded, and add 1 to the standard response's times used."
        table:
          columns:
            - response_ref:      { label: Response, searchable: true, sortable: true }
            - inquiry:           { label: Inquiry, display: inquiry_ref, searchable: true, link_to: inquiry_360 }
            - reporter:          { source: computed, label: Reporter, path: inquiry.reporter.full_name }
            - product:           { source: computed, label: Product, path: inquiry.product.name }
            - response_type:     { label: Type, filterable: true }
            - standard_response: { label: SRD, display: srd_ref, roles: [MI Specialist, Medical Reviewer] }
            - delivery_method:   { label: Via }
            - sent_on:           { label: Sent, sortable: true }
            - status:            { source: status, label: Status, filterable: true }
          default_sort: -created_at
          quick_filters:
            - { label: Awaiting my review, where: status == in_review, roles: [Medical Reviewer], default: true }
            - { label: Ready to send, where: status == approved, roles: [MI Specialist] }
            - { label: Sent to me, where: status == sent, roles: [HCP], default: true }
          add_button: New Response
          row_actions:
            - { key: edit, label: Edit, type: edit, show_when: "status in [draft, in_review]", roles: [MI Specialist, Medical Reviewer] }
            - { key: letter, label: Download Letter, type: download, text: "The response letter on letterhead with the reporter's name, the question, the answer, references, enclosures list and the standard disclaimer." }
        form:
          create:
            roles: [MI Specialist]
            sections:
              - { title: Answer, fields: [inquiry, response_type, standard_response, body] }
              - { title: Evidence, fields: [references, enclosures] }
              - { title: Delivery, fields: [delivery_method] }
          edit: { same_as: create, roles: [MI Specialist, Medical Reviewer], editable_in: [draft, in_review] }

  - code: safety
    name: AE Capture
    description: Adverse events mentioned in inquiries, forwarded to pharmacovigilance.
    entities:
      - code: ae_report
        name: AE Report
        plural: AE Reports
        kind: transactional
        display: ae_ref
        fields:
          - ae_ref:            { type: text, label: AE ID, readonly: true, unique: true, auto: { sequence: "AE-{YY}-{0000}" } }
          - inquiry:           { type: link, to: inquiry, required: true, display: inquiry_ref }
          - product:           { type: link, to: product, required: true, display: name }
          - patient_initials:  { type: text, max_length: 5, pattern: "^[A-Z]{1,3}$", pattern_msg: Up to three capital letters. }
          - patient_age:       { type: integer, min: 0, max: 110 }
          - patient_sex:       { type: choice, choices: [ { id: f, label: Female }, { id: m, label: Male }, { id: u, label: Unknown } ] }
          - event_description: { type: long_text, required: true }
          - onset_date:        { type: date }
          - seriousness:       { type: choice, choices: seriousness, required: true }
          - outcome:           { type: choice, choices: outcome, required: true, default: unknown }
          - awareness_date:    { type: date, label: Awareness date (day 0), required: true, default: today }
          - forward_due:       { type: date, label: Forward to PV by, readonly: true, computed: awareness_date + 1 business day. }
          - safety_case_id:    { type: text, label: Safety case ID, readonly: true }
        validation:
          rules:
            - { when: onset_date is_set, require_expr: onset_date <= awareness_date, message: Onset cannot be after the awareness date. }
        access:
          MI Specialist:    { actions: [view, add, edit, export] }
          Medical Reviewer: { actions: [view, export] }
          PV Associate:     { actions: [view, export], rows: { where: "status in [forwarded, acknowledged, not_ae]" } }
        workflow:
          statuses:
            - { code: captured,     label: Captured,        color: amber, initial: true }
            - { code: forwarded,    label: Forwarded to PV, color: blue }
            - { code: acknowledged, label: PV Acknowledged, color: green, final: true }
            - { code: not_ae,       label: Not an AE,       color: gray,  final: true }
          transitions:
            - name: forward
              label: Forward to PV
              from: captured
              to: forwarded
              roles: [MI Specialist]
              primary: true
              condition:
                all:
                  - any: [ patient_initials is_set, patient_age is_set ]
                  - text: "The other minimum criteria are present: an identifiable reporter, the product and the event."
              condition_msg: Record the patient initials or age before forwarding.
              on_done: Email the PV safety mailbox the CIOMS-style AE form with the inquiry transcript and reporter contact, record the time sent, and tag the inquiry ae_reported.
            - { name: acknowledge, label: Record Safety Case, from: forwarded, to: acknowledged, roles: [PV Associate], primary: true,
                form: [ { safety_case_id: { type: text, required: true } } ],
                on_done: Store the safety case ID and notify the MI specialist that the inquiry can be closed. }
            - { name: not_an_ae, label: Not an AE, from: forwarded, to: not_ae, roles: [PV Associate], tone: danger,
                form: [ { pv_rationale: { type: long_text, required: true } } ],
                on_done: Notify the MI specialist with the rationale. }
          tags:
            - { code: day1_breach, label: Over 1 business day, color: red, system: true, text: Set when still captured after forward_due. }
            - { code: follow_up_needed, label: PV follow-up, color: purple, enable: { roles: [PV Associate] }, disable: { roles: [PV Associate, MI Specialist] } }
        table:
          columns:
            - ae_ref:         { label: AE, searchable: true, sortable: true }
            - inquiry:        { label: Inquiry, display: inquiry_ref, link_to: inquiry_360 }
            - product:        { label: Product, display: name, filterable: true }
            - seriousness:    { label: Seriousness, filterable: true }
            - outcome:        { label: Outcome }
            - awareness_date: { label: Day 0, sortable: true }
            - safety_case_id: { label: Safety case }
            - status:         { source: status, label: Status, filterable: true }
            - tags:           { source: tags, label: Flags }
          default_sort: -awareness_date
          quick_filters:
            - { label: Not forwarded, where: status == captured, roles: [MI Specialist], default: true }
            - { label: Awaiting case ID, where: status == forwarded, roles: [PV Associate], default: true }
            - { label: Serious, where: seriousness == serious }
          add_button: Capture AE
          row_actions:
            - { key: edit, label: Edit, type: edit, show_when: status == captured, roles: [MI Specialist] }
            - { key: ae_form, label: Download AE Form, type: download, text: "The AE form PDF as sent to PV, with the inquiry transcript." }
        form:
          create:
            roles: [MI Specialist]
            sections:
              - { title: Source, fields: [inquiry, product, awareness_date] }
              - { title: Patient, fields: [patient_initials, patient_age, patient_sex] }
              - { title: Event, fields: [event_description, onset_date, seriousness, outcome] }
          edit: { same_as: create, editable_in: [captured] }

detail_views:
  - code: inquiry_360
    hero: inquiry
    title: "{inquiry_ref}"
    back_to: inquiries
    layout: header_tabs_sidebar
    roles: [MI Specialist, Medical Reviewer, PV Associate, MSL, HCP]
    header:
      title: inquiry_ref
      subtitle: ["{reporter.full_name}", "{product.name}", "{category}"]
      badges: [ { source: status }, { source: tags }, { field: priority } ]
      facts:
        - { label: Channel, field: channel }
        - { label: Received, field: received_on }
        - { label: Due, field: due_on }
        - { label: Specialist, field: assigned_to, fallback: "—" }
      actions:
        transitions: true
        tags: true
        buttons:
          - { key: new_response, label: Draft Response, icon: pen-line, type: create_related, entity: response, prefill: { inquiry: hero }, roles: [MI Specialist] }
          - { key: capture_ae, label: Capture AE, icon: alert-triangle, type: create_related, entity: ae_report, prefill: { inquiry: hero }, roles: [MI Specialist] }
      banners:
        - { show_when: ae_mentioned is_true, tone: warning, text: "An adverse event was mentioned: capture it and forward it to PV within one business day." }
        - { show_when: category == off_label, tone: info, text: "Off-label question: answer only with balanced, referenced information and route the response through medical review." }
    stats:
      - { label: Responses, value: { count: response, via: inquiry }, tone: blue, link_to_tab: responses }
      - { label: Follow-ups, value: { count: follow_up, via: inquiry }, tone: teal, link_to_tab: follow_ups }
      - { label: Adverse events, value: { count: ae_report, via: inquiry }, tone: red, link_to_tab: adverse_events, roles: [MI Specialist, Medical Reviewer, PV Associate] }
    sidebar:
      - { type: fields, title: Reporter, fields: [reporter, channel, language] }
      - type: custom
        title: Matching standard responses
        preview: |
          const r = ctx.record, srd = ctx.rows('standard_response').filter(s => s.status === 'approved' && (s.product === r.product || s.category === r.category));
          const rep = ctx.rows('reporter').find(x => x.id === r.reporter), aud = rep && ['patient', 'caregiver'].includes(rep.reporter_type) ? 'patient' : 'hcp';
          const score = s => (s.product === r.product ? 2 : 0) + (s.category === r.category ? 2 : 0) + (s.audience === aud ? 1 : 0);
          const list = srd.sort((a, b) => score(b) - score(a) || (+b.times_used || 0) - (+a.times_used || 0)).slice(0, 4);
          if (!list.length) return `<div class="pv-muted">No approved standard response for ${ctx.esc(ctx.fmt(r, 'product'))} · ${ctx.esc(ctx.fmt(r, 'category'))}. Draft a custom response.</div>`;
          return `<div style="display:flex;flex-direction:column;gap:8px">${list.map(s => { const exact = s.product === r.product && s.category === r.category; return `
            <div class="pv-card"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-weight:550">${ctx.esc(s.title)}</b>${exact ? '<span class="pv-badge">Best match</span>' : ''}</div>
              <span class="pv-muted">${ctx.esc(s.srd_ref)} · v${ctx.esc(s.version)} · ${ctx.esc(ctx.fmt(s, 'audience'))} · used ${+s.times_used || 0}×</span>
              <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px"><span class="pv-muted">${s.review_due && s.review_due < new Date().toISOString().slice(0, 10) ? '<b style="color:#B54708">Review overdue</b>' : 'Review due ' + ctx.esc(ctx.fmt(s, 'review_due'))}</span>
                <button class="z-btn sm">${ctx.icon('copy-plus')}Use</button></div></div>`; }).join('')}</div>`;
        roles: [MI Specialist]
        text: "Approved standard responses for this product and category, best match first, each with a Use button that creates a standard response prefilled with its text."
    tabs:
      - { code: question, label: Question, type: summary, sections: [ { title: Inquiry, columns: 2, fields: [product, category, priority, received_on, ae_mentioned, pqc_mentioned] }, { title: Question, columns: 1, fields: [question] } ] }
      - code: responses
        label: Responses
        type: related_table
        entity: response
        via: inquiry
        count_badge: true
        columns: [response_ref, response_type, standard_response, delivery_method, sent_on, status]
        add: { label: Draft Response, prefill: { inquiry: hero } }
      - code: follow_ups
        label: Follow-ups
        type: related_table
        entity: follow_up
        via: inquiry
        count_badge: true
        roles: [MI Specialist, Medical Reviewer]
        columns: [logged_on, direction, mode, summary]
        add: { label: Log Follow-up, prefill: { inquiry: hero } }
        empty_state: { title: No follow-ups yet, text: Log every call or email with the reporter here., cta: add }
      - code: adverse_events
        label: Adverse Events
        type: related_table
        entity: ae_report
        via: inquiry
        count_badge: true
        roles: [MI Specialist, Medical Reviewer, PV Associate]
        columns: [ae_ref, seriousness, outcome, awareness_date, safety_case_id, status]
        add: { label: Capture AE, prefill: { inquiry: hero } }
      - code: activity
        label: Activity
        type: timeline
        roles: [MI Specialist, Medical Reviewer, PV Associate]
        sources:
          - { entity: inquiry, events: [created, updated, transition, tag] }
          - { entity: response, via: inquiry, events: [created, transition] }
          - { entity: follow_up, via: inquiry, events: [created] }
          - { entity: ae_report, via: inquiry, events: [created, transition] }
    states:
      not_found: { title: Inquiry not found, back_to: inquiries }

  - code: reporter_360
    hero: reporter
    title: "{full_name}"
    back_to: reporters
    layout: header_tabs
    roles: [MI Specialist, Medical Reviewer, MSL]
    header:
      avatar: { fallback_initials: full_name }
      title: full_name
      subtitle: ["{reporter_ref}", "{reporter_type}", "{institution}"]
      facts:
        - { label: Registration no., field: registration_no, copyable: true, fallback: "—" }
        - { label: Specialty, field: specialty, fallback: "—" }
        - { label: Email, field: email, copyable: true }
        - { label: CRM ID, field: crm_id, fallback: "Not synced" }
      actions:
        buttons:
          - { key: new_inquiry, label: New Inquiry, icon: plus, type: create_related, entity: inquiry, prefill: { reporter: hero }, roles: [MI Specialist, MSL] }
          - { key: edit, label: Edit, type: edit, roles: [MI Specialist] }
    stats:
      - { label: Open inquiries, value: { count: inquiry, via: reporter, where: "status in [new, in_progress, awaiting_info]" }, tone: blue, link_to_tab: inquiries }
      - { label: All inquiries, value: { count: inquiry, via: reporter }, tone: gray, link_to_tab: inquiries }
      - { label: Responses sent, value: { count: response, via: inquiry.reporter, where: status == sent }, tone: green, link_to_tab: responses }
    tabs:
      - code: inquiries
        label: Inquiries
        type: related_table
        entity: inquiry
        via: reporter
        count_badge: true
        columns: [inquiry_ref, product, category, received_on, due_on, status]
        add: { label: New Inquiry, prefill: { reporter: hero } }
      - code: responses
        label: Responses
        type: related_table
        entity: response
        via: inquiry.reporter
        count_badge: true
        columns: [response_ref, inquiry, response_type, sent_on, status]
        add: false
      - code: activity
        label: Activity
        type: timeline
        sources:
          - { entity: reporter, events: [created, updated] }
          - { entity: inquiry, via: reporter, events: [created, transition] }
